# AppEval API Server 默认配置（不依赖 test2，独立使用）
# 启动: python appeval/api_server/server.py --port 8888 --no-callback

# 并行 worker 数（建议 5~8，过大可能导致 OCR 初始化拥塞）
workers: 6
model: remote

# 本地测试不回调：设为 true 时任务完成后不 POST，仅写 /status 与 api_log（可用 --no-callback 覆盖）
skip_callback: false
# 本地测试时回调到自己：填本机接收地址（如 http://127.0.0.1:9999），需先起 receive_callback.py；正式环境改对方地址或用 --callback-url 覆盖
# 本地测试用：
# callback_base_url: "http://127.0.0.1:9999"
# 正式环境用：
callback_base_url: "http://192.168.88.42:8000/api/v1/agent-eval/notice/detail/1"
# 回调重试策略（当 HTTP 失败或回调响应 $.data.success != true 时触发）
callback_retry_times: 3
callback_retry_interval_sec: 30
chrome_disable_web_security: true
cuda_devices: [0]

