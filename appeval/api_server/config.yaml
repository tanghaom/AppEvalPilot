  model: gpt-4o
  base_url: https://newapi.deepwisdom.ai/v1
  api_key: "sk-zOXSb4VOWafSXatZlRjpZ5B8q7Oq3ilb5LH7YUqYIf0UiTeU"
  stream: "false"
  max_token: 8192

