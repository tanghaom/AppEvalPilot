<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Auth - Login/Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #e2e8f0; /* slate-200 */
        }

        /* Custom Tailwind JIT directives for dynamic classes if needed, or extend config */
        /* We will use the tailwind.config script tag for extensions. */

        /* Floating label styles */
        .form-group {
            position: relative;
            margin-bottom: 1.75rem; /* ~space-y-7 */
        }
        .form-label {
            position: absolute;
            left: 1rem; /* Corresponds to px-4 on input */
            top: 0.875rem; /* Corresponds to py-3 on input */
            color: #94a3b8; /* slate-400 */
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left top;
        }
        .form-input:focus + .form-label,
        .form-input:not(:placeholder-shown) + .form-label {
            top: -0.625rem; /* text-xs = 12px, so move it up a bit more */
            left: 0.75rem;
            font-size: 0.75rem; /* text-xs */
            color: #22d3ee; /* cyan-400 */
            /* Bouncy feel for label when it floats up */
            transform: scale(0.95); /* Slightly smaller when floated */
        }
        .form-input:focus + .form-label {
            /* Slight "pop" when focused */
            animation: labelPop 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes labelPop {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); } /* Pop out */
            100% { transform: scale(0.95); }
        }
        
        /* Music notes */
        .music-note {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0;
            pointer-events: none;
            animation: floatFade 2s ease-out forwards;
            z-index: 10; /* Above inputs potentially */
        }
        @keyframes floatFade {
            0% { opacity: 0.3; transform: translateY(0px) translateX(0px) scale(0.6) rotate(0deg); }
            20% { opacity: 1; transform: translateY(-15px) translateX(5px) scale(1) rotate(-10deg); }
            80% { opacity: 1; transform: translateY(-50px) translateX(-5px) scale(1) rotate(10deg); }
            100% { opacity: 0; transform: translateY(-70px) translateX(0px) scale(0.6) rotate(0deg); }
        }

        /* Parallax background elements */
        .parallax-bg-element {
            position: fixed;
            transition: transform 0.2s cubic-bezier(0.33, 1, 0.68, 1); /* Smooth parallax */
            z-index: -1;
            opacity: 0.4;
        }
        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #475569; /* slate-600 */
        }
        .line {
            width: 1px;
            height: 50px; /* Randomize this */
            background-color: #475569; /* slate-600 */
        }
        
        /* Input field hover (subtle bulge/glow) */
        .interactive-input-container:hover .form-input {
            transform: scaleX(1.015);
            box-shadow: 0 0 12px 2px var(--tw-shadow-color); /* Using CSS var for shadow color */
            --tw-shadow-color: theme('colors.cyan.500 / 0.3');
        }
        .form-input {
            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out, border-color 0.3s ease-out;
        }

        /* Button hover/active */
        .btn-primary {
            transition: background-color 0.2s ease-out, transform 0.15s ease-out, box-shadow 0.2s ease-out;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.03);
        }
        .btn-primary:active {
            transform: translateY(0px) scale(0.97);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 selection:bg-cyan-500 selection:text-slate-900 overflow-hidden">

    <div id="parallax-container" class="fixed inset-0">
        <!-- Parallax elements will be generated by JS -->
    </div>

    <main id="auth-form-container" class="relative bg-slate-800/70 backdrop-blur-lg p-6 sm:p-10 rounded-2xl shadow-2xl shadow-slate-950/50 w-full max-w-md transition-transform duration-500 ease-out">
        <div class="form-view-port relative w-full h-[34rem] sm:h-[36rem] overflow-hidden">
            <!-- Login Form -->
            <form id="login-form" class="auth-form absolute inset-0 p-2 transition-all duration-700 ease-[cubic-bezier(0.68,-0.55,0.27,1.55)] opacity-100 transform translate-x-0">
                <h2 class="text-3xl font-semibold text-center mb-3 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">Welcome Back!</h2>
                <p class="text-slate-400 text-center mb-8">Login to continue your journey.</p>
                
                <div class="form-group interactive-input-container">
                    <input type="email" id="login-email" name="login-email" class="form-input w-full px-4 py-3 bg-slate-700/50 border-2 border-slate-600 rounded-lg focus:border-cyan-500 focus:ring-cyan-500/50 focus:ring-1 outline-none placeholder-transparent peer" placeholder=" " required>
                    <label for="login-email" class="form-label">Email Address</label>
                </div>

                <div class="form-group interactive-input-container">
                    <input type="password" id="login-password" name="login-password" class="form-input w-full px-4 py-3 bg-slate-700/50 border-2 border-slate-600 rounded-lg focus:border-cyan-500 focus:ring-cyan-500/50 focus:ring-1 outline-none placeholder-transparent peer" placeholder=" " required>
                    <label for="login-password" class="form-label">Password</label>
                </div>
                
                <div class="flex justify-between items-center mb-8 text-sm">
                    <label class="flex items-center text-slate-400">
                        <input type="checkbox" class="h-4 w-4 rounded bg-slate-600 border-slate-500 text-cyan-500 focus:ring-cyan-400 mr-2">
                        Remember me
                    </label>
                    <a href="#" class="text-cyan-400 hover:text-cyan-300 hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary w-full bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg hover:shadow-cyan-500/30 active:shadow-cyan-500/20">
                    Login
                </button>

                <p class="mt-8 text-center text-sm text-slate-400">
                    Don't have an account? 
                    <a href="#" id="show-register-link" class="font-medium text-cyan-400 hover:text-cyan-300 hover:underline">Register here</a>
                </p>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form absolute inset-0 p-2 transition-all duration-700 ease-[cubic-bezier(0.68,-0.55,0.27,1.55)] opacity-0 transform translate-x-full pointer-events-none">
                <h2 class="text-3xl font-semibold text-center mb-3 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-orange-400">Create Account</h2>
                <p class="text-slate-400 text-center mb-8">Join us and start your adventure!</p>
                
                <div class="form-group interactive-input-container">
                    <input type="text" id="register-username" name="register-username" class="form-input w-full px-4 py-3 bg-slate-700/50 border-2 border-slate-600 rounded-lg focus:border-pink-500 focus:ring-pink-500/50 focus:ring-1 outline-none placeholder-transparent peer" placeholder=" " required>
                    <label for="register-username" class="form-label">Username</label>
                </div>

                <div class="form-group interactive-input-container">
                    <input type="email" id="register-email" name="register-email" class="form-input w-full px-4 py-3 bg-slate-700/50 border-2 border-slate-600 rounded-lg focus:border-pink-500 focus:ring-pink-500/50 focus:ring-1 outline-none placeholder-transparent peer" placeholder=" " required>
                    <label for="register-email" class="form-label">Email Address</label>
                </div>

                <div class="form-group interactive-input-container">
                    <input type="password" id="register-password" name="register-password" class="form-input w-full px-4 py-3 bg-slate-700/50 border-2 border-slate-600 rounded-lg focus:border-pink-500 focus:ring-pink-500/50 focus:ring-1 outline-none placeholder-transparent peer" placeholder=" " required>
                    <label for="register-password" class="form-label">Password</label>
                </div>
                
                <button type="submit" class="btn-primary w-full bg-gradient-to-r from-pink-500 to-orange-500 hover:from-pink-400 hover:to-orange-400 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg hover:shadow-pink-500/30 active:shadow-pink-500/20">
                    Register
                </button>

                <p class="mt-8 text-center text-sm text-slate-400">
                    Already have an account? 
                    <a href="#" id="show-login-link" class="font-medium text-pink-400 hover:text-pink-300 hover:underline">Login here</a>
                </p>
            </form>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-slate-800/80 backdrop-blur-sm flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 z-50 rounded-2xl">
            <div class="w-12 h-12 border-4 border-dashed border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-4 text-cyan-300 text-lg">Processing...</p>
        </div>
    </main>

    <script>
        // Tailwind config extension (optional, for very custom things not coverable by utilities)
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-cyan': '#22d3ee',
                        'brand-purple': '#a855f7',
                        'brand-pink': '#ec4899',
                        'brand-orange': '#f97316',
                    },
                    transitionTimingFunction: {
                      'elastic': 'cubic-bezier(0.68, -0.55, 0.27, 1.55)',
                    },
                    animation: {
                        'pulse-glow-cyan': 'pulseGlowCyan 2s infinite ease-in-out',
                    },
                    keyframes: {
                        pulseGlowCyan: {
                            '0%, 100%': { boxShadow: '0 0 6px theme("colors.cyan.500"), 0 0 12px theme("colors.cyan.500")', opacity: '1' },
                            '50%': { boxShadow: '0 0 12px theme("colors.cyan.500"), 0 0 24px theme("colors.cyan.500")', opacity: '0.85' },
                        }
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const showRegisterLink = document.getElementById('show-register-link');
            const showLoginLink = document.getElementById('show-login-link');
            const authFormContainer = document.getElementById('auth-form-container');
            const loadingOverlay = document.getElementById('loading-overlay');

            let currentForm = 'login'; // 'login' or 'register'

            function switchForms(target) {
                if (target === 'register' && currentForm === 'login') {
                    loginForm.classList.remove('opacity-100', 'translate-x-0');
                    loginForm.classList.add('opacity-0', '-translate-x-full', 'pointer-events-none');
                    
                    registerForm.classList.remove('opacity-0', 'translate-x-full', 'pointer-events-none');
                    registerForm.classList.add('opacity-100', 'translate-x-0');
                    currentForm = 'register';
                } else if (target === 'login' && currentForm === 'register') {
                    registerForm.classList.remove('opacity-100', 'translate-x-0');
                    registerForm.classList.add('opacity-0', 'translate-x-full', 'pointer-events-none');

                    loginForm.classList.remove('opacity-0', '-translate-x-full', 'pointer-events-none');
                    loginForm.classList.add('opacity-100', 'translate-x-0');
                    currentForm = 'login';
                }
            }

            showRegisterLink.addEventListener('click', (e) => {
                e.preventDefault();
                switchForms('register');
            });

            showLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                switchForms('login');
            });

            // Floating Music Notes
            const musicNoteChars = ['♪', '♫', '♩', '♬', '♭', '♮', '♯'];
            const noteColors = ['text-purple-400', 'text-pink-400', 'text-cyan-300', 'text-orange-400'];

            document.querySelectorAll('.form-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    if (Math.random() < 0.3) { // Don't create a note on every keystroke
                        createMusicNote(e.target);
                    }
                });
            });

            function createMusicNote(targetInput) {
                const noteEl = document.createElement('span');
                noteEl.textContent = musicNoteChars[Math.floor(Math.random() * musicNoteChars.length)];
                noteEl.className = `music-note ${noteColors[Math.floor(Math.random() * noteColors.length)]}`;
                
                const inputRect = targetInput.getBoundingClientRect();
                const containerRect = authFormContainer.getBoundingClientRect();

                // Position near the input field, slightly offset and random
                const xOffset = (Math.random() - 0.5) * 60; // Random horizontal offset
                const yOffset = (Math.random() - 0.5) * 20; // Random vertical offset

                noteEl.style.left = `${inputRect.left - containerRect.left + (inputRect.width / 2) + xOffset}px`;
                noteEl.style.top = `${inputRect.top - containerRect.top + yOffset - 10}px`; // Start above input

                authFormContainer.appendChild(noteEl);

                setTimeout(() => {
                    noteEl.remove();
                }, 2000); // Animation duration
            }

            // Parallax Effect
            const parallaxContainer = document.getElementById('parallax-container');
            const numParallaxElements = 60;
            const mainFormContainer = document.getElementById('auth-form-container');

            for (let i = 0; i < numParallaxElements; i++) {
                const el = document.createElement('div');
                const type = Math.random() > 0.7 ? 'line' : 'dot';
                el.classList.add('parallax-bg-element', type);
                el.style.left = `${Math.random() * 100}%`;
                el.style.top = `${Math.random() * 100}%`;
                el.dataset.depth = Math.random() * 0.6 + 0.1; // depth from 0.1 to 0.7
                if (type === 'line') {
                    el.style.height = `${Math.random() * 60 + 20}px`; // Random height for lines
                    el.style.transform = `rotate(${Math.random() * 90}deg)`;
                }
                parallaxContainer.appendChild(el);
            }

            document.body.addEventListener('mousemove', (e) => {
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const mouseX = e.clientX - centerX;
                const mouseY = e.clientY - centerY;

                document.querySelectorAll('.parallax-bg-element').forEach(el => {
                    const depth = parseFloat(el.dataset.depth);
                    const moveX = (mouseX * depth) / 20; // Adjust sensitivity
                    const moveY = (mouseY * depth) / 20;
                    const currentRotate = el.style.transform.includes('rotate') ? el.style.transform.match(/rotate\((.*?)\)/)[0] : '';
                    el.style.transform = `translateX(${moveX}px) translateY(${moveY}px) ${currentRotate}`;
                });
                
                // Subtle movement for the form container itself
                const formMoveX = (mouseX / centerX) * -3; // Max 3px movement
                const formMoveY = (mouseY / centerY) * -3;
                mainFormContainer.style.transform = `translateX(${formMoveX}px) translateY(${formMoveY}px)`;
            });

            // Form submission handling (dummy)
            [loginForm, registerForm].forEach(form => {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    // Animate form elements out (simple version)
                    const currentVisibleForm = currentForm === 'login' ? loginForm : registerForm;
                    Array.from(currentVisibleForm.elements).forEach((el, index) => {
                        if (el.tagName === 'INPUT' || el.tagName === 'BUTTON' || el.closest('.form-group')) {
                             const targetElement = el.closest('.form-group') || el;
                             targetElement.style.transition = `opacity 0.2s ease-out ${index * 0.03}s, transform 0.3s ease-out ${index * 0.03}s`;
                             targetElement.style.opacity = '0';
                             targetElement.style.transform = 'scale(0.9)';
                        }
                    });
                    
                    setTimeout(() => {
                        loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
                        loadingOverlay.classList.add('opacity-100');
                    }, 300); // Show after elements start fading

                    console.log(`${currentForm} form submitted`);
                    // Simulate API call
                    setTimeout(() => {
                        loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                        loadingOverlay.classList.remove('opacity-100');
                        
                        // Reset form elements for next view (important if not navigating away)
                        Array.from(currentVisibleForm.elements).forEach((el) => {
                            const targetElement = el.closest('.form-group') || el;
                            targetElement.style.transition = 'none'; // Remove transition for instant reset
                            targetElement.style.opacity = '1';
                            targetElement.style.transform = 'scale(1)';
                            setTimeout(() => targetElement.style.transition = '', 50); // Re-enable transitions
                        });

                        alert(`${currentForm === 'login' ? 'Login' : 'Registration'} successful (simulated)!`);
                        // Potentially switch back to login form or clear fields
                        // if (currentForm === 'register') switchForms('login');
                        // currentVisibleForm.reset();
                    }, 2500);
                });
            });
        });
    </script>
</body>
</html>
