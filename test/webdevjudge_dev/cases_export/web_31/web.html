<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slack Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a more Slack-like feel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        /* Track for main message list (lighter as it's on bg-gray-900) */
        #message-list-container::-webkit-scrollbar-track {
            background: #111827; /* gray-900 */
        }
        /* Track for sidebar (darker as it's on bg-gray-800) */
        .sidebar-scroll::-webkit-scrollbar-track {
             background: #1F2937; /* gray-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4B5563; /* gray-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6B7280; /* gray-500 */
        }
        /* Basic focus visible styling */
        :focus-visible {
            outline: 2px solid #38bdf8; /* sky-500 */
            outline-offset: 2px;
        }
        .sidebar-item-active {
            background-color: #374151; /* gray-700 */
            color: white !important; /* Important to override general text color */
            font-weight: 600; /* semibold */
        }
        /* Ensure child elements in active item also get brightened if needed */
        .sidebar-item-active span, .sidebar-item-active .channel-hash {
            color: white !important;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex h-screen antialiased overflow-hidden">

    <!-- Main Application Wrapper -->
    <div class="flex h-full w-full">

        <!-- Sidebar -->
        <aside class="w-72 bg-gray-800 flex flex-col border-r border-gray-700 shrink-0">
            <!-- Workspace Header -->
            <div class="h-16 flex items-center justify-between p-4 border-b border-gray-700 cursor-pointer hover:bg-gray-700 transition-colors duration-150 shrink-0">
                <h1 id="workspace-name" class="text-xl font-semibold text-white">Workspace</h1>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-gray-400">
                    <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                </svg>
            </div>

            <!-- Scrollable Area for Nav, Channels, DMs -->
            <div class="flex-1 overflow-y-auto py-2 space-y-6 sidebar-scroll">
                <!-- Navigation Items (Threads, DMs, Mentions etc. - simplified) -->
                <nav class="px-2 space-y-1">
                    <a href="#" class="flex items-center space-x-3 px-2 py-1.5 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md transition-colors duration-150 group">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-gray-400 group-hover:text-white">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3.697-3.697c-.022-.023-.043-.046-.065-.069a5.182 5.182 0 0 1-1.656-.43c-.31-.130-.63-.254-.96-.368a5.182 5.182 0 0 1-3.498 0c-.33.114-.65.238-.96.368a5.182 5.182 0 0 1-1.656.43c-.022.023-.043-.046-.065-.069L2.25 17.25v-3.091c-.34-.02-.68-.044-1.02-.071A2.099 2.099 0 0 1 0 12.894V8.608c0-.97.616-1.813 1.5-2.097L2.25 6c.023-.022.045-.044.068-.066a5.182 5.182 0 0 1 1.632-.428C4.282 5.41 4.618 5.286 4.95 5.16a5.182 5.182 0 0 1 3.498 0c.332.125.65.25.96.367a5.182 5.182 0 0 1 1.632.428c.023.022.045-.044.068.066l.75-.536ZM4.5 7.5a.75.75 0 0 0 0 1.5h9a.75.75 0 0 0 0-1.5h-9Z" />
                        </svg>
                        <span>Threads</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-2 py-1.5 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md transition-colors duration-150 group">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-gray-400 group-hover:text-white">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m8.118 0a12.025 12.025 0 0 1-8.118 0M12 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                        </svg>
                        <span>All DMs</span>
                    </a>
                </nav>

                <!-- Channels List -->
                <div class="px-2">
                    <div class="flex items-center justify-between mb-1">
                        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Channels</h2>
                        <button class="text-gray-400 hover:text-white focus:outline-none focus:ring-1 focus:ring-sky-500 rounded" aria-label="Add channel">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                                <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
                            </svg>
                        </button>
                    </div>
                    <ul id="channel-list" class="space-y-0.5">
                        <!-- Channels will be populated by JavaScript -->
                    </ul>
                </div>

                <!-- Direct Messages List -->
                <div class="px-2">
                    <div class="flex items-center justify-between mb-1">
                        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Direct Messages</h2>
                        <button class="text-gray-400 hover:text-white focus:outline-none focus:ring-1 focus:ring-sky-500 rounded" aria-label="Add direct message">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                                <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
                            </svg>
                        </button>
                    </div>
                    <ul id="dm-list" class="space-y-0.5">
                        <!-- DMs will be populated by JavaScript -->
                    </ul>
                </div>
            </div>

            <!-- User Profile Section (Simplified) -->
            <div class="p-3 border-t border-gray-700 flex items-center space-x-3 shrink-0">
                <div class="relative">
                    <div class="bg-gray-500 border-2 border-gray-600 rounded-full w-10 h-10 flex items-center justify-center">
                         <span id="current-user-initial" class="text-white font-semibold text-lg">Y</span>
                    </div>
                     <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-gray-800 rounded-full"></span>
                </div>
                <div>
                    <p id="current-user-name" class="text-sm font-medium text-white">Current User</p>
                    <p class="text-xs text-gray-400">Online</p>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col bg-gray-900 overflow-hidden">
            <!-- Header -->
            <header class="h-16 bg-gray-900 border-b border-gray-700 flex items-center justify-between px-6 shrink-0">
                <div>
                    <h2 id="chat-header-title" class="text-xl font-semibold text-white"># general</h2>
                    <p id="chat-header-subtitle" class="text-sm text-gray-400">Loading...</p>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <input type="search" placeholder="Search..." class="bg-gray-800 text-sm text-gray-300 rounded-md pl-10 pr-4 py-2 w-64 focus:ring-2 focus:ring-sky-500 focus:outline-none focus:bg-gray-700 transition-colors duration-150" />
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 text-gray-400">
                                <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>
                    <button class="text-gray-400 hover:text-white p-1.5 rounded-md hover:bg-gray-700 transition-colors duration-150" aria-label="Notifications">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Messages -->
            <div id="message-list-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Messages will be populated by JavaScript -->
            </div>

            <!-- Message Input -->
            <div class="p-4 bg-gray-900 border-t border-gray-700 shrink-0">
                <div class="bg-gray-700 rounded-lg flex items-center px-1 py-1 focus-within:ring-2 focus-within:ring-sky-500">
                     <button class="p-2 text-gray-400 hover:text-sky-400 hover:bg-gray-600 rounded-md transition-colors duration-150" aria-label="Add attachment">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                          <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
                        </svg>
                    </button>
                    <input type="text" id="message-input" placeholder="Message #channel-name" class="flex-1 bg-transparent text-gray-100 px-3 py-2 focus:outline-none placeholder-gray-500" />
                    <button id="send-button" class="p-2 text-sky-500 hover:text-sky-400 hover:bg-gray-600 rounded-md transition-colors duration-150" aria-label="Send message">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                            <path d="M3.105 3.105a.75.75 0 0 1 .815-.092l13.061 6.531a.75.75 0 0 1 0 1.312L3.92 17.013a.75.75 0 0 1-1.008-.99L4.886 10 2.917 3.995a.75.75 0 0 1 .188-.89Z" />
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const currentUser = { id: 'user1', name: 'You', avatarUrl: null };

        const appData = {
            workspaceName: "Tailwind Labs",
            channels: [
                { id: 'c1', name: 'general', description: 'Company-wide announcements', members: 125, messages: [
                    { id: 'm1', userId: 'user2', userName: 'Alice Wonderland', avatarUrl: null, text: 'Welcome to the team! Feel free to ask any questions. 🎉', timestamp: new Date(Date.now() - 1000 * 60 * 60 * 2).toISOString() },
                    { id: 'm2', userId: 'user3', userName: 'Bob The Builder', avatarUrl: null, text: 'Hey everyone, a new project brief is up in #project-alpha. Please take a look when you have a moment.', timestamp: new Date(Date.now() - 1000 * 60 * 30).toISOString() },
                    { id: 'm3', userId: 'user1', userName: 'You', avatarUrl: null, text: 'Thanks for the warm welcome! Excited to be here. What\'s the best way to get up to speed on current projects?', timestamp: new Date(Date.now() - 1000 * 60 * 15).toISOString() },
                ]},
                { id: 'c2', name: 'random', description: 'Off-topic discussions and fun', members: 98, messages: [
                    { id: 'm4', userId: 'user4', userName: 'Charlie Brown', avatarUrl: null, text: 'Anyone seen the new cat video? It\'s hilarious! 😹 https://example.com/cat-video', timestamp: new Date(Date.now() - 1000 * 60 * 5).toISOString() },
                ]},
                { id: 'c3', name: 'frontend-dev', description: 'All about frontend development', members: 15, messages: [] },
                { id: 'c4', name: 'design-critiques', description: 'Feedback on new designs', members: 22, messages: [] },
                { id: 'c5', name: 'product-releases', description: 'Updates on product launches', members: 150, messages: [] },
            ],
            directMessages: [
                { id: 'dm1', name: 'Alice Wonderland', userId: 'user2', online: true, messages: [
                    { id: 'm5', userId: 'user1', userName: 'You', avatarUrl: null, text: 'Hey Alice, quick question about the new design system documentation. Where can I find it?', timestamp: new Date(Date.now() - 1000 * 60 * 10).toISOString() },
                    { id: 'm6', userId: 'user2', userName: 'Alice Wonderland', avatarUrl: null, text: 'Sure, it\'s on our internal wiki under "Design Resources". Let me know if you can\'t find it!', timestamp: new Date(Date.now() - 1000 * 60 * 8).toISOString() },
                ]},
                { id: 'dm2', name: 'Bob The Builder', userId: 'user3', online: false, messages: [] },
                { id: 'dm3', name: 'Support Bot', userId: 'bot1', online: true, isBot: true, messages: [
                     { id: 'm7', userId: 'bot1', userName: 'Support Bot', avatarUrl: null, text: 'Hi there! I am a friendly assistant. How can I help you today?', timestamp: new Date(Date.now() - 1000 * 60 * 60 * 24).toISOString() },
                ] },
                { id: 'dm4', name: 'Eve The Engineer', userId: 'user5', online: true, messages: [] },

            ],
            activeView: { type: 'channel', id: 'c1' },
        };

        // DOM Elements
        const workspaceNameEl = document.getElementById('workspace-name');
        const channelListEl = document.getElementById('channel-list');
        const dmListEl = document.getElementById('dm-list');
        const chatHeaderTitleEl = document.getElementById('chat-header-title');
        const chatHeaderSubtitleEl = document.getElementById('chat-header-subtitle');
        const messageListContainerEl = document.getElementById('message-list-container');
        const messageInputEl = document.getElementById('message-input');
        const sendButtonEl = document.getElementById('send-button');
        const currentUserNameEl = document.getElementById('current-user-name');
        const currentUserInitialEl = document.getElementById('current-user-initial');


        function formatTimestamp(isoString) {
            const date = new Date(isoString);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) {
                return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
            } else if (date.toDateString() === yesterday.toDateString()) {
                return 'Yesterday ' + date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
            }
        }
        
        function renderSidebar() {
            workspaceNameEl.textContent = appData.workspaceName;
            currentUserNameEl.textContent = currentUser.name;
            currentUserInitialEl.textContent = currentUser.name.substring(0,1).toUpperCase();


            channelListEl.innerHTML = '';
            appData.channels.forEach(channel => {
                const li = document.createElement('li');
                const isActive = appData.activeView.type === 'channel' && appData.activeView.id === channel.id;
                
                li.innerHTML = `
                    <a href="#" data-type="channel" data-id="${channel.id}" class="flex items-center space-x-2 px-2 py-1 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md transition-colors duration-150 group ${isActive ? 'sidebar-item-active' : ''}">
                        <span class="channel-hash ${isActive ? 'text-white' : 'text-gray-500 group-hover:text-gray-300'}">#</span>
                        <span>${channel.name}</span>
                    </a>
                `;
                li.querySelector('a').addEventListener('click', (e) => {
                    e.preventDefault();
                    setActiveView('channel', channel.id);
                });
                channelListEl.appendChild(li);
            });

            dmListEl.innerHTML = '';
            appData.directMessages.forEach(dm => {
                const li = document.createElement('li');
                const isActive = appData.activeView.type === 'dm' && appData.activeView.id === dm.id;
                const avatarInitial = dm.name.substring(0,1).toUpperCase();
                const avatarColors = ['bg-pink-500', 'bg-blue-500', 'bg-green-500', 'bg-yellow-500', 'bg-purple-500', 'bg-red-500', 'bg-indigo-500', 'bg-teal-500'];
                // Simple hash for user ID to pick a color, ensuring consistency
                let colorIndex = 0;
                for(let i = 0; i < dm.userId.length; i++) {
                    colorIndex = (colorIndex + dm.userId.charCodeAt(i)) % avatarColors.length;
                }
                const avatarColorClass = dm.isBot ? 'bg-gray-600' : avatarColors[colorIndex];


                li.innerHTML = `
                    <a href="#" data-type="dm" data-id="${dm.id}" class="flex items-center space-x-2 px-2 py-1 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md transition-colors duration-150 group ${isActive ? 'sidebar-item-active' : ''}">
                        <div class="relative w-5 h-5 flex-shrink-0">
                            <div class="w-full h-full rounded-full ${avatarColorClass} flex items-center justify-center text-xs text-white font-semibold">
                                ${dm.isBot ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-3 h-3"><path d="M8 1a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7ZM3 10.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0Zm9.5 1.436a.5.5 0 0 1-.25.447l-2.5 1.5a.5.5 0 0 1-.75-.447V12.5h-1.5a.5.5 0 0 1 0-1H9V9.793a.5.5 0 0 1 .75-.447l2.5 1.5a.5.5 0 0 1 .25.447ZM12 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" /></svg>` : avatarInitial}
                            </div>
                            ${dm.online && !dm.isBot ? '<span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-400 border-2 border-gray-800 rounded-full"></span>' : ''}
                        </div>
                        <span>${dm.name}</span>
                         ${dm.isBot ? '<span class="ml-auto text-xs bg-sky-600 text-white px-1.5 py-0.5 rounded-full">BOT</span>' : ''}
                    </a>
                `;
                li.querySelector('a').addEventListener('click', (e) => {
                    e.preventDefault();
                    setActiveView('dm', dm.id);
                });
                dmListEl.appendChild(li);
            });
        }

        function renderChatArea() {
            let currentConversation;
            let titlePrefix = '';
            let subtitle = '';

            if (appData.activeView.type === 'channel') {
                currentConversation = appData.channels.find(c => c.id === appData.activeView.id);
                titlePrefix = '# ';
                subtitle = currentConversation ? `${currentConversation.members} members | ${currentConversation.description}` : 'Channel not found';
            } else if (appData.activeView.type === 'dm') {
                currentConversation = appData.directMessages.find(dm => dm.id === appData.activeView.id);
                subtitle = currentConversation ? (currentConversation.isBot ? 'Bot' : (currentConversation.online ? 'Online' : 'Offline')) : 'DM not found';
            }

            if (!currentConversation) {
                chatHeaderTitleEl.textContent = 'Select a conversation';
                chatHeaderSubtitleEl.textContent = '';
                messageListContainerEl.innerHTML = '<p class="text-gray-400 text-center">No messages yet.</p>';
                messageInputEl.placeholder = `Message...`;
                messageInputEl.disabled = true;
                sendButtonEl.disabled = true;
                return;
            }

            messageInputEl.disabled = false;
            sendButtonEl.disabled = false;

            chatHeaderTitleEl.textContent = titlePrefix + currentConversation.name;
            chatHeaderSubtitleEl.textContent = subtitle;
            messageInputEl.placeholder = `Message ${titlePrefix}${currentConversation.name}`;

            messageListContainerEl.innerHTML = '';
            if (currentConversation.messages.length === 0) {
                messageListContainerEl.innerHTML = '<p class="text-gray-400 text-center py-4">No messages yet in this conversation. Be the first to say something!</p>';
            } else {
                currentConversation.messages.forEach(msg => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'flex items-start space-x-3 py-1 group hover:bg-gray-800/50 px-2 -mx-2 rounded-md';
                    
                    const avatarInitial = msg.userName.substring(0,1).toUpperCase();
                    const avatarColors = ['bg-pink-500', 'bg-blue-500', 'bg-green-500', 'bg-yellow-500', 'bg-purple-500', 'bg-red-500', 'bg-indigo-500', 'bg-teal-500'];
                    const isBotMsg = appData.directMessages.find(dm => dm.userId === msg.userId && dm.isBot) || (msg.userId === 'bot1' && msg.userName === 'Support Bot');
                    
                    let colorIndex = 0;
                    for(let i = 0; i < msg.userId.length; i++) {
                        colorIndex = (colorIndex + msg.userId.charCodeAt(i)) % avatarColors.length;
                    }
                    const avatarColorClass = msg.avatarUrl ? '' : (isBotMsg ? 'bg-gray-600' : avatarColors[colorIndex]);
                    
                    messageDiv.innerHTML = `
                        <div class="w-10 h-10 rounded-md flex-shrink-0 ${avatarColorClass} flex items-center justify-center text-white font-bold text-lg mt-1">
                            ${msg.avatarUrl ? `<img src="${msg.avatarUrl}" alt="${msg.userName}" class="w-full h-full rounded-md object-cover">` : (isBotMsg ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-5 h-5"><path d="M8 1a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7ZM3 10.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0Zm9.5 1.436a.5.5 0 0 1-.25.447l-2.5 1.5a.5.5 0 0 1-.75-.447V12.5h-1.5a.5.5 0 0 1 0-1H9V9.793a.5.5 0 0 1 .75-.447l2.5 1.5a.5.5 0 0 1 .25.447ZM12 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" /></svg>`: avatarInitial)}
                        </div>
                        <div>
                            <div class="flex items-baseline space-x-2">
                                <span class="font-semibold text-white">${msg.userName} ${isBotMsg ? '<span class="ml-1 text-xs bg-sky-600 text-white px-1.5 py-0.5 rounded-full align-middle">BOT</span>':''}</span>
                                <span class="text-xs text-gray-500 group-hover:text-gray-400 transition-colors duration-150">${formatTimestamp(msg.timestamp)}</span>
                            </div>
                            <p class="text-gray-200 whitespace-pre-wrap">${msg.text}</p>
                        </div>
                    `;
                    messageListContainerEl.appendChild(messageDiv);
                });
            }
            messageListContainerEl.scrollTop = messageListContainerEl.scrollHeight;
        }

        function setActiveView(type, id) {
            appData.activeView = { type, id };
            renderSidebar();
            renderChatArea();
        }

        function handleSendMessage() {
            const text = messageInputEl.value.trim();
            if (!text) return;

            const newMessage = {
                id: 'm' + Date.now(),
                userId: currentUser.id,
                userName: currentUser.name,
                avatarUrl: currentUser.avatarUrl,
                text: text,
                timestamp: new Date().toISOString()
            };

            let targetConversation;
            if (appData.activeView.type === 'channel') {
                targetConversation = appData.channels.find(c => c.id === appData.activeView.id);
            } else if (appData.activeView.type === 'dm') {
                targetConversation = appData.directMessages.find(dm => dm.id === appData.activeView.id);
            }

            if (targetConversation) {
                targetConversation.messages.push(newMessage);
                renderChatArea();
                messageInputEl.value = '';
                messageInputEl.focus();
            }
        }

        sendButtonEl.addEventListener('click', handleSendMessage);
        messageInputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        });
        
        function init() {
            renderSidebar();
            renderChatArea();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
