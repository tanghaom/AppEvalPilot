<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        /* Custom scrollbar for webkit browsers */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            @apply bg-light-bg dark:bg-dark-bg;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            @apply bg-light-border dark:bg-dark-border rounded-full;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            @apply bg-gray-400 dark:bg-gray-500;
        }
        .task-card-dragging {
            @apply opacity-50 ring-2 ring-accent-blue;
        }
        .drag-over-column {
            @apply ring-2 ring-accent-green ring-offset-2;
        }
        /* For Chart.js legend text color in dark mode */
        .chartjs-legend-text-dark { color: #E9ECEF !important; }
        .chartjs-legend-text-light { color: #212529 !important; }
        .chartjs-axis-text-dark { color: #ADB5BD !important; }
        .chartjs-axis-text-light { color: #6C757D !important; }

        /* Print styles */
        @media print {
            body {
                font-size: 10pt;
            }
            .print-hidden { display: none !important; }
            .print-visible { display: block !important; }
            .print-text-black { color: black !important; }
            .print-bg-white { background-color: white !important; }
            #kanban-container {
                overflow-x: visible !important;
                flex-wrap: wrap !important; /* Or handle columns better for print */
            }
            .kanban-column {
                min-width: 200px !important; /* Adjust for print */
                page-break-inside: avoid;
            }
            .task-card {
                page-break-inside: avoid;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
            }
        }

    </style>
</head>
<body class="bg-light-bg dark:bg-dark-bg text-light-text-primary dark:text-dark-text-primary font-sans transition-colors duration-300 overflow-hidden">

    <div class="flex h-screen">
        <!-- Left Navigation Panel -->
        <nav id="left-nav" class="w-16 md:w-64 p-2 md:p-4 space-y-6 bg-light-card dark:bg-dark-card shadow-lg print-hidden transition-all duration-300 flex flex-col items-center md:items-stretch">
            <div class="text-2xl font-bold text-accent-blue hidden md:block mb-6 text-center">TaskMaster</div>
            <div class="text-2xl font-bold text-accent-blue md:hidden mb-6 text-center">TM</div>
            
            <a href="#" data-section="dashboard" class="nav-link group flex items-center space-x-3 px-2 py-2 md:px-4 md:py-3 rounded-lg hover:bg-accent-blue/10 dark:hover:bg-accent-blue/20 text-light-text-secondary dark:text-dark-text-secondary hover:text-accent-blue dark:hover:text-accent-blue transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                <span class="hidden md:inline">Dashboard</span>
            </a>
            <a href="#" data-section="analytics" class="nav-link group flex items-center space-x-3 px-2 py-2 md:px-4 md:py-3 rounded-lg hover:bg-accent-blue/10 dark:hover:bg-accent-blue/20 text-light-text-secondary dark:text-dark-text-secondary hover:text-accent-blue dark:hover:text-accent-blue transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="hidden md:inline">Analytics</span>
            </a>
            <a href="#" data-section="settings" class="nav-link group flex items-center space-x-3 px-2 py-2 md:px-4 md:py-3 rounded-lg hover:bg-accent-blue/10 dark:hover:bg-accent-blue/20 text-light-text-secondary dark:text-dark-text-secondary hover:text-accent-blue dark:hover:text-accent-blue transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="hidden md:inline">Settings</span>
            </a>

            <div class="mt-auto pt-6 hidden md:block"> <!-- Theme Toggle for medium screens and up -->
                <button id="theme-toggle-desktop" class="w-full flex items-center justify-center space-x-2 p-3 rounded-lg bg-light-bg dark:bg-dark-bg hover:bg-light-border dark:hover:bg-dark-border transition-colors">
                    <svg id="theme-toggle-dark-icon-desktop" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon-desktop" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm-.707 8.486a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    <span class="hidden md:inline">Toggle Theme</span>
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content-area" class="flex-1 flex flex-col overflow-hidden relative"> <!-- Added relative for mobile menu button positioning -->
            <!-- Mobile Nav Toggle for left panel -->
            <button id="mobile-menu-button" class="md:hidden fixed top-4 left-4 z-20 p-2 bg-light-card dark:bg-dark-card rounded-md shadow-md print-hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            
            <!-- Top Header -->
            <header id="main-header" class="p-4 border-b border-light-border dark:border-dark-border bg-light-card dark:bg-dark-card print-hidden transition-colors duration-300">
                <div class="flex flex-col md:flex-row justify-between items-center space-y-2 md:space-y-0">
                    <div class="flex items-center space-x-2 w-full md:w-auto">
                        <input type="text" id="search-task" placeholder="Search tasks..." class="w-full md:w-64 px-3 py-2 border border-light-border dark:border-dark-border rounded-lg bg-light-bg dark:bg-dark-bg focus:ring-2 focus:ring-accent-blue focus:border-transparent outline-none transition-colors">
                    </div>
                    <div class="flex items-center space-x-2 w-full md:w-auto justify-between md:justify-end">
                        <select id="filter-priority" class="filter-select px-3 py-2 border border-light-border dark:border-dark-border rounded-lg bg-light-bg dark:bg-dark-bg focus:ring-2 focus:ring-accent-blue focus:border-transparent outline-none transition-colors">
                            <option value="">All Priorities</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                        <select id="filter-user" class="filter-select px-3 py-2 border border-light-border dark:border-dark-border rounded-lg bg-light-bg dark:bg-dark-bg focus:ring-2 focus:ring-accent-blue focus:border-transparent outline-none transition-colors">
                            <option value="">All Users</option>
                            <!-- Users will be populated by JS -->
                        </select>
                        <button id="add-task-btn" class="bg-accent-blue hover:bg-accent-blue-hover text-white font-semibold px-4 py-2 rounded-lg flex items-center space-x-2 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                            <span>Add Task</span>
                        </button>
                        <button id="toggle-analytics-panel-btn" class="lg:hidden p-2 bg-light-bg dark:bg-dark-bg rounded-md hover:bg-light-border dark:hover:bg-dark-border">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </button>
                        <button id="theme-toggle-mobile" class="md:hidden p-2 bg-light-bg dark:bg-dark-bg rounded-md hover:bg-light-border dark:hover:bg-dark-border">
                            <svg id="theme-toggle-dark-icon-mobile" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                            <svg id="theme-toggle-light-icon-mobile" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm-.707 8.486a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Content: Kanban Board or Settings -->
            <div id="dashboard-section" class="flex-1 flex p-4 gap-4 overflow-x-auto custom-scrollbar">
                <!-- Kanban columns will be dynamically inserted here -->
                <div id="todo-column" data-status="todo" class="kanban-column bg-light-bg dark:bg-dark-bg p-3 rounded-lg min-w-[300px] md:min-w-[350px] flex-shrink-0 h-full flex flex-col">
                    <h3 class="text-lg font-semibold mb-3 p-2 bg-light-card dark:bg-dark-card rounded-md shadow text-center">To Do</h3>
                    <div class="task-list flex-1 space-y-3 overflow-y-auto custom-scrollbar p-1"></div>
                </div>
                <div id="inprogress-column" data-status="inprogress" class="kanban-column bg-light-bg dark:bg-dark-bg p-3 rounded-lg min-w-[300px] md:min-w-[350px] flex-shrink-0 h-full flex flex-col">
                    <h3 class="text-lg font-semibold mb-3 p-2 bg-light-card dark:bg-dark-card rounded-md shadow text-center">In Progress</h3>
                    <div class="task-list flex-1 space-y-3 overflow-y-auto custom-scrollbar p-1"></div>
                </div>
                <div id="done-column" data-status="done" class="kanban-column bg-light-bg dark:bg-dark-bg p-3 rounded-lg min-w-[300px] md:min-w-[350px] flex-shrink-0 h-full flex flex-col">
                    <h3 class="text-lg font-semibold mb-3 p-2 bg-light-card dark:bg-dark-card rounded-md shadow text-center">Done</h3>
                    <div class="task-list flex-1 space-y-3 overflow-y-auto custom-scrollbar p-1"></div>
                </div>
            </div>

            <div id="settings-section" class="hidden flex-1 p-6 overflow-y-auto custom-scrollbar">
                <h2 class="text-2xl font-semibold mb-6">Settings</h2>
                <div class="space-y-4 max-w-md">
                    <div class="p-4 bg-light-card dark:bg-dark-card rounded-lg shadow">
                        <h3 class="text-lg font-medium mb-2">Theme</h3>
                        <p class="text-sm text-light-text-secondary dark:text-dark-text-secondary mb-3">Switch between light and dark mode.</p>
                        <button id="settings-theme-toggle" class="w-full flex items-center justify-center space-x-2 p-3 rounded-lg bg-light-bg dark:bg-dark-bg hover:bg-light-border dark:hover:bg-dark-border transition-colors">
                            <svg id="settings-theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                            <svg id="settings-theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm-.707 8.486a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                            <span>Toggle Theme</span>
                        </button>
                    </div>
                    <div class="p-4 bg-light-card dark:bg-dark-card rounded-lg shadow">
                        <h3 class="text-lg font-medium mb-2">Data Management</h3>
                        <button id="export-tasks-btn" class="w-full bg-accent-green hover:bg-accent-green-hover text-white font-semibold px-4 py-2 rounded-lg flex items-center justify-center space-x-2 transition-colors mb-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            <span>Export Tasks to Excel</span>
                        </button>
                        <button id="clear-data-btn" class="w-full bg-accent-red hover:bg-accent-red-hover text-white font-semibold px-4 py-2 rounded-lg flex items-center justify-center space-x-2 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            <span>Clear All Data</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Analytics Panel -->
        <aside id="right-analytics-panel" class="w-full lg:w-96 p-4 space-y-6 border-l border-light-border dark:border-dark-border bg-light-card dark:bg-dark-card overflow-y-auto custom-scrollbar print-hidden fixed inset-y-0 right-0 transform translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 z-30">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold">Analytics</h2>
                <button id="close-analytics-panel-btn" class="lg:hidden p-1 rounded-md hover:bg-light-border dark:hover:bg-dark-border">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div>
                <h3 class="text-md font-medium mb-2">Overall Progress</h3>
                <div class="w-full bg-light-border dark:bg-dark-border rounded-full h-6">
                    <div id="progress-bar" class="bg-accent-green h-6 rounded-full text-xs font-medium text-white text-center p-1 leading-none transition-all duration-500" style="width: 0%">0%</div>
                </div>
            </div>

            <div>
                <h3 class="text-md font-medium mb-2">Tasks per Status</h3>
                <div class="p-2 bg-light-bg dark:bg-dark-bg rounded-lg h-64 md:h-72">
                    <canvas id="tasks-per-status-chart"></canvas>
                </div>
            </div>

            <div>
                <h3 class="text-md font-medium mb-2">Tasks Due (Next 7 Days)</h3>
                <div class="p-2 bg-light-bg dark:bg-dark-bg rounded-lg h-64 md:h-72">
                    <canvas id="tasks-due-chart"></canvas>
                </div>
            </div>
            
            <!-- Placeholder for future analytics components -->
            <!-- <div class="bg-gray-200 border-2 border-dashed rounded-xl w-full h-32"></div> -->
        </aside>
    </div>

    <!-- Task Modal -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 print-hidden"></div>
    <div id="task-modal" class="fixed inset-0 flex items-center justify-center hidden z-50 p-4 print-hidden">
      <div class="bg-light-card dark:bg-dark-card p-6 rounded-lg shadow-xl w-full max-w-lg transform transition-all scale-95 opacity-0">
        <div class="flex justify-between items-center mb-4">
            <h2 id="modal-title" class="text-xl font-semibold">Add New Task</h2>
            <button id="close-modal-btn" class="p-1 rounded-md hover:bg-light-border dark:hover:bg-dark-border">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <form id="task-form">
            <input type="hidden" id="task-id">
            <div class="mb-4">
                <label for="task-title" class="block text-sm font-medium mb-1">Title</label>
                <input type="text" id="task-title" class="w-full px-3 py-2 border border-light-border dark:border-dark-border rounded-lg bg-light-bg dark:bg-dark-bg focus:ring-2 focus:ring-accent-blue focus:border-transparent outline-none" required>
            </div>
            <div class="mb-4">
                <label for="task-description" class="block text-sm font-medium mb-1">Description</label>
                <textarea id="task-description" rows="3" class="w-full px-3 py-2 border border-light-border dark:border-dark-border rounded-lg bg-light-bg dark:bg-dark-bg focus:ring-2 focus:ring-accent-blue focus:border-transparent outline-none"></textarea>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="task-deadline" class="block text-sm font-medium mb-1">Deadline</label>
                    <input type="date" id="task-deadline" class="w-full px-3 py-2 border border-light-border dark:border-dark-border rounded-lg bg-light-bg dark:bg-dark-bg focus:ring-2 focus:ring-accent-blue focus:border-transparent outline-none" required>
                </div>
                <div>
                    <label for="task-priority" class="block text-sm font-medium mb-1">Priority</label>
                    <select id="task-priority" class="w-full px-3 py-2 border border-light-border dark:border-dark-border rounded-lg bg-light-bg dark:bg-dark-bg focus:ring-2 focus:ring-accent-blue focus:border-transparent outline-none" required>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>
            <div class="mb-6">
                <label for="task-user" class="block text-sm font-medium mb-1">Assigned User</label>
                <select id="task-user" class="w-full px-3 py-2 border border-light-border dark:border-dark-border rounded-lg bg-light-bg dark:bg-dark-bg focus:ring-2 focus:ring-accent-blue focus:border-transparent outline-none" required>
                     <!-- Users will be populated by JS -->
                </select>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" id="cancel-task-btn" class="px-4 py-2 border border-light-border dark:border-dark-border rounded-lg hover:bg-light-border dark:hover:bg-dark-border transition-colors">Cancel</button>
                <button type="submit" id="save-task-btn" class="bg-accent-blue hover:bg-accent-blue-hover text-white font-semibold px-4 py-2 rounded-lg transition-colors">Save Task</button>
            </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        // Tailwind Configuration
        tailwind.config = {
            darkMode: 'class',
            theme: {
              extend: {
                colors: {
                  'light-bg': '#F8F9FA',
                  'light-card': '#FFFFFF',
                  'light-text-primary': '#212529',
                  'light-text-secondary': '#6C757D',
                  'light-border': '#DEE2E6',
                  'dark-bg': '#121212', // Slightly desaturated very dark blue/gray
                  'dark-card': '#1E1E1E', // Dark gray
                  'dark-text-primary': '#E9ECEF',
                  'dark-text-secondary': '#ADB5BD',
                  'dark-border': '#373A3C', // Darker gray border for better contrast on dark-card

                  'accent-blue': { DEFAULT: '#007BFF', hover: '#0056b3' }, // Brighter blue
                  'accent-green': { DEFAULT: '#28A745', hover: '#1e7e34' },
                  'accent-red': { DEFAULT: '#DC3545', hover: '#c82333' },
                  'accent-yellow': { DEFAULT: '#FFC107', hover: '#e0a800' }, // Brighter yellow
                  'accent-purple': { DEFAULT: '#6F42C1', hover: '#5a32a3' },

                  'priority-high': '#DC3545',
                  'priority-medium': '#FFC107',
                  'priority-low': '#28A745',
                },
                transitionProperty: {
                    'width': 'width',
                    'transform': 'transform',
                    'bg': 'background-color',
                },
              }
            }
        };

        // App State
        let tasks = [];
        let users = ['Alice', 'Bob', 'Carol', 'David', 'Eve', 'System', 'Unassigned'];
        const priorities = { low: 'Low', medium: 'Medium', high: 'High' };
        const statusMap = { todo: 'To Do', inprogress: 'In Progress', done: 'Done' };
        let currentFilters = { priority: '', user: '', searchTerm: '' };
        let editingTaskId = null;
        let tasksPerStatusChart = null;
        let tasksDueChart = null;
        let currentSection = 'dashboard'; // 'dashboard' or 'settings'

        // DOM Elements
        const taskModal = document.getElementById('task-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const taskForm = document.getElementById('task-form');
        const addTaskBtn = document.getElementById('add-task-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelTaskBtn = document.getElementById('cancel-task-btn');
        const modalTitle = document.getElementById('modal-title');
        
        const searchInput = document.getElementById('search-task');
        const filterPrioritySelect = document.getElementById('filter-priority');
        const filterUserSelect = document.getElementById('filter-user');
        
        const progressBar = document.getElementById('progress-bar');
        const exportTasksBtn = document.getElementById('export-tasks-btn');
        const clearDataBtn = document.getElementById('clear-data-btn');

        const navLinks = document.querySelectorAll('.nav-link');
        const dashboardSection = document.getElementById('dashboard-section');
        const settingsSection = document.getElementById('settings-section');
        const mainHeader = document.getElementById('main-header');

        // Mobile/Responsive Elements
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const leftNav = document.getElementById('left-nav');
        const mainContentArea = document.getElementById('main-content-area');
        const toggleAnalyticsPanelBtn = document.getElementById('toggle-analytics-panel-btn');
        const rightAnalyticsPanel = document.getElementById('right-analytics-panel');
        const closeAnalyticsPanelBtn = document.getElementById('close-analytics-panel-btn');
        

        // Icons (as simple strings for brevity, consider SVG constants for larger projects)
        const ICONS = {
            calendar: `<svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`,
            edit: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>`,
            trash: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`,
            user: `<svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>`
        };

        // Utility Functions
        const generateId = () => `task-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        const formatDate = (dateString) => {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            // Make sure date is UTC to avoid timezone issues with input[type=date]
            const userTimezoneOffset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() + userTimezoneOffset).toLocaleDateString('en-CA'); // YYYY-MM-DD for consistency
        };
        const getUserInitials = (name) => {
            if (!name) return '??';
            const parts = name.split(' ');
            if (parts.length > 1) {
                return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        };

        // Toast Notifications
        const showNotification = (message, type = 'success') => {
            const bgColor = type === 'success' ? '#28A745' : type === 'error' ? '#DC3545' : '#007BFF';
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "right",
                style: { background: bgColor, borderRadius: '8px' },
                stopOnFocus: true,
            }).showToast();
        };

        // Theme Management
        const themeToggleDesktop = document.getElementById('theme-toggle-desktop');
        const themeToggleMobile = document.getElementById('theme-toggle-mobile');
        const settingsThemeToggle = document.getElementById('settings-theme-toggle');

        const darkIconDesktop = document.getElementById('theme-toggle-dark-icon-desktop');
        const lightIconDesktop = document.getElementById('theme-toggle-light-icon-desktop');
        const darkIconMobile = document.getElementById('theme-toggle-dark-icon-mobile');
        const lightIconMobile = document.getElementById('theme-toggle-light-icon-mobile');
        const settingsDarkIcon = document.getElementById('settings-theme-toggle-dark-icon');
        const settingsLightIcon = document.getElementById('settings-theme-toggle-light-icon');

        const allThemeToggles = [
            { button: themeToggleDesktop, dark: darkIconDesktop, light: lightIconDesktop },
            { button: themeToggleMobile, dark: darkIconMobile, light: lightIconMobile },
            { button: settingsThemeToggle, dark: settingsDarkIcon, light: settingsLightIcon }
        ];

        const updateThemeIcons = (isDarkMode) => {
            allThemeToggles.forEach(toggle => {
                if (toggle.button) { // Ensure elements exist
                    toggle.dark.classList.toggle('hidden', !isDarkMode);
                    toggle.light.classList.toggle('hidden', isDarkMode);
                }
            });
            // Update Chart.js legend/axis colors
            const chartTextColor = isDarkMode ? '#E9ECEF' : '#212529';
            const chartGridColor = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            const chartTickColor = isDarkMode ? '#ADB5BD' : '#6C757D';
            
            if (tasksPerStatusChart) {
                tasksPerStatusChart.options.plugins.legend.labels.color = chartTextColor;
                tasksPerStatusChart.options.scales.x.ticks.color = chartTickColor;
                tasksPerStatusChart.options.scales.x.grid.color = chartGridColor;
                tasksPerStatusChart.options.scales.y.ticks.color = chartTickColor;
                tasksPerStatusChart.options.scales.y.grid.color = chartGridColor;
                tasksPerStatusChart.update();
            }
            if (tasksDueChart) {
                tasksDueChart.options.plugins.legend.labels.color = chartTextColor;
                tasksDueChart.options.scales.x.ticks.color = chartTickColor;
                tasksDueChart.options.scales.x.grid.color = chartGridColor;
                tasksDueChart.options.scales.y.ticks.color = chartTickColor;
                tasksDueChart.options.scales.y.grid.color = chartGridColor;
                tasksDueChart.update();
            }
        };
        
        const applyTheme = (theme) => {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
            updateThemeIcons(theme === 'dark');
        };

        const toggleTheme = () => {
            const currentTheme = localStorage.getItem('theme') || 'light';
            applyTheme(currentTheme === 'light' ? 'dark' : 'light');
        };

        allThemeToggles.forEach(toggle => {
            if(toggle.button) toggle.button.addEventListener('click', toggleTheme);
        });


        // Modal Management
        const openModal = (isEditing = false, task = null) => {
            modalTitle.textContent = isEditing ? 'Edit Task' : 'Add New Task';
            taskForm.reset();
            document.getElementById('task-id').value = '';

            if (isEditing && task) {
                editingTaskId = task.id;
                document.getElementById('task-id').value = task.id;
                document.getElementById('task-title').value = task.title;
                document.getElementById('task-description').value = task.description || '';
                document.getElementById('task-deadline').value = task.deadline ? formatDate(task.deadline) : '';
                document.getElementById('task-priority').value = task.priority;
                document.getElementById('task-user').value = task.assignedUser;
            } else {
                editingTaskId = null;
                 // Set default deadline to today for new tasks
                document.getElementById('task-deadline').value = formatDate(new Date().toISOString());
            }
            
            modalBackdrop.classList.remove('hidden');
            taskModal.classList.remove('hidden');
            setTimeout(() => { // For transition
                 taskModal.firstElementChild.classList.remove('scale-95', 'opacity-0');
                 taskModal.firstElementChild.classList.add('scale-100', 'opacity-100');
            }, 10);
        };

        const closeModal = () => {
            taskModal.firstElementChild.classList.remove('scale-100', 'opacity-100');
            taskModal.firstElementChild.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modalBackdrop.classList.add('hidden');
                taskModal.classList.add('hidden');
            }, 200); // Match transition duration
        };

        // Task Management
        const saveTask = (e) => {
            e.preventDefault();
            const id = document.getElementById('task-id').value || generateId();
            const title = document.getElementById('task-title').value;
            const description = document.getElementById('task-description').value;
            const deadline = document.getElementById('task-deadline').value;
            const priority = document.getElementById('task-priority').value;
            const assignedUser = document.getElementById('task-user').value;

            const taskData = { id, title, description, deadline, priority, assignedUser };

            if (editingTaskId) {
                const taskIndex = tasks.findIndex(t => t.id === editingTaskId);
                tasks[taskIndex] = { ...tasks[taskIndex], ...taskData };
                showNotification('Task updated successfully!', 'success');
            } else {
                taskData.status = 'todo'; // New tasks go to 'To Do'
                tasks.push(taskData);
                showNotification('Task added successfully!', 'success');
            }
            
            editingTaskId = null;
            saveTasksToLocalStorage();
            renderAll();
            closeModal();
        };

        const deleteTask = (taskId) => {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(t => t.id !== taskId);
                saveTasksToLocalStorage();
                renderAll();
                showNotification('Task deleted successfully!', 'info');
            }
        };

        const getPriorityClass = (priority) => {
            if (priority === 'high') return 'bg-priority-high';
            if (priority === 'medium') return 'bg-priority-medium text-dark-text-primary'; // Yellow needs dark text
            if (priority === 'low') return 'bg-priority-low';
            return 'bg-gray-400';
        };
        
        const renderTaskCard = (task) => {
            const card = document.createElement('div');
            card.className = 'task-card bg-light-card dark:bg-dark-card p-3 rounded-md shadow hover:shadow-lg transition-all duration-150 cursor-grab active:cursor-grabbing';
            card.setAttribute('draggable', 'true');
            card.id = task.id;

            const priorityBadgeColor = getPriorityClass(task.priority);
            const userInitial = getUserInitials(task.assignedUser);
            const avatarColor = getAvatarColor(task.assignedUser);
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <h4 class="font-semibold text-md text-light-text-primary dark:text-dark-text-primary break-words">${task.title}</h4>
                    <span class="px-2 py-0.5 ${priorityBadgeColor} text-white text-xs rounded-full whitespace-nowrap">${priorities[task.priority]}</span>
                </div>
                ${task.description ? `<p class="text-sm text-light-text-secondary dark:text-dark-text-secondary mb-2 break-words">${task.description.substring(0, 100)}${task.description.length > 100 ? '...' : ''}</p>` : ''}
                <div class="flex justify-between items-center text-xs text-light-text-secondary dark:text-dark-text-secondary mb-2">
                    <span class="flex items-center">
                        ${ICONS.calendar}
                        <span class="ml-1">${formatDate(task.deadline)}</span>
                    </span>
                    <div class="flex items-center" title="${task.assignedUser}">
                        <div class="w-6 h-6 ${avatarColor} rounded-full flex items-center justify-center text-xs font-semibold text-white">${userInitial}</div>
                    </div>
                </div>
                <div class="flex justify-end items-center space-x-1 pt-1 border-t border-light-border dark:border-dark-border">
                    <button class="edit-task-btn p-1 text-light-text-secondary dark:text-dark-text-secondary hover:text-accent-blue dark:hover:text-accent-blue transition-colors" data-task-id="${task.id}">${ICONS.edit}</button>
                    <button class="delete-task-btn p-1 text-light-text-secondary dark:text-dark-text-secondary hover:text-accent-red dark:hover:text-accent-red transition-colors" data-task-id="${task.id}">${ICONS.trash}</button>
                </div>
            `;

            card.addEventListener('dragstart', handleDragStart);
            card.querySelector('.edit-task-btn').addEventListener('click', () => openModal(true, task));
            card.querySelector('.delete-task-btn').addEventListener('click', () => deleteTask(task.id));
            return card;
        };
        
        const getAvatarColor = (userName) => {
            if (!userName) return 'bg-gray-400';
            const colors = ['bg-accent-red', 'bg-accent-green', 'bg-accent-blue', 'bg-accent-yellow', 'bg-accent-purple', 'bg-pink-500', 'bg-indigo-500', 'bg-teal-500'];
            let hash = 0;
            for (let i = 0; i < userName.length; i++) {
                hash = userName.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash % colors.length);
            return colors[index];
        };

        const renderKanbanBoard = () => {
            document.querySelectorAll('.task-list').forEach(list => list.innerHTML = '');
            const filteredTasks = tasks.filter(task => {
                const matchesSearch = task.title.toLowerCase().includes(currentFilters.searchTerm.toLowerCase());
                const matchesPriority = currentFilters.priority ? task.priority === currentFilters.priority : true;
                const matchesUser = currentFilters.user ? task.assignedUser === currentFilters.user : true;
                return matchesSearch && matchesPriority && matchesUser;
            });

            filteredTasks.forEach(task => {
                const column = document.getElementById(`${task.status}-column`).querySelector('.task-list');
                if (column) {
                    column.appendChild(renderTaskCard(task));
                }
            });
        };

        // Drag and Drop
        let draggedItem = null;

        const handleDragStart = (e) => {
            draggedItem = e.target;
            e.dataTransfer.setData('text/plain', e.target.id);
            setTimeout(() => {
                e.target.classList.add('task-card-dragging');
            }, 0);
        };

        const handleDragOver = (e) => {
            e.preventDefault();
            const column = e.target.closest('.kanban-column');
            if (column) {
                // Basic visual feedback for drag over column.
                // This could be improved by adding a specific class to the column itself.
                // Example: column.classList.add('drag-over-column');
            }
        };
        
        const handleDragEnter = (e) => {
            const column = e.target.closest('.kanban-column');
            if (column) {
                 column.classList.add('drag-over-column');
            }
        }
        const handleDragLeave = (e) => {
            const column = e.target.closest('.kanban-column');
            if (column) {
                 column.classList.remove('drag-over-column');
            }
        }

        const handleDrop = (e) => {
            e.preventDefault();
            const targetColumn = e.target.closest('.kanban-column');
            if (targetColumn && draggedItem) {
                const taskId = draggedItem.id;
                const newStatus = targetColumn.dataset.status;
                
                const task = tasks.find(t => t.id === taskId);
                if (task && task.status !== newStatus) {
                    task.status = newStatus;
                    saveTasksToLocalStorage();
                    renderAll(); // Re-render everything to reflect change
                    showNotification(`Task moved to ${statusMap[newStatus]}`, 'info');
                }
                targetColumn.classList.remove('drag-over-column');
            }
            if (draggedItem) {
                draggedItem.classList.remove('task-card-dragging');
            }
            draggedItem = null;
        };

        document.querySelectorAll('.kanban-column').forEach(column => {
            column.addEventListener('dragover', handleDragOver);
            column.addEventListener('dragenter', handleDragEnter);
            column.addEventListener('dragleave', handleDragLeave);
            column.addEventListener('drop', handleDrop);
        });


        // Analytics
        const renderProgressBar = () => {
            const doneTasks = tasks.filter(t => t.status === 'done').length;
            const totalTasks = tasks.length;
            const percentage = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
            progressBar.style.width = `${percentage}%`;
            progressBar.textContent = `${percentage}%`;
        };

        const renderCharts = () => {
            // Chart Colors
            const isDark = document.documentElement.classList.contains('dark');
            const chartTextColor = isDark ? '#E9ECEF' : '#212529';
            const chartGridColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            const chartTickColor = isDark ? '#ADB5BD' : '#6C757D';
            
            const chartColors = {
                todo: 'rgba(255, 193, 7, 0.7)',    // Yellow
                inprogress: 'rgba(0, 123, 255, 0.7)', // Blue
                done: 'rgba(40, 167, 69, 0.7)',    // Green
            };
            const chartBorderColors = {
                todo: 'rgba(255, 193, 7, 1)',
                inprogress: 'rgba(0, 123, 255, 1)',
                done: 'rgba(40, 167, 69, 1)',
            };

            // Tasks per status chart (Pie)
            const statusCounts = tasks.reduce((acc, task) => {
                acc[task.status] = (acc[task.status] || 0) + 1;
                return acc;
            }, {});

            const tasksPerStatusCtx = document.getElementById('tasks-per-status-chart').getContext('2d');
            if (tasksPerStatusChart) tasksPerStatusChart.destroy();
            tasksPerStatusChart = new Chart(tasksPerStatusCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(statusCounts).map(status => statusMap[status]),
                    datasets: [{
                        label: 'Tasks per Status',
                        data: Object.values(statusCounts),
                        backgroundColor: Object.keys(statusCounts).map(status => chartColors[status]),
                        borderColor: Object.keys(statusCounts).map(status => chartBorderColors[status]),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            position: 'top',
                            labels: { color: chartTextColor } 
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    if (label) { label += ': '; }
                                    if (context.parsed !== null) { label += context.parsed; }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });

            // Tasks due chart (Bar) - Next 7 days
            const upcomingTasks = {};
            const today = new Date();
            today.setHours(0,0,0,0);

            for (let i = 0; i < 7; i++) {
                const day = new Date(today);
                day.setDate(today.getDate() + i);
                const dayString = day.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                upcomingTasks[dayString] = 0;
            }

            tasks.forEach(task => {
                if (task.deadline && task.status !== 'done') {
                    const deadlineDate = new Date(task.deadline);
                    deadlineDate.setHours(0,0,0,0); // Normalize deadline date
                     // Adjust for timezone if input date is YYYY-MM-DD (interpreted as UTC)
                    const userTimezoneOffset = deadlineDate.getTimezoneOffset() * 60000;
                    const localDeadline = new Date(deadlineDate.getTime() + userTimezoneOffset);

                    if (localDeadline >= today && localDeadline < new Date(today).setDate(today.getDate() + 7)) {
                        const dayString = localDeadline.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                        if (upcomingTasks.hasOwnProperty(dayString)) {
                            upcomingTasks[dayString]++;
                        }
                    }
                }
            });
            
            const tasksDueCtx = document.getElementById('tasks-due-chart').getContext('2d');
            if (tasksDueChart) tasksDueChart.destroy();
            tasksDueChart = new Chart(tasksDueCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(upcomingTasks),
                    datasets: [{
                        label: 'Tasks Due',
                        data: Object.values(upcomingTasks),
                        backgroundColor: 'rgba(111, 66, 193, 0.7)', // Accent Purple
                        borderColor: 'rgba(111, 66, 193, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            ticks: { color: chartTickColor, stepSize: 1 },
                            grid: { color: chartGridColor }
                        },
                        x: { 
                            ticks: { color: chartTickColor },
                            grid: { color: chartGridColor }
                        }
                    },
                    plugins: {
                        legend: { 
                            display: false, // Or true, if preferred
                            labels: { color: chartTextColor } 
                        }
                    }
                }
            });
        };

        // Filters and Search
        const applyFilters = () => {
            currentFilters.searchTerm = searchInput.value;
            currentFilters.priority = filterPrioritySelect.value;
            currentFilters.user = filterUserSelect.value;
            renderKanbanBoard();
        };
        
        searchInput.addEventListener('input', applyFilters);
        filterPrioritySelect.addEventListener('change', applyFilters);
        filterUserSelect.addEventListener('change', applyFilters);

        // Populate User Filters
        const populateUserFilters = () => {
            filterUserSelect.innerHTML = '<option value="">All Users</option>'; // Reset
            document.getElementById('task-user').innerHTML = ''; // Reset task form user select

            const uniqueUsers = [...new Set(tasks.map(task => task.assignedUser).concat(users))].filter(Boolean).sort();
            uniqueUsers.forEach(user => {
                const optionFilter = document.createElement('option');
                optionFilter.value = user;
                optionFilter.textContent = user;
                filterUserSelect.appendChild(optionFilter);

                const optionForm = document.createElement('option');
                optionForm.value = user;
                optionForm.textContent = user;
                document.getElementById('task-user').appendChild(optionForm);
            });
        };

        // Data Export
        const exportToExcel = () => {
            if (tasks.length === 0) {
                showNotification('No tasks to export.', 'info');
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(tasks.map(task => ({
                ID: task.id,
                Title: task.title,
                Description: task.description,
                Status: statusMap[task.status],
                Deadline: formatDate(task.deadline),
                Priority: priorities[task.priority],
                'Assigned User': task.assignedUser
            })));
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Tasks");
            XLSX.writeFile(workbook, "tasks_export.xlsx");
            showNotification('Tasks exported to Excel.', 'success');
        };
        exportTasksBtn.addEventListener('click', exportToExcel);

        // Clear Data
        clearDataBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to delete ALL task data? This action cannot be undone.')) {
                tasks = [];
                saveTasksToLocalStorage();
                renderAll();
                showNotification('All task data cleared.', 'info');
            }
        });

        // Local Storage
        const loadTasksFromLocalStorage = () => {
            const storedTasks = localStorage.getItem('tasks');
            if (storedTasks) {
                tasks = JSON.parse(storedTasks);
            } else {
                // Sample data if no tasks are stored
                tasks = [
                    { id: generateId(), title: 'Design Homepage Mockup', description: 'Create a responsive design for the new homepage using Figma.', status: 'todo', deadline: new Date(Date.now() + 3 * 24*60*60*1000).toISOString().split('T')[0], priority: 'high', assignedUser: 'Alice' },
                    { id: generateId(), title: 'Develop API Endpoints', description: 'Implement CRUD operations for tasks and users.', status: 'inprogress', deadline: new Date(Date.now() + 7 * 24*60*60*1000).toISOString().split('T')[0], priority: 'high', assignedUser: 'Bob' },
                    { id: generateId(), title: 'Write Unit Tests for API', description: 'Ensure 90% code coverage for backend services.', status: 'todo', deadline: new Date(Date.now() + 10 * 24*60*60*1000).toISOString().split('T')[0], priority: 'medium', assignedUser: 'Carol' },
                    { id: generateId(), title: 'User Documentation', description: 'Prepare user guides and FAQs for the platform.', status: 'done', deadline: new Date(Date.now() - 2 * 24*60*60*1000).toISOString().split('T')[0], priority: 'low', assignedUser: 'David' },
                    { id: generateId(), title: 'Setup CI/CD Pipeline', description: 'Automate build, test, and deployment processes.', status: 'inprogress', deadline: new Date(Date.now() + 5 * 24*60*60*1000).toISOString().split('T')[0], priority: 'high', assignedUser: 'Eve' },
                    { id: generateId(), title: 'Review UI/UX Feedback', description: 'Analyze user feedback and plan UI improvements.', status: 'todo', deadline: new Date(Date.now() + 1 * 24*60*60*1000).toISOString().split('T')[0], priority: 'medium', assignedUser: 'Alice' },
                ];
            }
        };

        const saveTasksToLocalStorage = () => {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        };

        // Navigation / Section Switching
        const switchSection = (sectionName) => {
            currentSection = sectionName;
            navLinks.forEach(link => {
                link.classList.toggle('text-accent-blue', link.dataset.section === sectionName);
                link.classList.toggle('dark:text-accent-blue', link.dataset.section === sectionName);
                link.classList.toggle('bg-accent-blue/10', link.dataset.section === sectionName);
                link.classList.toggle('dark:bg-accent-blue/20', link.dataset.section === sectionName);
                link.classList.toggle('text-light-text-secondary', link.dataset.section !== sectionName);
                link.classList.toggle('dark:text-dark-text-secondary', link.dataset.section !== sectionName);

            });

            if (sectionName === 'dashboard') {
                dashboardSection.classList.remove('hidden');
                dashboardSection.classList.add('flex');
                settingsSection.classList.add('hidden');
                mainHeader.classList.remove('hidden');
                mainHeader.classList.add('block'); // Or 'flex' if it uses flex
                if (window.innerWidth < 1024) { // lg breakpoint
                    rightAnalyticsPanel.classList.add('translate-x-full');
                }
            } else if (sectionName === 'settings') {
                dashboardSection.classList.add('hidden');
                dashboardSection.classList.remove('flex');
                settingsSection.classList.remove('hidden');
                settingsSection.classList.add('block'); // Or 'flex'
                mainHeader.classList.add('hidden'); // Hide filters/search on settings page
                if (window.innerWidth < 1024) {
                    rightAnalyticsPanel.classList.add('translate-x-full');
                }
            } else if (sectionName === 'analytics') { // Show analytics panel
                dashboardSection.classList.remove('hidden'); // Keep dashboard visible
                dashboardSection.classList.add('flex');
                settingsSection.classList.add('hidden');
                mainHeader.classList.remove('hidden');
                mainHeader.classList.add('block');
                rightAnalyticsPanel.classList.remove('translate-x-full');
                // Highlight analytics link
            }
            renderAll(); // Re-render might be needed if content depends on section
        };

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                switchSection(link.dataset.section);
            });
        });

        // Mobile Navigation Toggles
        mobileMenuButton.addEventListener('click', () => {
            leftNav.classList.toggle('hidden');
            leftNav.classList.toggle('md:block'); // Ensure it's block on md+
            // Optional: Add overlay or shift main content
            if (!leftNav.classList.contains('hidden')) {
                leftNav.classList.remove('w-16'); // expand to full width when shown on mobile
                leftNav.classList.add('w-64', 'fixed', 'inset-y-0', 'left-0', 'z-40', 'md:static', 'md:z-auto');
                mainContentArea.classList.add('md:ml-64'); // ensure main content shifts if nav is fixed overlay on mobile
                mainContentArea.classList.remove('md:ml-16');
            } else {
                 leftNav.classList.remove('w-64', 'fixed', 'inset-y-0', 'left-0', 'z-40', 'md:static', 'md:z-auto');
                 leftNav.classList.add('w-16');
                 mainContentArea.classList.remove('md:ml-64');
                 mainContentArea.classList.add('md:ml-16');
            }
        });

        toggleAnalyticsPanelBtn.addEventListener('click', () => {
            rightAnalyticsPanel.classList.remove('translate-x-full');
        });
        closeAnalyticsPanelBtn.addEventListener('click', () => {
            rightAnalyticsPanel.classList.add('translate-x-full');
        });


        // Initial Render Function
        const renderAll = () => {
            populateUserFilters(); // Must be before renderKanbanBoard if filters depend on current tasks
            renderKanbanBoard();
            renderProgressBar();
            renderCharts();
        };

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            // Apply stored theme or system preference
            const storedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(storedTheme || (systemPrefersDark ? 'dark' : 'light'));
            
            loadTasksFromLocalStorage();
            
            addTaskBtn.addEventListener('click', () => openModal());
            closeModalBtn.addEventListener('click', closeModal);
            cancelTaskBtn.addEventListener('click', closeModal);
            modalBackdrop.addEventListener('click', closeModal);
            taskForm.addEventListener('submit', saveTask);

            switchSection('dashboard'); // Default section
            // Initial setup of left nav for mobile/desktop
            if (window.innerWidth < 768) { // md breakpoint
                leftNav.classList.add('hidden');
            } else {
                leftNav.classList.remove('w-16');
                leftNav.classList.add('w-64');
                mainContentArea.classList.add('md:ml-64');
                mainContentArea.classList.remove('md:ml-16');
            }
            
            // Ensure analytics panel state based on screen size
            if (window.innerWidth < 1024) { // lg breakpoint
                rightAnalyticsPanel.classList.add('translate-x-full');
            } else {
                rightAnalyticsPanel.classList.remove('translate-x-full');
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth < 768) {
                if (!leftNav.classList.contains('fixed')) { // Only hide if not explicitly opened by user
                     leftNav.classList.add('hidden');
                }
                 leftNav.classList.add('w-16');
                 leftNav.classList.remove('w-64');
                 mainContentArea.classList.remove('md:ml-64');
                 mainContentArea.classList.add('md:ml-16');
            } else {
                leftNav.classList.remove('hidden', 'fixed', 'inset-y-0', 'left-0', 'z-40');
                leftNav.classList.add('md:block', 'w-64'); // Standard desktop view
                leftNav.classList.remove('w-16');
                mainContentArea.classList.add('md:ml-64');
                mainContentArea.classList.remove('md:ml-16');
            }

            if (window.innerWidth < 1024) { // lg breakpoint
                if (!rightAnalyticsPanel.classList.contains('translate-x-full')) { // If it was open
                    // No specific action, keep it open if user opened it, or use default hidden state
                }
            } else { // lg and up
                rightAnalyticsPanel.classList.remove('translate-x-full');
            }
            renderCharts(); // Re-render charts on resize as canvas might need adjustments
        });


    </script>
</body>
</html>
