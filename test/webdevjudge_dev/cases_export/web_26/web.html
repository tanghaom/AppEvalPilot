    <style>
        /* Custom scrollbar for a more polished look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; /* slate-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5; /* indigo-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1; /* indigo-500 */
        }

        /* Simple fade-in animation */
        .fade-in {
            animation: fadeInAnimation 0.5s ease-in forwards;
            opacity: 0;
        }
        @keyframes fadeInAnimation {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Subtle background gradient animation for hero */
        .hero-gradient-bg {
            background: linear-gradient(270deg, #1e293b, #334155, #475569, #0f172a); /* slate-800, slate-700, slate-600, slate-900 */
            background-size: 800% 800%;
            animation: gradientAnimation 20s ease infinite;
        }
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Selected state for nav items */
        .nav-item.active {
            color: #c4b5fd; /* violet-300 */
            border-bottom-color: #c4b5fd; /* violet-300 */
        }

        /* Placeholder product image styling */
        .product-placeholder-img {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #94a3b8; /* slate-400 */
        }
    </style>

        // --- NAVIGATION ---
        function showPage(pageId, data = null) {
            document.querySelectorAll('.page-content').forEach(section => {
                section.classList.add('hidden');
                section.innerHTML = ''; // Clear previous content
            });
            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.remove('hidden');
                targetPage.classList.add('fade-in'); 
                renderPageContent(pageId, data);
            }
            currentPage = pageId;
            // Close mobile menu if open
            document.getElementById('mobile-menu').classList.add('hidden');
        }
        
        function setActiveNav(element, isMobile = false) {
            const navItems = isMobile 
                ? document.getElementById('mobile-menu').querySelectorAll('.nav-item')
                : document.querySelector('header nav').querySelectorAll('.nav-item');
            
            navItems.forEach(item => {
                item.classList.remove('active', 'text-brand-moonlight', 'border-brand-moonlight');
                item.classList.add('text-brand-stardust', 'border-transparent');
            });
            
            if (element) {
                element.classList.add('active', 'text-brand-moonlight', 'border-brand-moonlight');
                element.classList.remove('text-brand-stardust', 'border-transparent');
            }
        }

            const container = document.getElementById(pageId);

                    break;
                case 'shop':

                    break;

                    break;

                    break;

        // --- CART FUNCTIONALITY ---
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                const existingItem = cart.find(item => item.id === productId);
                if (existingItem) {
                    existingItem.quantity++;
                } else {
                    cart.push({ ...product, quantity: 1 });
                }
                updateCartCount();
                // Optionally, show a confirmation message
                alert(`${product.name} added to cart!`);
            }
        }

        function updateCartCount() {
            const cartCountElement = document.getElementById('cart-count');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCountElement.textContent = totalItems;
        }

        function renderCartPage(container) {
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="py-12 md:py-16 bg-brand-deep-space">
                        <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
                            <h1 class="text-4xl font-serif text-brand-moonlight mb-6">Your Celestial Cart</h1>
                            <p class="text-xl text-brand-stardust mb-8">Your cart is currently empty. Time to find your cosmic match!</p>
                            <button onclick="showPage('shop')" class="bg-brand-primary-cta hover:bg-brand-primary-cta-hover text-white font-semibold py-3 px-8 rounded-lg text-lg transition-colors">
                                Explore Elixirs
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const cartItemsHtml = cart.map(item => `
                <div class="flex justify-between items-center p-4 bg-brand-nebula-gray rounded-lg mb-4">
                    <div class="flex items-center">
                        <div class="bg-brand-deep-space border-2 border-dashed border-brand-moon-accent rounded-md w-16 h-16 mr-4 flex items-center justify-center product-placeholder-img text-xl font-serif">${item.imageText}</div>
                        <div>
                            <h3 class="text-lg font-semibold text-brand-sunlight">${item.name}</h3>
                            <p class="text-sm text-brand-stardust">$${item.price}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-brand-stardust">Qty: ${item.quantity}</p>
                        <p class="text-lg font-semibold text-brand-moonlight">$${(parseFloat(item.price) * item.quantity).toFixed(2)}</p>
                        <button onclick="removeFromCart(${item.id})" class="text-sm text-red-400 hover:text-red-300 mt-1">Remove</button>
                    </div>
                </div>
            `).join('');

            const subtotal = cart.reduce((sum, item) => sum + (parseFloat(item.price) * item.quantity), 0);

            container.innerHTML = `
                <div class="py-12 md:py-16 bg-brand-deep-space">
                    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-2xl">
                        <h1 class="text-4xl font-serif text-center text-brand-moonlight mb-10">Your Celestial Cart</h1>
                        <div class="bg-brand-space-blue p-6 rounded-xl shadow-2xl">
                            ${cartItemsHtml}
                            <div class="border-t border-brand-nebula-gray mt-6 pt-6 text-right">
                                <p class="text-xl text-brand-stardust mb-2">Subtotal: <span class="font-bold text-brand-moonlight">$${subtotal.toFixed(2)}</span></p>
                                <p class="text-sm text-brand-stardust mb-6">(Shipping & taxes calculated at checkout)</p>
                                <button class="w-full bg-brand-primary-cta hover:bg-brand-primary-cta-hover text-white font-bold py-3 px-6 rounded-lg text-lg transition-colors">
                                    Proceed to Cosmic Checkout
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartCount();
            renderCartPage(document.getElementById('cart')); // Re-render cart page
        }


        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            initializeProducts();
            showPage('home'); // Show home page by default
            setActiveNav(document.querySelector('header nav .nav-item')); // Set Home as active
            document.getElementById('currentYear').textContent = new Date().getFullYear();

            // Mobile menu toggle
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
            
            // Close mobile menu when a link is clicked
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.add('hidden');
                });
            });
        });

    </script>
</body>
</html>
