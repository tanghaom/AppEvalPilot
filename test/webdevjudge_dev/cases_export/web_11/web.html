<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalendyClone - Your Scheduling Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/heroicons/2.0.18/24/outline/heroicons.min.css" rel="stylesheet">
    <style>
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; /* slate-100 */
        }
        ::-webkit-scrollbar-thumb {
            background: #64748b; /* slate-500 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; /* slate-600 */
        }
        /* Basic styles for modals */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal.flex { display: flex; } /* To show modal */

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 1.5rem; /* p-6 */
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-xl */
            width: 90%;
            max-width: 32rem; /* max-w-lg */
        }
        /* For simpler icon rendering */
        .icon {
            width: 1.25rem; /* w-5 */
            height: 1.25rem; /* h-5 */
            display: inline-block;
            vertical-align: middle;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#4f46e5', // indigo-600
                            hover: '#4338ca', // indigo-700
                            light: '#e0e7ff', // indigo-100
                            text: '#3730a3', // indigo-800
                        },
                        secondary: {
                            DEFAULT: '#0ea5e9', // sky-500
                            hover: '#0284c7', // sky-600
                        },
                        neutral: {
                            light: '#f8fafc', // slate-50
                            DEFAULT: '#f1f5f9', // slate-100
                            medium: '#e2e8f0', // slate-200
                            dark: '#cbd5e1', // slate-300
                            text: '#334155', // slate-700
                            textLight: '#64748b', // slate-500
                        },
                        success: {
                            DEFAULT: '#22c55e', // green-500
                            light: '#dcfce7', // green-100
                            text: '#166534', // green-800
                        },
                        danger: {
                            DEFAULT: '#ef4444', // red-500
                            light: '#fee2e2', // red-100
                            text: '#991b1b', // red-800
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-neutral-DEFAULT text-neutral-text antialiased">
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-white border-r border-neutral-dark p-6 space-y-6 transition-all duration-300 ease-in-out">
            <div class="text-2xl font-bold text-primary-DEFAULT">CalendyClone</div>
            <nav id="mainNav" class="space-y-2">
                <!-- Nav items will be populated by JS -->
            </nav>
            <div class="mt-auto pt-6 border-t border-neutral-dark">
                <div class="flex items-center space-x-3">
                    <div class="bg-neutral-medium border-2 border-dashed rounded-full w-10 h-10"></div>
                    <div>
                        <p class="font-semibold text-sm">User Name</p>
                        <p class="text-xs text-neutral-textLight">user@example.com</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="mainContent" class="flex-1 overflow-y-auto p-8">
            <!-- Content will be populated by JS -->
        </main>
    </div>

    <!-- Modals Container -->
    <div id="modalContainer">
        <!-- Create/Edit Event Type Modal -->
        <div id="eventTypeModal" class="modal">
            <div class="modal-content">
                <h3 id="eventTypeModalTitle" class="text-xl font-semibold mb-4">Create New Event Type</h3>
                <form id="eventTypeForm">
                    <input type="hidden" id="eventTypeIdInput">
                    <div class="mb-4">
                        <label for="eventName" class="block text-sm font-medium text-neutral-text mb-1">Event Name</label>
                        <input type="text" id="eventName" name="eventName" required class="w-full p-2 border border-neutral-dark rounded-md focus:ring-primary-DEFAULT focus:border-primary-DEFAULT" placeholder="e.g., 30 Minute Meeting">
                    </div>
                    <div class="mb-4">
                        <label for="eventDuration" class="block text-sm font-medium text-neutral-text mb-1">Duration (minutes)</label>
                        <select id="eventDuration" name="eventDuration" class="w-full p-2 border border-neutral-dark rounded-md focus:ring-primary-DEFAULT focus:border-primary-DEFAULT">
                            <option value="15">15 minutes</option>
                            <option value="30">30 minutes</option>
                            <option value="45">45 minutes</option>
                            <option value="60">60 minutes</option>
                            <option value="90">90 minutes</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="eventDescription" class="block text-sm font-medium text-neutral-text mb-1">Description (optional)</label>
                        <textarea id="eventDescription" name="eventDescription" rows="3" class="w-full p-2 border border-neutral-dark rounded-md focus:ring-primary-DEFAULT focus:border-primary-DEFAULT" placeholder="Brief details about the event"></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="eventLocation" class="block text-sm font-medium text-neutral-text mb-1">Location (optional)</label>
                        <input type="text" id="eventLocation" name="eventLocation" class="w-full p-2 border border-neutral-dark rounded-md focus:ring-primary-DEFAULT focus:border-primary-DEFAULT" placeholder="e.g., Zoom, Google Meet, Phone call">
                    </div>
                    <div class="mb-6">
                        <label for="eventColor" class="block text-sm font-medium text-neutral-text mb-1">Event Color</label>
                        <select id="eventColor" name="eventColor" class="w-full p-2 border border-neutral-dark rounded-md focus:ring-primary-DEFAULT focus:border-primary-DEFAULT">
                            <option value="bg-blue-500">Blue</option>
                            <option value="bg-green-500">Green</option>
                            <option value="bg-yellow-500">Yellow</option>
                            <option value="bg-purple-500">Purple</option>
                            <option value="bg-pink-500">Pink</option>
                        </select>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="closeModal('eventTypeModal')" class="px-4 py-2 text-sm font-medium text-neutral-text bg-neutral-medium rounded-md hover:bg-neutral-dark">Cancel</button>
                        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-primary-DEFAULT rounded-md hover:bg-primary-hover">Save Event Type</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Copy Link Modal -->
        <div id="copyLinkModal" class="modal">
            <div class="modal-content">
                <h3 class="text-xl font-semibold mb-4">Copy Booking Link</h3>
                <p class="text-sm text-neutral-textLight mb-2">Share this link with others to book this event:</p>
                <input type="text" id="bookingLinkInput" readonly class="w-full p-2 border border-neutral-dark rounded-md bg-neutral-light mb-4">
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeModal('copyLinkModal')" class="px-4 py-2 text-sm font-medium text-neutral-text bg-neutral-medium rounded-md hover:bg-neutral-dark">Close</button>
                    <button type="button" onclick="copyToClipboard()" class="px-4 py-2 text-sm font-medium text-white bg-primary-DEFAULT rounded-md hover:bg-primary-hover">Copy to Clipboard</button>
                </div>
                 <p id="copyFeedback" class="text-sm text-success-DEFAULT mt-2"></p>
            </div>
        </div>

        <!-- Confirm Booking Modal -->
         <div id="confirmBookingModal" class="modal">
            <div class="modal-content max-w-md">
                <div class="flex justify-center mb-4">
                    <svg class="w-16 h-16 text-success-DEFAULT" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h3 class="text-xl font-semibold text-center mb-2">Booking Confirmed!</h3>
                <p id="bookingConfirmationDetails" class="text-sm text-neutral-textLight text-center mb-6"></p>
                <div class="flex justify-center">
                    <button type="button" onclick="closeModal('confirmBookingModal'); navigateTo('scheduledEvents');" class="px-6 py-2 text-sm font-medium text-white bg-primary-DEFAULT rounded-md hover:bg-primary-hover">View My Bookings</button>
                </div>
            </div>
        </div>
    </div>

                                `;
                            }).join('')}

                    </table>
                </div>
                `}
            `;
        }
        
        function cancelBooking(eventId) {
            if (confirm('Are you sure you want to cancel this booking?')) {
                state.scheduledEvents = state.scheduledEvents.filter(event => event.id !== eventId);

        let isDarkModeEnabled = false;
        function toggleDarkMode() {
            isDarkModeEnabled = !isDarkModeEnabled;
            const toggleButton = document.getElementById('darkModeToggle');
            const knob = document.getElementById('darkModeToggleKnob');
            if (isDarkModeEnabled) {
                toggleButton.classList.remove('bg-neutral-medium');
                toggleButton.classList.add('bg-primary-DEFAULT');
                knob.classList.remove('translate-x-1');
                knob.classList.add('translate-x-6');
                // In a real app, you would add a 'dark' class to the HTML element
                // document.documentElement.classList.add('dark');
                alert("Dark mode toggled (UI only). A full dark theme would require extensive CSS changes.");
            } else {
                toggleButton.classList.remove('bg-primary-DEFAULT');
                toggleButton.classList.add('bg-neutral-medium');
                knob.classList.remove('translate-x-6');
                knob.classList.add('translate-x-1');
                // document.documentElement.classList.remove('dark');
            }
        }


        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            // Check for deep link for booking page (mock)
            const urlParams = new URLSearchParams(window.location.search);
            const eventSlug = urlParams.get('event');
            if (eventSlug) {
                const eventType = state.eventTypes.find(et => et.slug === eventSlug && et.active);
                if (eventType) {
                    navigateTo('bookingPage', { eventTypeId: eventType.id });
                    return;
                }
            }
            navigateTo('dashboard'); // Default view
        });
