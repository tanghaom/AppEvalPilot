<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game ♟️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles if needed, e.g. for piece font if unicode is problematic */
        /* Forcing a specific font for chess pieces can help with consistency */
        .chess-piece {
            font-family: "Segoe UI Symbol", "Symbola", "Apple Symbols", "DejaVu Sans", sans-serif;
        }
        /* Ensure the board doesn't get too small or too large on various screens */
        #chessboard {
            min-width: 280px; /* Smallest reasonable board */
            min-height: 280px;
            max-width: 80vh; /* Max height related to viewport height */
            max-height: 80vh;
            /* Ensure it stays square. Tailwind's aspect-square should handle this too. */
        }
        .possible-move-dot::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(45, 212, 191, 0.6); /* teal-400/60 */
        }
        .possible-capture-dot::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; /* Ring-like */
            height: 80%;
            border-radius: 50%;
            border: 5px solid rgba(239, 68, 68, 0.6); /* red-500/60 */
            box-sizing: border-box;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 antialiased">

  <div id="game-container" class="flex flex-col lg:flex-row gap-4 w-full max-w-6xl">
    <!-- Chessboard -->
    <div class="flex-grow flex items-center justify-center">
        <div id="chessboard" class="grid grid-cols-8 w-full aspect-square shadow-2xl rounded-md overflow-hidden border-2 border-slate-700">
          <!-- Squares will be generated by JS -->
        </div>
    </div>

    <!-- Game Info Panel -->
    <div id="info-panel" class="bg-slate-800 p-4 rounded-md shadow-lg w-full lg:w-96 lg:max-w-sm flex flex-col space-y-3">
      <h1 class="text-3xl font-bold mb-3 text-sky-400 text-center">Chess Game</h1>
      
      <div class="bg-slate-700 p-3 rounded">
        <div id="turn-info" class="text-xl font-semibold text-center">White's Turn</div>
      </div>

      <div id="status-message" class="text-lg text-yellow-300 text-center min-h-[2.5em] bg-slate-700 p-2 rounded flex items-center justify-center"></div>
      
      <div class="flex-grow space-y-3 overflow-y-auto">
        <div class="bg-slate-700 p-3 rounded">
            <h3 class="text-md font-semibold mb-1 text-sky-300">Captured by White:</h3>
            <div id="captured-by-white" class="flex flex-wrap gap-x-2 gap-y-1 text-3xl min-h-[2em] items-center chess-piece"></div>
        </div>
        <div class="bg-slate-700 p-3 rounded">
            <h3 class="text-md font-semibold mb-1 text-sky-300">Captured by Black:</h3>
            <div id="captured-by-black" class="flex flex-wrap gap-x-2 gap-y-1 text-3xl min-h-[2em] items-center chess-piece"></div>
        </div>
      </div>

      <button id="reset-button" class="mt-auto bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-4 rounded transition-colors w-full text-lg">
        Reset Game
      </button>
    </div>
  </div>

  <!-- Pawn Promotion Modal -->
  <div id="promotion-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-700 p-6 rounded-lg shadow-xl text-center">
      <h3 class="text-xl font-semibold mb-6 text-slate-100">Promote Pawn to:</h3>
      <div id="promotion-options" class="flex gap-3 justify-center">
        <!-- Buttons for Q, R, B, N will be added here by JS -->
      </div>
    </div>
  </div>

<script>
(function() { // IIFE to encapsulate game logic
    const PIECES = {
        P: { W: '♙', B: '♟︎' }, R: { W: '♖', B: '♜' }, N: { W: '♘', B: '♞' },
        B: { W: '♗', B: '♝' }, Q: { W: '♕', B: '♛' }, K: { W: '♔', B: '♚' }
    };
    const PieceType = { PAWN: 'P', ROOK: 'R', KNIGHT: 'N', BISHOP: 'B', QUEEN: 'Q', KING: 'K' };
    const PlayerColor = { WHITE: 'W', BLACK: 'B' };

    let boardState = [];
    let currentPlayer = PlayerColor.WHITE;
    let selectedPiece = null; // { piece, r, c }
    let possibleMoves = []; // array of [r, c, type ('move' or 'capture')]
    let kingPositions = { W: null, B: null };
    let castlingRights = {};
    let enPassantTarget = null; // [r, c] square *behind* pawn that moved two steps
    let gameStatus = { over: false, winner: null, reason: '' };
    let promotionState = { promoting: false, r: null, c: null, color: null, callback: null };
    let capturedPieces = { W: [], B: [] };

    const chessboardElement = document.getElementById('chessboard');
    const turnInfoElement = document.getElementById('turn-info');
    const statusMessageElement = document.getElementById('status-message');
    const resetButton = document.getElementById('reset-button');
    const promotionModal = document.getElementById('promotion-modal');
    const promotionOptionsContainer = document.getElementById('promotion-options');
    const capturedByWhiteElement = document.getElementById('captured-by-white');
    const capturedByBlackElement = document.getElementById('captured-by-black');

    const initialBoardLayout = [
        ['R_B', 'N_B', 'B_B', 'Q_B', 'K_B', 'B_B', 'N_B', 'R_B'],
        ['P_B', 'P_B', 'P_B', 'P_B', 'P_B', 'P_B', 'P_B', 'P_B'],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        ['P_W', 'P_W', 'P_W', 'P_W', 'P_W', 'P_W', 'P_W', 'P_W'],
        ['R_W', 'N_W', 'B_W', 'Q_W', 'K_W', 'B_W', 'N_W', 'R_W']
    ];

    function initializeGame() {
        boardState = initialBoardLayout.map((row, r_idx) =>
            row.map((cell, c_idx) => {
                if (!cell) return null;
                const [type, color] = cell.split('_');
                const piece = { type, color, hasMoved: false };
                if (type === PieceType.KING) {
                    kingPositions[color] = { r: r_idx, c: c_idx };
                }
                return piece;
            })
        );
        currentPlayer = PlayerColor.WHITE;
        selectedPiece = null;
        possibleMoves = [];
        castlingRights = { W: { K: true, Q: true }, B: { K: true, Q: true } };
        enPassantTarget = null;
        gameStatus = { over: false, winner: null, reason: '' };
        promotionState = { promoting: false, r: null, c: null, color: null, callback: null };
        capturedPieces = { W: [], B: [] };
        
        renderBoard();
        updateGameInfo();
        statusMessageElement.textContent = '';
        promotionModal.classList.add('hidden');
    }

    function renderBoard() {
        chessboardElement.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                square.dataset.r = r;
                square.dataset.c = c;
                const isLightSquare = (r + c) % 2 === 0;
                square.className = `
                    ${isLightSquare ? 'bg-stone-200' : 'bg-stone-600'} 
                    aspect-square flex justify-center items-center text-4xl sm:text-5xl font-bold relative cursor-pointer chess-piece
                `;

                const piece = boardState[r][c];
                if (piece) {
                    square.textContent = PIECES[piece.type][piece.color];
                    square.classList.add(piece.color === PlayerColor.WHITE ? 'text-neutral-50' : 'text-neutral-900');
                }

                if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                    square.classList.add('ring-4', 'ring-sky-500', 'z-10', 'ring-inset');
                } else if (kingPositions[PlayerColor.WHITE] && kingPositions[PlayerColor.WHITE].r === r && kingPositions[PlayerColor.WHITE].c === c && isKingInCheck(PlayerColor.WHITE, boardState)) {
                     square.classList.add('bg-red-500/70');
                } else if (kingPositions[PlayerColor.BLACK] && kingPositions[PlayerColor.BLACK].r === r && kingPositions[PlayerColor.BLACK].c === c && isKingInCheck(PlayerColor.BLACK, boardState)) {
                     square.classList.add('bg-red-500/70');
                }


                const isPossibleMove = possibleMoves.find(m => m[0] === r && m[1] === c);
                if (isPossibleMove) {
                    const moveType = isPossibleMove[2]; // 'move' or 'capture'
                    const indicatorClass = moveType === 'capture' ? 'possible-capture-dot' : 'possible-move-dot';
                    square.classList.add(indicatorClass);
                }
                
                square.addEventListener('click', () => handleSquareClick(r, c));
                chessboardElement.appendChild(square);
            }
        }
        updateCapturedPiecesDisplay();
    }

    function handleSquareClick(r, c) {
        if (gameStatus.over || promotionState.promoting) return;

        const clickedPiece = boardState[r][c];

        if (selectedPiece) {
            const { piece: currentSelPiece, r: from_r, c: from_c } = selectedPiece;
            const isValidMove = possibleMoves.some(move => move[0] === r && move[1] === c);

            if (isValidMove) {
                makeMove(from_r, from_c, r, c);
            } else if (clickedPiece && clickedPiece.color === currentPlayer) {
                // Select another piece of the same color
                selectPiece(r, c);
            } else {
                // Clicked on empty square or opponent piece not a valid move
                clearSelection();
            }
        } else if (clickedPiece && clickedPiece.color === currentPlayer) {
            selectPiece(r, c);
        }
        renderBoard(); // Re-render to show selection/highlights
    }

    function selectPiece(r, c) {
        const piece = boardState[r][c];
        if (!piece || piece.color !== currentPlayer) return;

        selectedPiece = { piece, r, c };
        const pseudoLegalMoves = getPseudoLegalMovesForPiece(piece, r, c, boardState);
        possibleMoves = filterLegalMoves(piece, r, c, pseudoLegalMoves, boardState, currentPlayer);
    }

    function clearSelection() {
        selectedPiece = null;
        possibleMoves = [];
    }
    
    function makeMove(from_r, from_c, to_r, to_c) {
        const pieceToMove = { ...boardState[from_r][from_c] }; // Shallow copy is enough here
        const capturedPiece = boardState[to_r][to_c];
        let specialMoveType = null; // For en passant or castling logging/handling

        // Handle capture
        if (capturedPiece) {
            capturedPieces[currentPlayer === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE].push(capturedPiece.type);
        }

        // Update board
        boardState[to_r][to_c] = pieceToMove;
        boardState[from_r][from_c] = null;
        pieceToMove.hasMoved = true;

        // Update king position
        if (pieceToMove.type === PieceType.KING) {
            kingPositions[pieceToMove.color] = { r: to_r, c: to_c };
            // Invalidate castling rights if king moves
            castlingRights[pieceToMove.color].K = false;
            castlingRights[pieceToMove.color].Q = false;
        }

        // Invalidate castling rights if rook moves
        if (pieceToMove.type === PieceType.ROOK) {
            if (from_r === (pieceToMove.color === PlayerColor.WHITE ? 7 : 0)) {
                if (from_c === 0) castlingRights[pieceToMove.color].Q = false; // Queen-side rook
                if (from_c === 7) castlingRights[pieceToMove.color].K = false; // King-side rook
            }
        }
        
        // Handle Castling
        if (pieceToMove.type === PieceType.KING && Math.abs(from_c - to_c) === 2) {
            specialMoveType = 'castling';
            const rook_c_from = to_c > from_c ? 7 : 0; // King-side or Queen-side
            const rook_c_to = to_c > from_c ? to_c - 1 : to_c + 1;
            const rook = boardState[from_r][rook_c_from];
            boardState[from_r][rook_c_to] = rook;
            boardState[from_r][rook_c_from] = null;
            if(rook) rook.hasMoved = true;
        }

        // Handle En Passant capture
        if (pieceToMove.type === PieceType.PAWN && enPassantTarget && to_r === enPassantTarget.r && to_c === enPassantTarget.c) {
            specialMoveType = 'enpassant';
            const capturedPawn_r = currentPlayer === PlayerColor.WHITE ? to_r + 1 : to_r - 1;
            const actualCapturedPiece = boardState[capturedPawn_r][to_c]; // The pawn being captured en passant
            if(actualCapturedPiece && actualCapturedPiece.type === PieceType.PAWN) {
                 capturedPieces[currentPlayer === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE].push(actualCapturedPiece.type);
            }
            boardState[capturedPawn_r][to_c] = null; 
        }

        // Set new en passant target if pawn moved two squares
        if (pieceToMove.type === PieceType.PAWN && Math.abs(from_r - to_r) === 2) {
            enPassantTarget = { r: (from_r + to_r) / 2, c: from_c, color: pieceToMove.color };
        } else {
            enPassantTarget = null;
        }

        // Handle Pawn Promotion
        const promotionRank = pieceToMove.color === PlayerColor.WHITE ? 0 : 7;
        if (pieceToMove.type === PieceType.PAWN && to_r === promotionRank) {
            promotionState = { 
                promoting: true, 
                r: to_r, c: to_c, 
                color: pieceToMove.color,
                callback: (promotedType) => completePromotionAndSwitchTurn(to_r, to_c, pieceToMove.color, promotedType)
            };
            showPromotionModal(pieceToMove.color);
            clearSelection(); // Clear selection for now, board render will happen after promotion choice
            return; // Don't switch turn yet, wait for promotion
        }
        
        switchPlayerAndCheckStatus();
        clearSelection();
    }
    
    function completePromotionAndSwitchTurn(r, c, color, promotedType) {
        boardState[r][c] = { type: promotedType, color: color, hasMoved: true };
        promotionState.promoting = false;
        hidePromotionModal();
        switchPlayerAndCheckStatus(); // Now switch turn and check game status
        renderBoard(); // Render after promotion and turn switch
    }
    
    function switchPlayerAndCheckStatus() {
        currentPlayer = (currentPlayer === PlayerColor.WHITE) ? PlayerColor.BLACK : PlayerColor.WHITE;
        updateGameInfo();
        checkGameEndConditions();
    }

    function getPseudoLegalMovesForPiece(piece, r, c, currentBoard, forAttackCheck = false) {
        const moves = [];
        const { type, color } = piece;

        // Helper to add move if valid
        const addMove = (to_r, to_c, isCapturePossible = true) => {
            if (to_r < 0 || to_r > 7 || to_c < 0 || to_c > 7) return null; // Off board
            const targetPiece = currentBoard[to_r][to_c];
            if (targetPiece && targetPiece.color === color) return 'blocked'; // Blocked by own piece
            if (targetPiece && targetPiece.color !== color) { // Capture
                if (isCapturePossible) moves.push([to_r, to_c, 'capture']);
                return 'capture'; 
            }
            moves.push([to_r, to_c, 'move']); // Empty square
            return null; // Continue for sliding pieces
        };
        
        // Pawn moves
        if (type === PieceType.PAWN) {
            const dir = color === PlayerColor.WHITE ? -1 : 1;
            // Forward one
            if (!forAttackCheck && !currentBoard[r + dir][c]) {
                addMove(r + dir, c, false);
                // Forward two (initial move)
                const initialRank = color === PlayerColor.WHITE ? 6 : 1;
                if (r === initialRank && !currentBoard[r + 2 * dir][c]) {
                    addMove(r + 2 * dir, c, false);
                }
            }
            // Captures (and attack squares for forAttackCheck)
            for (let dc of [-1, 1]) {
                const target_r = r + dir;
                const target_c = c + dc;
                if (target_r < 0 || target_r > 7 || target_c < 0 || target_c > 7) continue;
                
                const diagonalPiece = currentBoard[target_r][target_c];
                if (forAttackCheck) { // If checking for attack, any piece on diagonal is an attack
                     moves.push([target_r, target_c, 'capture']); // Type doesn't matter as much here
                } else {
                    if (diagonalPiece && diagonalPiece.color !== color) {
                        addMove(target_r, target_c);
                    }
                    // En passant
                    if (enPassantTarget && enPassantTarget.r === target_r && enPassantTarget.c === target_c && enPassantTarget.color !== color) {
                        addMove(target_r, target_c); // This adds the en passant square as a move
                    }
                }
            }
        }
        // Knight moves
        else if (type === PieceType.KNIGHT) {
            const knightMoves = [
                [r-2,c-1], [r-2,c+1], [r-1,c-2], [r-1,c+2],
                [r+1,c-2], [r+1,c+2], [r+2,c-1], [r+2,c+1]
            ];
            knightMoves.forEach(([nr, nc]) => addMove(nr, nc));
        }
        // Sliding pieces (Rook, Bishop, Queen)
        else {
            let directions = [];
            if (type === PieceType.ROOK || type === PieceType.QUEEN) {
                directions.push([-1,0], [1,0], [0,-1], [0,1]); // Vertical and Horizontal
            }
            if (type === PieceType.BISHOP || type === PieceType.QUEEN) {
                directions.push([-1,-1], [-1,1], [1,-1], [1,1]); // Diagonal
            }
            directions.forEach(([dr, dc]) => {
                for (let i = 1; i < 8; i++) {
                    const result = addMove(r + i * dr, c + i * dc);
                    if (result) break; // Blocked or captured
                }
            });
        }
        // King moves
        if (type === PieceType.KING) {
             const kingMoves = [
                [r-1,c-1], [r-1,c], [r-1,c+1],
                [r,c-1],             [r,c+1],
                [r+1,c-1], [r+1,c], [r+1,c+1]
            ];
            kingMoves.forEach(([kr, kc]) => addMove(kr, kc));
            
            // Castling (only if not forAttackCheck)
            if (!forAttackCheck && !piece.hasMoved) {
                // King-side
                if (castlingRights[color] && castlingRights[color].K &&
                    !currentBoard[r][c+1] && !currentBoard[r][c+2] &&
                    currentBoard[r][c+3] && currentBoard[r][c+3].type === PieceType.ROOK && !currentBoard[r][c+3].hasMoved &&
                    !isSquareAttacked(r, c, (color === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE), currentBoard) &&
                    !isSquareAttacked(r, c+1, (color === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE), currentBoard) &&
                    !isSquareAttacked(r, c+2, (color === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE), currentBoard)) {
                    moves.push([r, c+2, 'move']); // Indicate castling by king moving 2 squares
                }
                // Queen-side
                if (castlingRights[color] && castlingRights[color].Q &&
                    !currentBoard[r][c-1] && !currentBoard[r][c-2] && !currentBoard[r][c-3] &&
                    currentBoard[r][c-4] && currentBoard[r][c-4].type === PieceType.ROOK && !currentBoard[r][c-4].hasMoved &&
                    !isSquareAttacked(r, c, (color === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE), currentBoard) &&
                    !isSquareAttacked(r, c-1, (color === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE), currentBoard) &&
                    !isSquareAttacked(r, c-2, (color === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE), currentBoard)) {
                    moves.push([r, c-2, 'move']);
                }
            }
        }
        return moves;
    }

    function filterLegalMoves(piece, r_from, c_from, pseudoLegalMoves, currentBoard, playerColor) {
        const legalMoves = [];
        const currentKingPos = kingPositions[playerColor];

        for (const move of pseudoLegalMoves) {
            const [r_to, c_to] = move;
            
            // Simulate the move on a temporary board
            const tempBoard = JSON.parse(JSON.stringify(currentBoard)); // Deep copy
            const movingPiece = { ...tempBoard[r_from][c_from] }; // Piece being moved
            
            tempBoard[r_to][c_to] = movingPiece;
            tempBoard[r_from][c_from] = null;

            // If king moved, its new position for check detection
            let kingPosForCheck = currentKingPos;
            if (movingPiece.type === PieceType.KING) {
                kingPosForCheck = { r: r_to, c: c_to };
            }
            
            // Special handling for castling: check if king moves through attacked square
            // This is already partly handled in getPseudoLegalMovesForPiece, but double check here is fine.
            if (movingPiece.type === PieceType.KING && Math.abs(c_from - c_to) === 2) {
                const intermediate_c = (c_from + c_to) / 2;
                if (isSquareAttacked(r_from, intermediate_c, (playerColor === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE), currentBoard)) { // Check on original board for passing through
                    continue;
                }
            }

            if (!isKingInCheckOnBoard(playerColor, tempBoard, kingPosForCheck)) {
                legalMoves.push(move); // Move is legal if it doesn't leave king in check
            }
        }
        return legalMoves;
    }
    
    function isKingInCheck(kingColor, boardToCheck) {
        const kingPos = kingPositions[kingColor];
        if (!kingPos) return false; // Should not happen
        const opponentColor = kingColor === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE;
        return isSquareAttacked(kingPos.r, kingPos.c, opponentColor, boardToCheck);
    }

    function isKingInCheckOnBoard(kingColor, boardToCheck, specificKingPos) {
        const kingPos = specificKingPos || kingPositions[kingColor]; // Use provided pos, else global
        if (!kingPos || typeof kingPos.r === 'undefined' || typeof kingPos.c === 'undefined') {
             // This can happen if king is captured (which shouldn't be allowed) or during initial checks.
            // For safety, assume not in check or handle appropriately.
            return false; 
        }
        const opponentColor = kingColor === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE;
        return isSquareAttacked(kingPos.r, kingPos.c, opponentColor, boardToCheck);
    }

    function isSquareAttacked(target_r, target_c, attackerColor, boardToCheck) {
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = boardToCheck[r][c];
                if (piece && piece.color === attackerColor) {
                    // For pawns, attack moves are specific diagonals.
                    // Other pieces attack where they can move.
                    // getPseudoLegalMovesForPiece with forAttackCheck=true should correctly give attacking squares.
                    const attackMoves = getPseudoLegalMovesForPiece(piece, r, c, boardToCheck, true);
                    if (attackMoves.some(move => move[0] === target_r && move[1] === target_c)) {
                        return true;
                    }
                }
            }
        }
        return false;
    }
    
    function checkGameEndConditions() {
        const inCheck = isKingInCheck(currentPlayer, boardState);
        let hasAnyLegalMove = false;

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = boardState[r][c];
                if (piece && piece.color === currentPlayer) {
                    const pseudoMoves = getPseudoLegalMovesForPiece(piece, r, c, boardState);
                    const legalMoves = filterLegalMoves(piece, r, c, pseudoMoves, boardState, currentPlayer);
                    if (legalMoves.length > 0) {
                        hasAnyLegalMove = true;
                        break;
                    }
                }
            }
            if (hasAnyLegalMove) break;
        }

        if (!hasAnyLegalMove) {
            if (inCheck) {
                gameStatus = { over: true, winner: (currentPlayer === PlayerColor.WHITE ? PlayerColor.BLACK : PlayerColor.WHITE), reason: 'CHECKMATE' };
                statusMessageElement.textContent = `Checkmate! ${gameStatus.winner === PlayerColor.WHITE ? 'White' : 'Black'} wins.`;
            } else {
                gameStatus = { over: true, winner: 'DRAW', reason: 'STALEMATE' };
                statusMessageElement.textContent = 'Stalemate! The game is a draw.';
            }
        } else if (inCheck) {
            statusMessageElement.textContent = `${currentPlayer === PlayerColor.WHITE ? 'White' : 'Black'} King in Check!`;
        } else {
            statusMessageElement.textContent = ''; // Clear previous check messages
        }
        updateGameInfo(); // Update turn display
    }

    function updateGameInfo() {
        if (gameStatus.over) {
            turnInfoElement.textContent = `Game Over`;
        } else {
            turnInfoElement.textContent = `${currentPlayer === PlayerColor.WHITE ? 'White' : 'Black'}'s Turn`;
        }
    }

    function showPromotionModal(color) {
        promotionModal.classList.remove('hidden');
        promotionOptionsContainer.innerHTML = '';
        const options = [PieceType.QUEEN, PieceType.ROOK, PieceType.BISHOP, PieceType.KNIGHT];
        options.forEach(type => {
            const button = document.createElement('button');
            button.className = `bg-sky-500 hover:bg-sky-600 text-white font-bold p-3 rounded-md text-4xl chess-piece focus:outline-none focus:ring-2 focus:ring-sky-300`;
            button.textContent = PIECES[type][color];
            button.onclick = () => {
                if (promotionState.callback) {
                    promotionState.callback(type);
                }
            };
            promotionOptionsContainer.appendChild(button);
        });
    }
    function hidePromotionModal() {
        promotionModal.classList.add('hidden');
    }
    
    function updateCapturedPiecesDisplay() {
        capturedByWhiteElement.innerHTML = capturedPieces.B.map(type => PIECES[type][PlayerColor.BLACK]).join('');
        capturedByBlackElement.innerHTML = capturedPieces.W.map(type => PIECES[type][PlayerColor.WHITE]).join('');
    }

    resetButton.addEventListener('click', initializeGame);

    // Initial setup
    initializeGame();
})();
</script>

</body>
</html>
