                    <h3 class="text-lg font-semibold text-red-700">${zone.name}</h3>
                    <p class="text-sm text-gray-600"><span class="font-medium">Location:</span> ${zone.location}</p>
                    <p class="text-sm text-gray-600"><span class="font-medium">Details:</span> ${zone.details}</p>
                </div>
            `).join('');
            renderPageContent('Fan Zones & Events', `<div class="space-y-3">${content}</div>`);
        }

        function renderMerchandisePage() {
            const content = `
                <p class="text-gray-600 mb-4">Browse official AFCON and team merchandise. Click on an item to learn more (simulated).</p>
                <div class="grid grid-cols-2 gap-4">
                    ${afconData.merchandise.map(item => `
                        <div class="bg-white p-3 rounded-lg shadow-md cursor-pointer hover:shadow-lg transition-shadow">
                            ${createPlaceholderImage('w-full h-32 mb-2')}
                            <h4 class="font-semibold text-gray-800 text-sm">${item.name}</h4>
                            <p class="text-red-600 font-bold text-xs">${item.price}</p>
                        </div>
                    `).join('')}
                </div>
                <a href="#" class="mt-6 block text-center bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors w-full">Visit Official Online Store (External)</a>
            `;
            renderPageContent('Merchandise Store', content);
        }

        // --- NAVIGATION LOGIC ---
        function navigateTo(pageId, detailId = null) {
            if (appState.currentPage === pageId && appState.currentDetailId === detailId) return; // Avoid re-rendering same page

            // Push current state to history if it's a new page (not just a detail view of same list)
            if (pageId.split('_')[0] !== appState.currentPage.split('_')[0] || !detailId) {
                 if(appState.currentPage !== 'home' || appState.currentDetailId !== null) { // Don't push home as first item
                    appState.previousPages.push({ page: appState.currentPage, detailId: appState.currentDetailId });
                 }
            }
            
            appState.currentPage = pageId;
            appState.currentDetailId = detailId;
            renderCurrentPage();
            updateActiveNav();
        }
        
        function navigateBack() {
            if (appState.previousPages.length > 0) {
                const prevState = appState.previousPages.pop();
                appState.currentPage = prevState.page;
                appState.currentDetailId = prevState.detailId;
                renderCurrentPage();
                updateActiveNav();
            } else { // Fallback to home if history is empty
                navigateTo('home');
            }
        }

        function updateBackButton() {
            if (appState.previousPages.length > 0 && appState.currentPage !== 'home') {
                backButton.classList.remove('hidden');
            } else {
                backButton.classList.add('hidden');
            }
        }

        function renderCurrentPage() {
            // Clear previous live match simulation if any
            if (appState.liveMatchSimulationInterval) {
                clearInterval(appState.liveMatchSimulationInterval);
                appState.liveMatchSimulationInterval = null;
            }

            const [basePage, subPageOrDetail] = appState.currentPage.split('_');
            
            switch (basePage) {
                case 'home': renderHomePage(); break;
                case 'matches': renderMatchesPage(); break;
                case 'matchDetail': renderMatchDetailPage(appState.currentDetailId); break;
                case 'venues': renderVenuesPage(); break;
                case 'venueDetail': renderVenueDetailPage(appState.currentDetailId); break;
                case 'explore':
                    if (subPageOrDetail === 'attractions') renderAttractionsPage();
                    else if (subPageOrDetail === 'attractionDetail') renderAttractionDetailPage(appState.currentDetailId);
                    else if (subPageOrDetail === 'cuisine') renderCuisinePage();
                    else if (subPageOrDetail === 'culturalTips') renderCulturalTipsPage();
                    else if (subPageOrDetail === 'language') renderLanguagePage();
                    else renderExplorePage(); // Main explore menu
                    break;
                case 'more': renderMorePage(); break;
                case 'tickets': renderPlaceholderPage('Ticket Booking', 'Access the official AFCON ticket portal here.'); break;
                case 'merchandise': renderMerchandisePage(); break;
                case 'fanZones': renderFanZonesPage(); break;
                // Add more cases for sub-pages of 'More' if they become complex
                default: renderHomePage();
            }
        }

        function updateActiveNav() {
            document.querySelectorAll('#bottom-nav button').forEach(button => {
                button.classList.remove('active-nav-item', 'text-red-700');
                button.classList.add('text-gray-500');
                if (button.dataset.page.startsWith(appState.currentPage.split('_')[0])) {
                    button.classList.add('active-nav-item', 'text-red-700');
                    button.classList.remove('text-gray-500');
                }
            });
        }

        // Initialize Bottom Navigation
        function initNav() {
            NAV_ITEMS.forEach(item => {
                const button = document.createElement('button');
                button.className = 'flex-1 py-2 px-1 text-center text-gray-500 hover:text-red-600 transition-colors focus:outline-none';
                button.dataset.page = item.id;
                button.innerHTML = `
                    ${item.icon}
                    <span class="text-xs block">${item.label}</span>
                `;
                button.onclick = () => navigateTo(item.id);
                bottomNav.appendChild(button);
            });
        }
        
        // --- LIVE SCORE SIMULATION ---
        function simulateLiveScores() {
            const liveMatch = afconData.matches.find(m => m.status === 'Live');
            if (liveMatch) {
                appState.liveMatchSimulationInterval = setInterval(() => {
                    if (liveMatch.liveMinute < 90) {
                        liveMatch.liveMinute += 1;
                        // Randomly change score sometimes
                        if (Math.random() < 0.05) { // 5% chance of a goal
                            if (Math.random() < 0.5) liveMatch.scoreA++; else liveMatch.scoreB++;
                        }
                        if (appState.currentPage === 'matches' || (appState.currentPage === 'matchDetail' && appState.currentDetailId === liveMatch.id)) {
                           renderCurrentPage(); // Re-render if viewing matches or the specific live match
                        }
                    } else {
                        liveMatch.status = 'Finished';
                        clearInterval(appState.liveMatchSimulationInterval);
                        appState.liveMatchSimulationInterval = null;
                        if (appState.currentPage === 'matches' || (appState.currentPage === 'matchDetail' && appState.currentDetailId === liveMatch.id)) {
                           renderCurrentPage();
                        }
                    }
                }, 5000); // Update every 5 seconds
            }
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            initNav();
            navigateTo('home'); // Start with home page
            simulateLiveScores(); // Start live score simulation

            backButton.addEventListener('click', navigateBack);
            modalCloseButton.addEventListener('click', hideModal);
        });

    </script>
</body>
</html>
