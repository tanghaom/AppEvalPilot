<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a more VSCode like feel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2D3748; /* slate-700 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4A5568; /* slate-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #718096; /* slate-500 */
        }
        /* For Firefox */
        html {
            scrollbar-width: thin;
            scrollbar-color: #4A5568 #2D3748;
        }
        .font-mono { /* Ensure a nice monospace font is used */
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased overflow-hidden">

    <div id="app-container" class="flex flex-col h-screen">
        <!-- Title Bar -->
        <div id="title-bar" class="h-8 bg-slate-800 flex items-center justify-between px-3 text-xs border-b border-slate-700 flex-shrink-0">
            <div class="flex items-center space-x-3">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-sky-500">
                    <path d="M10.5 4.5a3 3 0 0 0-3 3v10.5a3 3 0 0 0 3 3h3a3 3 0 0 0 3-3V7.5a3 3 0 0 0-3-3h-3Zm0 1.5h3a1.5 1.5 0 0 1 1.5 1.5v10.5a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5V7.5a1.5 1.5 0 0 1 1.5-1.5Z" />
                </svg>
                <span class="hover:bg-slate-700 px-1.5 py-0.5 rounded-sm cursor-default">File</span>
                <span class="hover:bg-slate-700 px-1.5 py-0.5 rounded-sm cursor-default">Edit</span>
                <span class="hover:bg-slate-700 px-1.5 py-0.5 rounded-sm cursor-default">View</span>
                <span class="hover:bg-slate-700 px-1.5 py-0.5 rounded-sm cursor-default">Go</span>
            </div>
            <div id="current-file-title" class="text-slate-400">VSCode Clone</div>
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-slate-600 rounded-full hover:bg-yellow-500 cursor-pointer"></div>
                <div class="w-3 h-3 bg-slate-600 rounded-full hover:bg-green-500 cursor-pointer"></div>
                <div class="w-3 h-3 bg-slate-600 rounded-full hover:bg-red-500 cursor-pointer"></div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Activity Bar -->
            <div id="activity-bar" class="w-12 bg-slate-800 flex flex-col items-center justify-between py-2 border-r border-slate-700 flex-shrink-0">
                <div id="activity-bar-main" class="space-y-1 w-full">
                    <!-- Activity Icons will go here -->
                </div>
                <div id="activity-bar-secondary" class="space-y-1 w-full">
                    <!-- Secondary icons (Account, Settings) -->
                </div>
            </div>

            <!-- Sidebar -->
            <div id="sidebar" class="w-72 bg-slate-800 border-r border-slate-700 flex-shrink-0 flex flex-col overflow-y-auto">
                <!-- Sidebar content (e.g., File Explorer) will go here -->
            </div>

            <!-- Editor & Panel Area -->
            <div class="flex flex-col flex-1 overflow-hidden">
                <!-- Editor Tabs -->
                <div id="editor-tabs-container" class="h-10 bg-slate-800 flex items-end border-b border-slate-700 overflow-x-auto flex-shrink-0">
                    <!-- Editor tabs will go here -->
                </div>

                <!-- Editor Content -->
                <div id="editor-content-area" class="flex-1 bg-slate-900 overflow-auto">
                    <!-- Editor content will go here -->
                </div>

                <!-- Panel -->
                <div id="panel-container" class="h-1/3 bg-slate-800 border-t border-slate-700 flex flex-col flex-shrink-0">
                    <!-- Panel Tabs -->
                    <div id="panel-tabs-container" class="h-8 bg-slate-800 flex items-center px-2 space-x-1 border-b border-slate-700 flex-shrink-0">
                        <!-- Panel tabs will go here -->
                    </div>
                    <!-- Panel Content -->
                    <div id="panel-content-area" class="flex-1 p-3 overflow-auto font-mono text-sm">
                        <!-- Panel content will go here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar" class="h-6 bg-sky-600 text-sky-100 flex items-center justify-between px-3 text-xs flex-shrink-0">
            <div class="flex items-center space-x-3">
                <span class="hover:bg-sky-700 px-1 rounded-sm cursor-pointer">main*</span>
                <span id="status-bar-ln-col" class="hover:bg-sky-700 px-1 rounded-sm cursor-pointer">Ln 1, Col 1</span>
            </div>
            <div class="flex items-center space-x-3">
                <span id="status-bar-language" class="hover:bg-sky-700 px-1 rounded-sm cursor-pointer">Plain Text</span>
                <span>UTF-8</span>
                <span>CRLF</span>
                <span class="hover:bg-sky-700 px-1 rounded-sm cursor-pointer">Notifications</span>
            </div>
        </div>
    </div>
