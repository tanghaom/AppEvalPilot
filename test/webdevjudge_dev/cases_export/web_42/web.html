<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <style>
        /* For custom scrollbars, if desired (optional) */
        ::-webkit-scrollbar {
            width: 0px; /* For Chrome, Safari, and Opera */
            height: 0px;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        body {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .font-grand-hotel {
            font-family: 'Grand Hotel', cursive;
        }
        .story-gradient-ring {
            padding: 2px; /* Adjust padding to control border thickness */
            background: linear-gradient(to right top, #f9ce34, #ee2a7b, #6228d7); /* Instagram gradient */
        }
        .story-gradient-ring-seen {
            padding: 2px;
            background: #dbdbdb; /* Tailwind gray-300 */
        }
    </style>
</head>
<body class="bg-zinc-100 flex justify-center items-center min-h-screen">

    <div id="app-container" class="w-full max-w-md h-screen bg-white flex flex-col shadow-2xl overflow-hidden">

        <!-- Top Header (Contextual) -->
        <div id="top-header" class="h-14 border-b border-zinc-200 px-4 flex items-center justify-between shrink-0">
            <!-- Content dynamically inserted by JS -->
        </div>

        <!-- Main Content Area (Scrollable) -->
        <main id="main-content" class="flex-grow overflow-y-auto">
            <!-- Content dynamically inserted by JS -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="h-14 border-t border-zinc-200 flex items-center justify-around shrink-0 bg-white">
            <!-- Icons dynamically inserted by JS -->
        </nav>
    </div>

            currentPage: 'home', // 'home', 'explore', 'add', 'reels', 'profile'

                "user_jane": { username: "adventure.jane", avatar: "https://i.pravatar.cc/150?u=adventure.jane", name: "Jane Doe", bio: "Exploring the world, one photo at a time 🌍✈️\nLover of mountains and sunsets.", postsCount: 120, followersCount: "1.2M", followingCount: 300 },
                "john_travels": { username: "john_travels", avatar: "https://i.pravatar.cc/150?u=john_travels", name: "John Smith", bio: "Wanderlust and city dust. Capturing life's moments.", postsCount: 250, followersCount: "875K", followingCount: 450 },
                "foodie_gal": { username: "foodie_gal", avatar: "https://i.pravatar.cc/150?u=foodie_gal", name: "Alice Foodie", bio: "Delicious bites and culinary delights! 🍕🍰", postsCount: 500, followersCount: "2.5M", followingCount: 100 },

                "lisa_reads": { username: "lisa_reads", avatar: "https://i.pravatar.cc/150?u=lisa_reads", name: "Lisa Bookworm", bio: "Lost in pages and stories. 📚\n#booklover #reader", postsCount: 320, followersCount: "50K", followingCount: 150 },
            },
            stories: [
                { userId: "john_travels", image: "https://source.unsplash.com/random/150x150?sig=1&person,travel", viewed: false },
                { userId: "foodie_gal", image: "https://source.unsplash.com/random/150x150?sig=2&person,food", viewed: false },
                { userId: "creative_soul", image: "https://source.unsplash.com/random/150x150?sig=3&person,art", viewed: true },
                { userId: "user_jane", image: "https://source.unsplash.com/random/150x150?sig=4&person,nature", viewed: false },
                { userId: "marketer_mike", image: "https://source.unsplash.com/random/150x150?sig=5&person,city", viewed: false },

                {

                    image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Villarrica_Volcano_and_Town_Pucon_Chile_DSC00351.jpg/1024px-Villarrica_Volcano_and_Town_Pucon_Chile_DSC00351.jpg',

                },

                    caption: 'Exploring the historic Römerberg in Frankfurt. The architecture is stunning! #Frankfurt #Germany #Cityscape #Travel',
                    location: 'Frankfurt, Germany', likes: 876, isLiked: true, isBookmarked: true, commentsCount: 45, timestamp: '5 HOURS AGO'
                },

                    caption: 'Graceful swans on Lake Kussharo, Japan. A serene moment in nature. 🦢 #Japan #Wildlife #NatureLovers #Swans',
                    location: 'Lake Kussharo, Japan', likes: 980, isLiked: true, isBookmarked: false, commentsCount: 62, timestamp: '4 DAYS AGO'
                }
            ],
            currentUserProfileId: 'user_jane', // The user whose profile we are viewing
            loggedInUserId: 'user_jane' // The user who is logged in
        };

        const topHeaderEl = document.getElementById('top-header');
        const mainContentEl = document.getElementById('main-content');
        const bottomNavEl = document.getElementById('bottom-nav');

        function getUser(userId) {
            return appState.users[userId] || { username: 'unknown', avatar: '', name: 'Unknown User' };
        }

        function navigateTo(page, profileUserId = null) {
            appState.currentPage = page;
            if (page === 'profile' && profileUserId) {
                appState.currentUserProfileId = profileUserId;
            }
            renderApp();
        }
        
        function toggleLike(postId) {
            const post = appState.posts.find(p => p.id === postId);
            if (post) {
                post.isLiked = !post.isLiked;
                post.likes += post.isLiked ? 1 : -1;
                renderApp(); // Re-render to update UI
            }
        }

        function toggleBookmark(postId) {
            const post = appState.posts.find(p => p.id === postId);
            if (post) {
                post.isBookmarked = !post.isBookmarked;
                renderApp(); // Re-render to update UI
            }
        }

        function renderTopHeader() {
            let content = '';
            if (appState.currentPage === 'home') {
                content = `
                    <div class="font-grand-hotel text-3xl text-zinc-900">Instagram</div>
                    <div class="flex items-center space-x-4">
                        <button>${ICONS.heartOutline}</button>
                        <button>${ICONS.dm}</button>
                    </div>
                `;
            } else if (appState.currentPage === 'explore') {
                content = `
                    <input type="search" placeholder="Search" class="bg-zinc-100 text-zinc-800 placeholder-zinc-400 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring-1 focus:ring-zinc-300">
                `;
            } else if (appState.currentPage === 'profile') {
                const user = getUser(appState.currentUserProfileId);
                content = `
                    <div class="font-semibold text-lg text-zinc-900">${user.username}</div>
                    <div class="flex items-center space-x-4">
                         <button>${ICONS.add}</button> <!-- Placeholder for create menu -->
                    </div>
                `;
            } else {
                 content = `<div class="font-semibold text-lg text-zinc-900">${appState.currentPage.charAt(0).toUpperCase() + appState.currentPage.slice(1)}</div>`;
            }
            topHeaderEl.innerHTML = content;
        }

        function renderBottomNav() {
            const loggedInUser = getUser(appState.loggedInUserId);
            const navItems = [
                { name: 'home', icon: ICONS.home, activeIcon: ICONS.homeSolid },
                { name: 'explore', icon: ICONS.explore, activeIcon: ICONS.exploreSolid },
                { name: 'add', icon: ICONS.add, activeIcon: ICONS.add }, // No separate active state for add
                { name: 'reels', icon: ICONS.reels, activeIcon: ICONS.reelsSolid },
                { name: 'profile', isAvatar: true, avatar: loggedInUser.avatar }
            ];

            bottomNavEl.innerHTML = navItems.map(item => {
                const isActive = appState.currentPage === item.name;
                if (item.isAvatar) {
                    return `
                        <button data-page="profile" data-profile-id="${appState.loggedInUserId}" class="p-1 rounded-full ${isActive ? 'ring-2 ring-offset-1 ring-zinc-800' : ''}">
                            <img src="${item.avatar}" alt="Profile" class="w-7 h-7 rounded-full object-cover">
                        </button>
                    `;
                }
                return `
                    <button data-page="${item.name}" class="text-zinc-800">
                        ${isActive ? item.activeIcon : item.icon}
                    </button>
                `;
            }).join('');

            bottomNavEl.querySelectorAll('button').forEach(button => {
                button.addEventListener('click', () => {
                    const page = button.dataset.page;
                    const profileId = button.dataset.profileId;
                    navigateTo(page, profileId);
                });
            });
        }

        function renderStories() {
            const storiesHtml = appState.stories.map(story => {
                const user = getUser(story.userId);
                const ringClass = story.viewed ? 'story-gradient-ring-seen' : 'story-gradient-ring';
                return `
                    <div class="flex-shrink-0 w-20 text-center">
                        <div class="${ringClass} rounded-full inline-block">
                            <div class="bg-white p-0.5 rounded-full">
                               <img src="${user.avatar}" alt="${user.username}" class="w-16 h-16 rounded-full object-cover">
                            </div>
                        </div>
                        <p class="text-xs text-zinc-700 mt-1 truncate">${user.username}</p>
                    </div>
                `;
            }).join('');

            return `
                <div class="h-28 border-b border-zinc-200 flex items-center px-2 space-x-3 overflow-x-auto">
                    ${storiesHtml}
                </div>
            `;
        }
        
        function renderPost(post) {
            const user = getUser(post.userId);
            return `
                <div class="border-b border-zinc-200">
                    <!-- Post Header -->
                    <div class="flex items-center p-3">
                        <img src="${user.avatar}" alt="${user.username}" class="w-8 h-8 rounded-full object-cover mr-3">
                        <div>
                            <p class="font-semibold text-sm text-zinc-900">${user.username}</p>
                            ${post.location ? `<p class="text-xs text-zinc-500">${post.location}</p>` : ''}
                        </div>
                        <button class="ml-auto text-zinc-700">${ICONS.ellipsis}</button>
                    </div>

                    <!-- Post Image -->
                    <div class="aspect-square bg-zinc-100">
                        <img src="${post.image}" alt="Post by ${user.username}" class="w-full h-full object-cover">
                    </div>

                    <!-- Post Actions -->
                    <div class="flex items-center p-3 space-x-4">
                        <button data-post-id="${post.id}" class="action-like text-zinc-800">
                            ${post.isLiked ? ICONS.heartSolid : ICONS.heartOutline}
                        </button>
                        <button class="text-zinc-800">${ICONS.comment}</button>
                        <button class="text-zinc-800">${ICONS.share}</button>
                        <button data-post-id="${post.id}" class="action-bookmark ml-auto text-zinc-800">
                            ${post.isBookmarked ? ICONS.bookmarkSolid : ICONS.bookmarkOutline}
                        </button>
                    </div>

                    <!-- Likes & Caption -->
                    <div class="px-3 pb-1">
                        <p class="font-semibold text-sm text-zinc-900">${post.likes.toLocaleString()} likes</p>
                        <p class="text-sm mt-1 text-zinc-900">
                            <span class="font-semibold cursor-pointer" onclick="navigateTo('profile', '${post.userId}')">${user.username}</span>
                            ${post.caption.length > 100 ? post.caption.substring(0, 100) + '... <span class="text-zinc-500">more</span>' : post.caption}
                        </p>
                        ${post.commentsCount > 0 ? `<p class="text-sm text-zinc-500 mt-1">View all ${post.commentsCount} comments</p>` : ''}
                        <p class="text-xs text-zinc-400 uppercase mt-2">${post.timestamp}</p>
                    </div>
                    
                    <!-- Add Comment Input -->
                    <div class="px-3 py-2 border-t border-zinc-100 flex items-center">
                        <img src="${getUser(appState.loggedInUserId).avatar}" alt="My Avatar" class="w-6 h-6 rounded-full object-cover mr-2">
                        <input type="text" placeholder="Add a comment..." class="text-sm w-full focus:outline-none placeholder-zinc-400">
                    </div>
                </div>
            `;
        }

        function renderHomePage() {
            const storiesSection = renderStories();
            const postsFeed = appState.posts.map(renderPost).join('');
            mainContentEl.innerHTML = `
                <div>
                    ${storiesSection}
                    ${postsFeed}
                </div>
            `;
            
            mainContentEl.querySelectorAll('.action-like').forEach(button => {
                button.addEventListener('click', () => toggleLike(button.dataset.postId));
            });
            mainContentEl.querySelectorAll('.action-bookmark').forEach(button => {
                button.addEventListener('click', () => toggleBookmark(button.dataset.postId));
            });
        }

        function renderExplorePage() {
            const explorePosts = appState.posts.slice().sort(() => 0.5 - Math.random()); // Shuffle for variety
            const gridHtml = explorePosts.map(post => `
                <div class="aspect-square bg-zinc-200">
                    <img src="${post.image}" alt="Explore post" class="w-full h-full object-cover">
                </div>
            `).join('');

            mainContentEl.innerHTML = `
                <div class="p-0.5">
                    <div class="grid grid-cols-3 gap-0.5">
                        ${gridHtml}
                    </div>
                </div>
            `;
        }

        function renderProfilePage() {
            const user = getUser(appState.currentUserProfileId);
            const userPosts = appState.posts.filter(post => post.userId === appState.currentUserProfileId);

            const postsGridHtml = userPosts.map(post => `
                <div class="aspect-square bg-zinc-200">
                    <img src="${post.image}" alt="Post by ${user.username}" class="w-full h-full object-cover">
                </div>
            `).join('');

            mainContentEl.innerHTML = `
                <div class="p-4">
                    <!-- Profile Header -->
                    <div class="flex items-center mb-4">
                        <img src="${user.avatar}" alt="${user.username}" class="w-20 h-20 md:w-24 md:h-24 rounded-full object-cover mr-6">
                        <div class="flex-grow space-y-3">
                            <div class="flex items-center justify-around text-center">
                                <div>
                                    <p class="font-bold text-lg text-zinc-900">${user.postsCount}</p>
                                    <p class="text-sm text-zinc-600">Posts</p>
                                </div>
                                <div>
                                    <p class="font-bold text-lg text-zinc-900">${user.followersCount}</p>
                                    <p class="text-sm text-zinc-600">Followers</p>
                                </div>
                                <div>
                                    <p class="font-bold text-lg text-zinc-900">${user.followingCount}</p>
                                    <p class="text-sm text-zinc-600">Following</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- User Info -->
                    <div>
                        <p class="font-semibold text-zinc-900">${user.name}</p>
                        <p class="text-sm text-zinc-700 whitespace-pre-line">${user.bio}</p>
                        <!-- <a href="#" class="text-sm text-blue-500 font-semibold">website.com</a> -->
                    </div>
                     <!-- Action Buttons -->
                    <div class="flex space-x-2 mt-4">
                        <button class="flex-1 bg-zinc-200 text-zinc-800 font-semibold py-1.5 rounded-md text-sm">Edit Profile</button>
                        <button class="flex-1 bg-zinc-200 text-zinc-800 font-semibold py-1.5 rounded-md text-sm">Share Profile</button>
                    </div>
                </div>

                <!-- Story Highlights (Placeholder) -->
                <div class="px-4 py-2 border-t border-b border-zinc-200">
                    <p class="text-sm text-zinc-500">Story Highlights (coming soon)</p>
                </div>
                
                <!-- Tab Navigation -->
                <div class="flex justify-around border-b border-zinc-200">
                    <button class="flex-1 py-3 border-t-2 border-zinc-800 text-zinc-800">${ICONS.grid}</button>
                    <button class="flex-1 py-3 text-zinc-400">${ICONS.reels}</button>
                    <button class="flex-1 py-3 text-zinc-400">${ICONS.tag}</button>
                </div>

                <!-- Posts Grid -->
                <div class="grid grid-cols-3 gap-0.5">
                    ${postsGridHtml.length > 0 ? postsGridHtml : '<p class="col-span-3 text-center text-zinc-500 py-10">No posts yet.</p>'}
                </div>
            `;
        }
        
        function renderPlaceholderPage(pageName) {
             mainContentEl.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full p-8 text-center">
                    <div class="text-5xl mb-4">🚧</div>
                    <h2 class="text-2xl font-semibold text-zinc-800 mb-2">${pageName.charAt(0).toUpperCase() + pageName.slice(1)}</h2>
                    <p class="text-zinc-600">This page is under construction. Check back soon!</p>
                </div>
            `;
        }

        function renderApp() {
            renderTopHeader();
            renderBottomNav();

            // Scroll to top of content area on page change
            mainContentEl.scrollTop = 0;

            switch (appState.currentPage) {
                case 'home':
                    renderHomePage();
                    break;
                case 'explore':
                    renderExplorePage();
                    break;
                case 'profile':
                    renderProfilePage();
                    break;
                case 'add':
                case 'reels':
                case 'shop': // Assuming shop might be a page eventually
                     renderPlaceholderPage(appState.currentPage);
                    break;
                default:
                    mainContentEl.innerHTML = `<p class="p-4 text-zinc-700">Page not found</p>`;
            }
        }

        // Initial Render
        document.addEventListener('DOMContentLoaded', renderApp);

    </script>

</body>
</html>
