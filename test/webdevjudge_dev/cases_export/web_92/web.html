    <script>
        // Helper to quickly create DOM elements
        function createElement(tag, attributes = {}, children = []) {
            const el = document.createElement(tag);
            for (const key in attributes) {
                if (key === 'class') {
                    el.className = attributes[key];
                } else if (key === 'textContent') {
                    el.textContent = attributes[key];
                } else if (key === 'innerHTML') {
                    el.innerHTML = attributes[key];
                } else {
                    el.setAttribute(key, attributes[key]);
                }
            }
            children.forEach(child => {
                if (typeof child === 'string') {
                    el.appendChild(document.createTextNode(child));
                } else {
                    el.appendChild(child);
                }
            });
            return el;
        }


        const App = {

                loggedInUser: null,
                clients: [

                    { id: 3, name: 'Innovate Labs', email: 'hello@innovatelabs.io', phone: '555-8765', address: '789 Innovation Dr, Future City, TX', balance: 0.00, dateAdded: '2023-03-10' },
                ],
                products: [

                    { id: 4, name: 'Cloud Storage (1TB)', description: '1TB of secure cloud storage, yearly subscription', price: 99.00, type: 'Service', stock: null },
                ],

                    { id: 'Q-2024-002', clientId: 2, clientName: 'GreenScape Landscaping', date: '2024-05-05', expiryDate: '2024-05-20', items: [{ productId: 3, quantity: 1, unitPrice: 500.00 }], total: 500.00, status: 'Draft' },
                ],
                invoices: [
                    { id: 'INV-2024-001', clientId: 1, clientName: 'Tech Solutions Inc.', quotationId: 'Q-2024-001', date: '2024-05-16', dueDate: '2024-06-15', items: [{ productId: 1, quantity: 10, unitPrice: 75.00 }], total: 750.00, paid: 0.00, status: 'Sent' },
                    { id: 'INV-2024-002', clientId: 3, clientName: 'Innovate Labs', date: '2024-04-20', dueDate: '2024-05-20', items: [{ productId: 2, quantity: 2, unitPrice: 1200.00 }, {productId: 4, quantity:1, unitPrice: 99.00}], total: 2499.00, paid: 2499.00, status: 'Paid' },
                ],
                purchaseOrders: [
                     { id: 'PO-2024-001', supplierName: 'Bulk Components Ltd.', date: '2024-05-10', expectedDelivery: '2024-05-25', items: [{ itemName: 'Laptop Model X', quantity: 20, unitPrice: 800.00 }], total: 16000.00, status: 'Ordered' }
                ],
                users: [
                    { id: 1, name: 'Admin User', email: 'admin@example.com', role: 'Administrator', dateAdded: '2023-01-01' },
                    { id: 2, name: 'Sales Rep', email: 'sales@example.com', role: 'Sales', dateAdded: '2023-02-01' },
                ],
                nextIds: {
                    client: 4,
                    product: 5,
                    user: 3,
                    quotation: 3,
                    invoice: 3,
                    purchaseOrder: 2,
                },
                currentForm: {
                    type: null, // 'client', 'product', etc.
                    mode: 'add', // 'add' or 'edit'
                    itemId: null
                },
                confirmationCallback: null,
            },

            // DOM Elements
            els: {
                loginScreen: null, mainApp: null, pageContentContainer: null, pageTitle: null,
                sidebar: null, openSidebarButton: null, closeSidebarButton: null,
                loginForm: null, loginEmail: null, loginPassword: null, loginError: null,
                logoutButton: null, loggedInUserName: null, loggedInUserEmail: null, headerUserName: null, headerUserRole: null,
                itemFormModal: null, itemFormModalTitle: null, itemForm: null, itemFormModalCloseButton: null, itemFormModalSaveButton: null,
                confirmationModal: null, confirmationModalTitle: null, confirmationModalMessage: null, confirmationModalCancelButton: null, confirmationModalConfirmButton: null,
            },

            init() {
                // Cache DOM elements
                this.els.loginScreen = document.getElementById('loginScreen');
                this.els.mainApp = document.getElementById('mainApp');
                this.els.pageContentContainer = document.getElementById('pageContentContainer');
                this.els.pageTitle = document.getElementById('pageTitle');
                this.els.sidebar = document.getElementById('sidebar');
                this.els.openSidebarButton = document.getElementById('openSidebarButton');
                this.els.closeSidebarButton = document.getElementById('closeSidebarButton');
                
                this.els.loginForm = document.getElementById('loginForm');
                this.els.loginEmail = document.getElementById('loginEmail');
                this.els.loginPassword = document.getElementById('loginPassword');
                this.els.loginError = document.getElementById('loginError');
                
                this.els.logoutButton = document.getElementById('logoutButton');
                this.els.loggedInUserName = document.getElementById('loggedInUserName');
                this.els.loggedInUserEmail = document.getElementById('loggedInUserEmail');
                this.els.headerUserName = document.getElementById('headerUserName');
                this.els.headerUserRole = document.getElementById('headerUserRole');

                this.els.itemFormModal = document.getElementById('itemFormModal');
                this.els.itemFormModalTitle = document.getElementById('itemFormModalTitle');
                this.els.itemForm = document.getElementById('itemForm');
                this.els.itemFormModalCloseButton = document.getElementById('itemFormModalCloseButton');
                this.els.itemFormModalSaveButton = document.getElementById('itemFormModalSaveButton');

                this.els.confirmationModal = document.getElementById('confirmationModal');
                this.els.confirmationModalTitle = document.getElementById('confirmationModalTitle');
                this.els.confirmationModalMessage = document.getElementById('confirmationModalMessage');
                this.els.confirmationModalCancelButton = document.getElementById('confirmationModalCancelButton');
                this.els.confirmationModalConfirmButton = document.getElementById('confirmationModalConfirmButton');

                // Attach event listeners
                this.els.loginForm.addEventListener('submit', this.handleLogin.bind(this));
                this.els.logoutButton.addEventListener('click', this.handleLogout.bind(this));
                
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.navigateTo(link.dataset.page);
                        if (window.innerWidth < 768) { // Close sidebar on mobile after navigation
                           this.els.sidebar.classList.add('-translate-x-full');
                        }
                    });
                });

                this.els.openSidebarButton.addEventListener('click', () => this.els.sidebar.classList.remove('-translate-x-full'));
                this.els.closeSidebarButton.addEventListener('click', () => this.els.sidebar.classList.add('-translate-x-full'));

                this.els.itemFormModalSaveButton.addEventListener('click', this.handleItemFormSave.bind(this));
                this.els.itemFormModalCloseButton.addEventListener('click', () => this.els.itemFormModal.close());
                this.els.confirmationModalCancelButton.addEventListener('click', () => this.els.confirmationModal.close());
                this.els.confirmationModalConfirmButton.addEventListener('click', this.handleConfirmation.bind(this));


                feather.replace(); // Initial icon replacement

                // Check for "remembered" login (very basic, for demo)
                if (localStorage.getItem('loggedInUser')) {
                    this.state.loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
                    this.showMainApp();
                    this.navigateTo('dashboard');
                } else {
                    this.showLoginScreen();
                }
            },

            showLoginScreen() {
                this.state.currentPage = 'login';
                this.els.loginScreen.classList.remove('hidden');
                this.els.mainApp.classList.add('hidden');
            },

            showMainApp() {
                this.els.loginScreen.classList.add('hidden');
                this.els.mainApp.classList.remove('hidden');
                if (this.state.loggedInUser) {
                    this.els.loggedInUserName.textContent = this.state.loggedInUser.name;
                    this.els.loggedInUserEmail.textContent = this.state.loggedInUser.email;
                    this.els.headerUserName.textContent = this.state.loggedInUser.name;
                    this.els.headerUserRole.textContent = this.state.loggedInUser.role || 'User';
                    const avatarName = this.state.loggedInUser.name.split(' ').map(n=>n[0]).join('');
                    document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(this.state.loggedInUser.name)}&background=0D8ABC&color=fff&rounded=true&size=32`;
                }
            },

            handleLogin(event) {
                event.preventDefault();
                const email = this.els.loginEmail.value;
                const password = this.els.loginPassword.value;
                // Simulated authentication
                const foundUser = this.state.users.find(u => u.email === email);
                if (foundUser && password === 'password') { // In a real app, password would be hashed and checked
                    this.state.loggedInUser = foundUser;
                    localStorage.setItem('loggedInUser', JSON.stringify(foundUser)); // Basic "remember me"
                    this.showMainApp();
                    this.navigateTo('dashboard');
                    this.els.loginError.textContent = '';
                } else {
                    this.els.loginError.textContent = 'Invalid email or password.';
                }
            },

            handleLogout(event) {
                event.preventDefault();
                this.state.loggedInUser = null;
                localStorage.removeItem('loggedInUser');
                this.showLoginScreen();
            },

            navigateTo(page) {
                if (!this.state.loggedInUser && page !== 'login') {
                    this.navigateTo('login'); // or showLoginScreen()
                    return;
                }
                this.state.currentPage = page;
                this.updateActiveNavLink(page);
                this.renderPageContent(page);
                this.els.pageTitle.textContent = page.charAt(0).toUpperCase() + page.slice(1).replace(/([A-Z])/g, ' $1'); // Add space before caps
                feather.replace(); // Re-render icons after content change
            },
            
            updateActiveNavLink(page) {
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.remove('bg-blue-600', 'text-white', 'font-semibold');
                    link.classList.add('text-gray-300', 'hover:bg-gray-700', 'hover:text-white');
                    if (link.dataset.page === page) {
                        link.classList.add('bg-blue-600', 'text-white', 'font-semibold');
                        link.classList.remove('text-gray-300', 'hover:bg-gray-700');
                    }
                });
            },

            renderPageContent(page) {
                this.els.pageContentContainer.innerHTML = ''; // Clear previous content
                switch (page) {
                    case 'dashboard': this.renderDashboard(); break;
                    case 'clients': this.renderList('clients', ['ID', 'Name', 'Email', 'Phone', 'Balance'], ['id', 'name', 'email', 'phone', 'balance']); break;
                    case 'products': this.renderList('products', ['ID', 'Name', 'Price', 'Type', 'Stock'], ['id', 'name', 'price', 'type', 'stock']); break;
                    case 'quotations': this.renderList('quotations', ['ID', 'Client', 'Date', 'Total', 'Status'], ['id', 'clientName', 'date', 'total', 'status'], this.renderQuotationActions); break;
                    case 'invoices': this.renderList('invoices', ['ID', 'Client', 'Date', 'Total', 'Status'], ['id', 'clientName', 'date', 'total', 'status'], this.renderInvoiceActions); break;
                    case 'purchaseOrders': this.renderList('purchaseOrders', ['ID', 'Supplier', 'Date', 'Total', 'Status'], ['id', 'supplierName', 'date', 'total', 'status']); break;
                    case 'users': this.renderList('users', ['ID', 'Name', 'Email', 'Role'], ['id', 'name', 'email', 'role']); break;
                    default: this.els.pageContentContainer.innerHTML = `<p class="text-gray-600">Page not found or not yet implemented: ${page}</p>`;
                }
                feather.replace();
            },
            
            // --- Generic List Rendering ---
            renderList(itemType, headers, itemKeys, customActionsRenderer = null) {
                const title = itemType.charAt(0).toUpperCase() + itemType.slice(1);
                const items = this.state[itemType];

                const container = createElement('div');
                const headerDiv = createElement('div', { class: 'flex justify-between items-center mb-6' });
                headerDiv.appendChild(createElement('h2', { class: 'text-2xl font-semibold text-gray-800', textContent: `${title}` }));
                if (itemType !== 'quotations' && itemType !== 'invoices' && itemType !== 'purchaseOrders') { // For simple CRUD
                    const addButton = createElement('button', { class: 'btn btn-primary', textContent: `Add New ${title.slice(0, -1)}` });
                    addButton.innerHTML = `<i data-feather="plus" class="mr-2 h-4 w-4"></i> Add New ${title.slice(0, -1)}`;
                    addButton.addEventListener('click', () => this.openItemForm(itemType, 'add'));
                    headerDiv.appendChild(addButton);
                } else { // For complex items like invoices/quotations
                     const createButton = createElement('button', { class: 'btn btn-primary', textContent: `Create ${title.slice(0, -1)}` });
                     createButton.innerHTML = `<i data-feather="plus" class="mr-2 h-4 w-4"></i> Create ${title.slice(0, -1)}`;
                     createButton.addEventListener('click', () => this.openCreateDocumentForm(itemType));
                     headerDiv.appendChild(createButton);
                }


                container.appendChild(headerDiv);

                if (!items || items.length === 0) {
                    container.appendChild(createElement('p', { class: 'text-gray-500 italic', textContent: `No ${itemType} found.` }));
                    this.els.pageContentContainer.appendChild(container);
                    feather.replace();
                    return;
                }

                const tableContainer = createElement('div', { class: 'bg-white shadow-md rounded-lg overflow-x-auto' });
                const table = createElement('table', { class: 'table w-full' });
                const thead = createElement('thead');
                const trHead = createElement('tr');
                headers.forEach(header => trHead.appendChild(createElement('th', { textContent: header })));
                trHead.appendChild(createElement('th', { class: 'text-right', textContent: 'Actions' }));
                thead.appendChild(trHead);
                table.appendChild(thead);

                const tbody = createElement('tbody');
                items.forEach(item => {
                    const tr = createElement('tr', { class: 'hover' });
                    itemKeys.forEach(key => {
                        let value = item[key];
                        if (key === 'balance' || key === 'price' || key === 'total') {
                            value = `$${parseFloat(value).toFixed(2)}`;
                        }
                        if (key === 'status') {
                           value = this.getStatusBadge(value);
                           const td = createElement('td');
                           td.appendChild(value);
                           tr.appendChild(td);
                        } else {
                           tr.appendChild(createElement('td', { textContent: value }));
                        }
                    });
                    
                    const actionsTd = createElement('td', { class: 'text-right space-x-2' });
                    if (customActionsRenderer) {
                        customActionsRenderer(item, actionsTd);
                    } else {
                        const viewButton = createElement('button', { class: 'btn btn-xs btn-ghost text-blue-600', title: 'View' });
                        viewButton.innerHTML = `<i data-feather="eye"></i>`;
                        // viewButton.addEventListener('click', () => this.viewItem(itemType, item.id));
                        actionsTd.appendChild(viewButton);

                        const editButton = createElement('button', { class: 'btn btn-xs btn-ghost text-yellow-600', title: 'Edit' });
                        editButton.innerHTML = `<i data-feather="edit"></i>`;
                        editButton.addEventListener('click', () => this.openItemForm(itemType, 'edit', item.id));
                        actionsTd.appendChild(editButton);
                        
                        const deleteButton = createElement('button', { class: 'btn btn-xs btn-ghost text-red-600', title: 'Delete' });
                        deleteButton.innerHTML = `<i data-feather="trash-2"></i>`;
                        deleteButton.addEventListener('click', () => this.confirmDeleteItem(itemType, item.id, item.name || item.id));
                        actionsTd.appendChild(deleteButton);
                    }
                    tr.appendChild(actionsTd);
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                tableContainer.appendChild(table);
                container.appendChild(tableContainer);
                this.els.pageContentContainer.appendChild(container);
            },

            getStatusBadge(status) {

            openItemForm(itemType, mode, itemId = null) {

                this.els.itemForm.innerHTML = ''; // Clear previous form fields

                let fields = [];

                    currentItem = this.state[itemType].find(item => item.id === itemId);

                switch (itemType) {
                    case 'clients':
                        fields = [

                            { name: 'email', label: 'Email', type: 'email', required: true },
                            { name: 'phone', label: 'Phone', type: 'tel' },
                            { name: 'address', label: 'Address', type: 'textarea' }
                        ];
                        break;
                    case 'products':
                        fields = [
                            { name: 'name', label: 'Name', type: 'text', required: true },
                            { name: 'description', label: 'Description', type: 'textarea' },
                            { name: 'price', label: 'Price', type: 'number', step: '0.01', required: true },
                            { name: 'type', label: 'Type', type: 'select', options: [{value:'Product', text:'Product'}, {value:'Service', text:'Service'}], required: true },
                            { name: 'stock', label: 'Stock Quantity (if Product)', type: 'number', step: '1' }
                        ];
                        break;
                    case 'users':
                         fields = [
                            { name: 'name', label: 'Name', type: 'text', required: true },
                            { name: 'email', label: 'Email', type: 'email', required: true },
                            { name: 'role', label: 'Role', type: 'select', options: [{value:'Administrator', text:'Administrator'}, {value:'Sales', text:'Sales'}, {value:'Staff', text:'Staff'}], required: true },
                            // Password field would normally be here, handled separately for security
                        ];

                }

                fields.forEach(field => {

                    formGroup.appendChild(label);

                    if (field.type === 'textarea') {

                    } else if (field.type === 'select') {
                        input = createElement('select', { id: `form-${field.name}`, name: field.name, class: 'select select-bordered', required: field.required });
                        field.options.forEach(opt => {
                            input.appendChild(createElement('option', { value: opt.value, textContent: opt.text }));
                        });
                    } else {
                        input = createElement('input', { id: `form-${field.name}`, name: field.name, type: field.type, class: 'input input-bordered', required: field.required });
                        if (field.step) input.step = field.step;
                    }
                    
                    if (currentItem && currentItem[field.name] !== undefined) {
                        input.value = currentItem[field.name];
                    }
                    formGroup.appendChild(input);
                    this.els.itemForm.appendChild(formGroup);
                });

            handleItemFormSave() {
                const { type, mode, itemId } = this.state.currentForm;
                const formData = new FormData(this.els.itemForm);
                const newItemData = {};
                let isValid = true;
                this.els.itemForm.querySelectorAll('[required]').forEach(el => {
                    if (!el.value) isValid = false;
                });

                if (!isValid) {
                    alert('Please fill all required fields.'); // Simple validation
                    return;
                }

                for (let [key, value] of formData.entries()) {
                    const inputElement = this.els.itemForm.elements[key];
                    if (inputElement.type === 'number') {
                         newItemData[key] = parseFloat(value) || null; // Allow empty for non-required numbers
                    } else {
                        newItemData[key] = value;
                    }
                }

                if (mode === 'add') {
                    newItemData.id = this.generateId(type);
                    if (type === 'clients') newItemData.balance = 0; // Default balance
                    if (type === 'users') newItemData.dateAdded = new Date().toISOString().split('T')[0];

                    this.state[type].push(newItemData);
                } else { // edit mode
                    const itemIndex = this.state[type].findIndex(item => item.id === itemId);
                    if (itemIndex > -1) {
                        this.state[type][itemIndex] = { ...this.state[type][itemIndex], ...newItemData };
                    }
                }
                this.els.itemFormModal.close();
                this.renderPageContent(type); // Re-render the list
            },

            generateId(type) {
                const idKey = type.endsWith('s') ? type.slice(0, -1) : type; // e.g. clients -> client
                if (this.state.nextIds[idKey]) {
                    return this.state.nextIds[idKey]++;
                }
                // Fallback for quotation, invoice, PO IDs which are strings
                const prefix = type.substring(0,1).toUpperCase() + (type.includes('purchase') ? 'PO' : type.substring(1,3).toUpperCase());
                return `${prefix}-${new Date().getFullYear()}-${String(this.state.nextIds[idKey]++).padStart(3, '0')}`;
            },
            
            confirmDeleteItem(itemType, itemId, itemName) {
                this.state.confirmationCallback = () => this.deleteItem(itemType, itemId);
                this.els.confirmationModalTitle.textContent = `Delete ${itemType.slice(0,-1)}`;
                this.els.confirmationModalMessage.textContent = `Are you sure you want to delete ${itemName}? This action cannot be undone.`;
                this.els.confirmationModal.showModal();
            },
            
            deleteItem(itemType, itemId) {
                this.state[itemType] = this.state[itemType].filter(item => item.id !== itemId);
                this.renderPageContent(itemType);
            },

            handleConfirmation() {
                if (this.state.confirmationCallback) {
                    this.state.confirmationCallback();
                    this.state.confirmationCallback = null; // Reset callback
                }
                this.els.confirmationModal.close();
            },

            addDocumentItemRow(docType, container, itemData = null) {
                const itemRow = createElement('div', { class: 'grid grid-cols-12 gap-x-3 gap-y-2 items-end border p-3 rounded-md bg-gray-50' });
                const productOptions = this.state.products.map(p => ({ value: p.id, text: `${p.name} ($${p.price.toFixed(2)})` }));

                    itemRow.innerHTML = '<p class="text-red-500 col-span-12">Please add products/services first.</p>';
                    container.appendChild(itemRow);
                    return;
                }

                // Product/Service Select (col-span-5)
                const productSelectGroup = this.createFormGroupNoLabel(`${docType}ItemProduct`, 'select', productOptions, true, itemData?.productId, 'product-select');
                productSelectGroup.classList.add('col-span-12', 'md:col-span-5');
                itemRow.appendChild(productSelectGroup);

                // Quantity (col-span-2)
                const quantityInputGroup = this.createFormGroupNoLabel(`${docType}ItemQuantity`, 'number', [], true, itemData?.quantity || 1, 'item-quantity');
                quantityInputGroup.querySelector('input').min = 1;
                quantityInputGroup.classList.add('col-span-4', 'md:col-span-2');
                itemRow.appendChild(quantityInputGroup);

                // Unit Price (col-span-2)

                unitPriceInputGroup.querySelector('input').step = "0.01";
                unitPriceInputGroup.querySelector('input').readOnly = true; // Auto-filled based on product

                itemRow.appendChild(unitPriceInputGroup);
                
                // Total (col-span-2)
                const itemTotalDiv = createElement('div', { class: 'col-span-3 md:col-span-2 flex items-center justify-end' });
                const itemTotalSpan = createElement('span', { class: 'font-medium text-gray-700 item-total', textContent: '$0.00' });
                itemTotalDiv.appendChild(itemTotalSpan);
                itemRow.appendChild(itemTotalDiv);

                // Remove Button (col-span-1)
                const removeButtonDiv = createElement('div', { class: 'col-span-1 flex items-center justify-end' });

                removeButton.innerHTML = `<i data-feather="trash-2"></i>`;

                    itemRow.remove();
                    this.updateDocumentTotal(docType);
                });

                productSelect.addEventListener('change', () => {

                    this.updateDocumentItemTotal(itemRow);

                });
                
                // Trigger change on product select to populate initial price if itemData is provided
                if (itemData && itemData.productId) {
                     productSelect.value = itemData.productId;
                     productSelect.dispatchEvent(new Event('change')); // Triggers price update
                     quantityInput.value = itemData.quantity;
                     quantityInput.dispatchEvent(new Event('input')); // Triggers total update

            updateDocumentItemTotal(itemRow) {
                const quantity = parseFloat(itemRow.querySelector('.item-quantity').value) || 0;
                const unitPrice = parseFloat(itemRow.querySelector('.item-unit-price').value) || 0;
                const total = quantity * unitPrice;
                itemRow.querySelector('.item-total').textContent = `$${total.toFixed(2)}`;
            },

            updateDocumentTotal(docType) {
                let grandTotal = 0;
                document.querySelectorAll(`#${docType}ItemsContainer .grid`).forEach(itemRow => {
                    const quantity = parseFloat(itemRow.querySelector('.item-quantity')?.value) || 0;
                    const unitPrice = parseFloat(itemRow.querySelector('.item-unit-price')?.value) || 0;
                    grandTotal += quantity * unitPrice;
                });
                document.getElementById(`${docType}TotalDisplay`).textContent = `$${grandTotal.toFixed(2)}`;
            },

            createFormGroup(id, labelText, type, options = [], required = false, defaultValue = '', className = '') {
                const group = createElement('div', { class: `form-control ${className}` });
                const label = createElement('label', { class: 'label' }, [createElement('span', { class: 'label-text', textContent: labelText })]);
                group.appendChild(label);
                let input;
                if (type === 'select') {
                    input = createElement('select', { id, name: id, class: 'select select-bordered w-full', required });
                    options.forEach(opt => input.appendChild(createElement('option', { value: opt.value, textContent: opt.text })));
                } else if (type === 'textarea') {
                    input = createElement('textarea', { id, name: id, class: 'textarea textarea-bordered h-24 w-full', required });
                } else {
                    input = createElement('input', { type, id, name: id, class: 'input input-bordered w-full', required });
                }
                if (defaultValue) input.value = defaultValue;
                group.appendChild(input);
                return group;
            },

            createFormGroupNoLabel(idPrefix, type, options = [], required = false, defaultValue = '', className = '') {
                // Used for item rows where labels are implicit or column headers
                const group = createElement('div', { class: `form-control ${className}` });
                let input;
                 // Ensure unique IDs for inputs in item rows by appending a timestamp or counter if needed, though name attribute will be used by FormData
                const name = `${idPrefix}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`; 

                if (type === 'select') {
                    input = createElement('select', { name: idPrefix, class: `select select-bordered w-full ${className}`, required });
                    options.forEach(opt => input.appendChild(createElement('option', { value: opt.value, textContent: opt.text })));
                } else {
                    input = createElement('input', { type, name: idPrefix, class: `input input-bordered w-full ${className}`, required });
                }
                if (defaultValue) input.value = defaultValue;
                group.appendChild(input);
                return group;
            },

            handleSaveDocument(docType, formElement) {

                });

                // Extract main fields
                if (docType === 'purchaseOrders') {
                     docData.supplierName = formData.get(`${docType}ClientOrSupplier`); // This assumes supplier ID is name for simplicity
                } else {
                    docData.clientId = parseInt(formData.get(`${docType}ClientOrSupplier`));
                    const client = this.state.clients.find(c => c.id === docData.clientId);
                    docData.clientName = client ? client.name : 'N/A';
                }
                docData.date = formData.get(`${docType}Date`);
                if (docType === 'quotations') docData.expiryDate = formData.get(`${docType}ExpiryDate`);
                if (docType === 'invoices') docData.dueDate = formData.get(`${docType}DueDate`);
                if (docType === 'purchaseOrders') docData.expectedDelivery = formData.get(`${docType}ExpectedDelivery`);
                docData.notes = formData.get(`${docType}Notes`);

                // Extract items
                const itemRows = formElement.querySelectorAll(`#${docType}ItemsContainer .grid`);
                itemRows.forEach(row => {
                    const productId = parseInt(row.querySelector('.product-select')?.value);
                    const quantity = parseInt(row.querySelector('.item-quantity')?.value);
                    const unitPrice = parseFloat(row.querySelector('.item-unit-price')?.value);
                    if (productId && quantity > 0 && unitPrice >= 0) {
                         docData.items.push({ productId, quantity, unitPrice });
                    }
                });

                if (docData.items.length === 0) {
                    alert('Please add at least one item.');
                    return;
                }

                docData.total = docData.items.reduce((sum, item) => sum + (item.quantity * item.unitPrice), 0);
                docData.status = (docType === 'quotations' || docType === 'purchaseOrders') ? 'Draft' : 'Draft'; // Default status
                if (docType === 'invoices') docData.paid = 0;


                const { mode, itemId } = this.state.currentForm;
                if (mode === 'add') {
                    docData.id = this.generateId(docType);
                    this.state[docType].push(docData);
                } else { // edit mode
                    const itemIndex = this.state[docType].findIndex(item => item.id === itemId);
                    if (itemIndex > -1) {
                        // Preserve original ID and merge other properties
                        this.state[docType][itemIndex] = { ...this.state[docType][itemIndex], ...docData, id: itemId };
                    }
                }
                
                this.navigateTo(docType); // Go back to the list view
            },

            populateDocumentForm(docType, formElement, docData) {
                // Populate basic fields
                formElement.elements[`${docType}ClientOrSupplier`].value = docType === 'purchaseOrders' ? docData.supplierName : docData.clientId;
                formElement.elements[`${docType}Date`].value = docData.date;
                if (docType === 'quotations') formElement.elements[`${docType}ExpiryDate`].value = docData.expiryDate;
                if (docType === 'invoices') formElement.elements[`${docType}DueDate`].value = docData.dueDate;
                if (docType === 'purchaseOrders') formElement.elements[`${docType}ExpectedDelivery`].value = docData.expectedDelivery;
                if (formElement.elements[`${docType}Notes`]) formElement.elements[`${docType}Notes`].value = docData.notes || '';

                // Populate items
                const itemsContainer = formElement.querySelector(`#${docType}ItemsContainer`);
                itemsContainer.innerHTML = ''; // Clear initial empty row
                docData.items.forEach(item => {
                    this.addDocumentItemRow(docType, itemsContainer, item);
                });
                this.updateDocumentTotal(docType); // Recalculate total display
            }

        };

        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
