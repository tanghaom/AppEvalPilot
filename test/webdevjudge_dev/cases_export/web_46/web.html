<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Room Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; /* slate-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; /* slate-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; /* slate-500 */
        }
        /* Basic styles for focus states for accessibility */
        *:focus-visible {
            outline: 2px solid #2dd4bf; /* teal-400 */
            outline-offset: 2px;
        }
        .sidebar-link {
            @apply flex items-center space-x-3 px-3 py-2 rounded-md text-slate-300 hover:bg-slate-700 hover:text-white transition-colors;
        }
        .sidebar-link.active {
            @apply bg-teal-600 text-white;
        }
        .btn {
            @apply px-4 py-2 rounded-md font-semibold transition-colors shadow-sm;
        }
        .btn-primary {
            @apply bg-teal-600 text-white hover:bg-teal-700 disabled:opacity-50;
        }
        .btn-secondary {
            @apply bg-slate-600 text-slate-100 hover:bg-slate-500 disabled:opacity-50;
        }
        .btn-danger {
            @apply bg-red-600 text-white hover:bg-red-700 disabled:opacity-50;
        }
        .input-field {
            @apply bg-slate-700 border border-slate-600 text-slate-100 sm:text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block w-full p-2.5;
        }
        .label-text {
            @apply block mb-2 text-sm font-medium text-slate-300;
        }
        .card {
            @apply bg-slate-800 p-6 rounded-lg shadow-lg;
        }
        .table-header {
            @apply px-4 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider;
        }
        .table-cell {
            @apply px-4 py-4 whitespace-nowrap text-sm text-slate-200;
        }
        .table-row {
            @apply border-b border-slate-700 hover:bg-slate-700/50;
        }
        /* For placeholder image div */
        .placeholder-avatar {
            @apply bg-gray-700 border-2 border-dashed border-gray-500 rounded-full w-10 h-10 flex items-center justify-center text-gray-400 text-xs;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <nav id="sidebar" class="w-64 bg-slate-800 p-4 space-y-2 flex-shrink-0 overflow-y-auto">
            <div class="text-2xl font-bold text-teal-400 mb-6 px-2 app-name-text">Poker Room Manager</div>
            <!-- Nav Links will be injected here by JS -->
        </nav>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header id="main-header" class="bg-slate-800/80 backdrop-blur-md p-4 shadow-md flex justify-between items-center flex-shrink-0">
                <h1 id="current-view-title" class="text-xl font-semibold text-slate-100"></h1>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <select id="language-switcher" class="input-field !py-1.5 !px-3 !w-auto appearance-none">
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                    <div class="w-8 h-8 bg-teal-500 rounded-full flex items-center justify-center text-sm font-semibold">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div id="content-area" class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
                <!-- Dynamic content based on currentView -->
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-75 hidden items-center justify-center z-50 p-4">
        <div id="modal-content-wrapper" class="bg-slate-800 p-6 rounded-lg shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-xl font-semibold"></h2>
                <button id="modal-close-button" class="text-slate-400 hover:text-slate-100">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="modal-body">
                <!-- Modal content will be injected here -->
            </div>
        </div>
    </div>

        const _ = (key) => i18n[appState.language][key] || key;

        // --- RENDER FUNCTIONS ---
        function renderApp() {
            renderSidebar();
            renderHeader();
            renderContent();
            renderModal(); // Ensure modal is rendered correctly if open
            document.documentElement.lang = appState.language; // Set lang attribute on HTML element
            document.querySelector('.app-name-text').textContent = _('appName');
        }
        
        function renderSidebar() {
            const sidebarEl = document.getElementById('sidebar');
            const navItems = [
                { id: 'dashboard', icon: ICONS.dashboard, labelKey: 'dashboard' },
                { id: 'players', icon: ICONS.players, labelKey: 'players' },
                { id: 'games', icon: ICONS.games, labelKey: 'games' },
                { id: 'reports', icon: ICONS.reports, labelKey: 'reports' },
                { id: 'settings', icon: ICONS.settings, labelKey: 'settings' },
            ];
            sidebarEl.innerHTML = `
                <div class="text-2xl font-bold text-teal-400 mb-6 px-2 app-name-text">${_('appName')}</div>
                ${navItems.map(item => `
                    <a href="#" data-view="${item.id}" class="sidebar-link ${appState.currentView === item.id ? 'active' : ''}">
                        ${item.icon}
                        <span>${_(item.labelKey)}</span>
                    </a>
                `).join('')}
            `;
        }

        function renderHeader() {
            document.getElementById('current-view-title').textContent = _(appState.currentView);
            document.getElementById('language-switcher').value = appState.language;
        }

        function renderContent() {
            const contentArea = document.getElementById('content-area');
            contentArea.scrollTop = 0; // Reset scroll on view change
            if (appState.currentView === 'dashboard') renderDashboard(contentArea);
            else if (appState.currentView === 'players') renderPlayersView(contentArea);
            else if (appState.currentView === 'games') renderGamesView(contentArea);
            else if (appState.currentView === 'reports') renderReportsView(contentArea);
            else if (appState.currentView === 'settings') renderSettingsView(contentArea);
            else contentArea.innerHTML = `<p>${_('noDataAvailable')}</p>`;
        }

        // --- DASHBOARD ---
        let dashboardChart = null;
        function renderDashboard(container) {
            const totalPlayers = appState.players.length;
            const activeGames = appState.games.filter(g => g.status === 'Active').length;
            // Mock total buy-ins
            const totalBuyInsToday = appState.games.reduce((sum, game) => sum + (parseInt(String(game.buyIn).replace(/[^0-9]/g, '')) || 0) * (game.registeredPlayers || game.currentPlayers || 0) * 0.1, 0).toFixed(0) ;


            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
                    <div class="card">
                        <h3 class="text-slate-400 text-sm font-medium">${_('totalPlayers')}</h3>
                        <p class="text-3xl font-semibold text-slate-100">${totalPlayers}</p>
                    </div>
                    <div class="card">
                        <h3 class="text-slate-400 text-sm font-medium">${_('activeGames')}</h3>
                        <p class="text-3xl font-semibold text-slate-100">${activeGames}</p>

        // --- MODAL HANDLING ---
        function openModal(titleKey, contentKey, data = null) {
            appState.modal = { isOpen: true, titleKey, contentKey, data };
            renderModal();
        }

        function closeModal() {
            appState.modal = { isOpen: false, titleKey: '', contentKey: '', data: null };
            renderModal();
        }
        
        function renderModal() {
            const modalBackdrop = document.getElementById('modal-backdrop');
            const modalTitleEl = document.getElementById('modal-title');
            const modalBodyEl = document.getElementById('modal-body');

            if (appState.modal.isOpen) {
                modalTitleEl.textContent = _(appState.modal.titleKey);
                modalBodyEl.innerHTML = getModalContent(appState.modal.contentKey, appState.modal.data);
                modalBackdrop.classList.remove('hidden');
                modalBackdrop.classList.add('flex');
                attachModalEventListeners(); // Attach listeners specific to current modal content
            } else {
                modalBackdrop.classList.add('hidden');
                modalBackdrop.classList.remove('flex');
                modalBodyEl.innerHTML = ''; // Clear content
            }
        }

        function getModalContent(contentKey, data) {
            if (contentKey === 'playerForm') return getPlayerFormHTML(data);
            if (contentKey === 'gameForm') return getGameFormHTML(data);
            if (contentKey === 'playerDetailsView') return getPlayerDetailsHTML(data);
            if (contentKey === 'confirmDeletePlayer') return getConfirmDeleteHTML('player', data.id);
            if (contentKey === 'confirmDeleteGame') return getConfirmDeleteHTML('game', data.id);
            return `<p>${_('noDataAvailable')}</p>`;
        }

                        </div>
                    </div>
                    <div class="flex justify-end space-x-3 pt-2">
                        <button type="button" id="modal-cancel-btn" class="btn btn-secondary">${_('cancel')}</button>
                        <button type="submit" class="btn btn-primary">${_('save')}</button>
                    </div>
                </form>
            `;
        }

        function attachModalEventListeners() {
            const cancelButton = document.getElementById('modal-cancel-btn');
            if (cancelButton) cancelButton.addEventListener('click', closeModal);
            
            const closeDetailButton = document.getElementById('modal-close-detail-btn');
            if (closeDetailButton) closeDetailButton.addEventListener('click', closeModal);

            const playerForm = document.getElementById('player-form');
            if (playerForm) playerForm.addEventListener('submit', handlePlayerFormSubmit);
            
            const gameForm = document.getElementById('game-form');
            if (gameForm) {
                gameForm.addEventListener('submit', handleGameFormSubmit);
                const gameTypeSelect = gameForm.querySelector('#gameType');
                if(gameTypeSelect) gameTypeSelect.addEventListener('change', toggleGameFormFields);
                toggleGameFormFields(); // Initial call to set correct fields visibility
            }
            
            const confirmDeleteBtn = document.getElementById('modal-confirm-delete-btn');
            if (confirmDeleteBtn) confirmDeleteBtn.addEventListener('click', handleConfirmDelete);
        }
        
        function toggleGameFormFields() {
            const gameType = document.getElementById('gameType')?.value;
            const tournamentFields = document.getElementById('tournament-fields');
            const cashGameFields = document.getElementById('cash-game-fields');
            if (tournamentFields && cashGameFields) {
                if (gameType === 'Tournament') {
                    tournamentFields.classList.remove('hidden');
                    cashGameFields.classList.add('hidden');
                } else if (gameType === 'Cash Game') {
                    tournamentFields.classList.add('hidden');
                    cashGameFields.classList.remove('hidden');
                }
            }
        }


        // --- FORM SUBMISSION HANDLERS ---
        function handlePlayerFormSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const playerId = form.playerId.value ? parseInt(form.playerId.value) : null;
            const playerData = {
                id: playerId || Date.now(),
                name: form.playerName.value,
                email: form.playerEmail.value,
                phone: form.playerPhone.value,
                balance: parseFloat(form.playerBalance.value),
                credits: parseInt(form.playerCredits.value),
                joinDate: playerId ? appState.players.find(p=>p.id === playerId).joinDate : new Date().toISOString().split('T')[0],
                gamesPlayed: playerId ? appState.players.find(p=>p.id === playerId).gamesPlayed : 0,
                totalWinnings: playerId ? appState.players.find(p=>p.id === playerId).totalWinnings : 0,
            };

            if (playerId) { // Edit
                appState.players = appState.players.map(p => p.id === playerId ? playerData : p);
            } else { // Create
                appState.players.push(playerData);
            }
            closeModal();
            renderApp();
        }

        function handleGameFormSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const gameId = form.gameId.value ? parseInt(form.gameId.value) : null;
            const gameType = form.gameType.value;
            
            let gameData = {
                id: gameId || Date.now(),
                name: form.gameName.value,
                type: gameType,
                status: gameId ? appState.games.find(g=>g.id === gameId).status : (gameType === 'Tournament' ? 'Upcoming' : 'Active'), // Default status
            };

            if (gameType === 'Tournament') {
                gameData = {
                    ...gameData,
                    date: form.gameDate.value,
                    time: form.gameTime.value,
                    buyIn: parseFloat(form.gameBuyInTournament.value),
                    blinds: form.gameBlindsTournament.value,
                    roundDuration: parseInt(form.roundDuration.value),
                    maxPlayers: parseInt(form.maxPlayers.value),
                    registeredPlayers: gameId ? appState.games.find(g=>g.id === gameId).registeredPlayers : 0,
                };
            } else { // Cash Game
                gameData = {
                    ...gameData,
                    date: 'Ongoing', // Cash games are typically ongoing
                    time: '',
                    buyIn: form.gameBuyInCash.value,
                    blinds: form.gameBlindsCash.value,
                    currentPlayers: gameId ? appState.games.find(g=>g.id === gameId).currentPlayers : 0,
                };
            }

            if (gameId) { // Edit
                appState.games = appState.games.map(g => g.id === gameId ? {...appState.games.find(x => x.id === gameId), ...gameData} : g);
            } else { // Create
                appState.games.push(gameData);
            }
            closeModal();
            renderApp();
        }
        
        function handleConfirmDelete(event) {
            const type = event.currentTarget.dataset.type;
            const id = parseInt(event.currentTarget.dataset.id);
            if (type === 'player') {
                appState.players = appState.players.filter(p => p.id !== id);
            } else if (type === 'game') {
                appState.games = appState.games.filter(g => g.id !== id);
            }
            closeModal();
            renderApp();
        }

        // --- EVENT LISTENERS ---
        document.getElementById('sidebar').addEventListener('click', (e) => {
            const link = e.target.closest('[data-view]');
            if (link) {
                e.preventDefault();
                appState.currentView = link.dataset.view;
                renderApp();
            }
        });
        
        document.getElementById('language-switcher').addEventListener('change', (e) => {
            appState.language = e.target.value;
            renderApp();
        });

        document.getElementById('modal-close-button').addEventListener('click', closeModal);
        // Close modal on backdrop click
        document.getElementById('modal-backdrop').addEventListener('click', (e) => {
            if (e.target.id === 'modal-backdrop') {
                closeModal();
            }
        });
        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape" && appState.modal.isOpen) {
                closeModal();
            }
        });

        // --- INITIALIZATION ---
        function init() {
            renderApp();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
