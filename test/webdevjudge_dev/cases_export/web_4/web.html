<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.js"></script>
    <style>
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* slate-300 */
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569; /* slate-600 */
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; /* slate-400 */
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #64748b; /* slate-500 */
        }

        /* FullCalendar custom styling for dark mode */
        .dark .fc {
            color: #e2e8f0; /* slate-200 */
        }
        .dark .fc .fc-col-header-cell-cushion,
        .dark .fc .fc-daygrid-day-number,
        .dark .fc .fc-list-day-text, 
        .dark .fc .fc-list-day-side-text {
            color: #cbd5e1; /* slate-300 */
        }
        .dark .fc .fc-border {
            border-color: #334155; /* slate-700 */
        }
        .dark .fc th {
            border-color: #334155; /* slate-700 */
        }
        .dark .fc .fc-daygrid-day:not(.fc-day-today) {
            background-color: #1e293b; /* slate-800 */
        }
         .dark .fc .fc-day-today {
            background-color: #334155 !important; /* slate-700 with important to override FC */
        }
        .dark .fc-event {
            background-color: #4f46e5; /* indigo-600 */
            border-color: #4338ca; /* indigo-700 */
        }
        .dark .fc-list-event-dot {
            border-color: #4f46e5; /* indigo-600 */
        }
        .dark .fc-button-primary {
            background-color: #4f46e5; /* indigo-600 */
            border-color: #4f46e5;
            color: white;
        }
        .dark .fc-button-primary:hover {
            background-color: #4338ca; /* indigo-700 */
            border-color: #4338ca;
        }
        .dark .fc-button-primary:disabled {
            background-color: #3730a3; /* indigo-800 */
            border-color: #3730a3;
        }
        .dark .fc-button-active {
            background-color: #3730a3 !important; /* indigo-800 */
            border-color: #3730a3 !important;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Light mode (default or explicitly defined)
                        'primary-light': '#4f46e5', // indigo-600
                        'secondary-light': '#e2e8f0', // slate-200
                        'background-light': '#f1f5f9', // slate-100
                        'card-light': '#ffffff', // white
                        'text-light': '#1e293b', // slate-800
                        'muted-light': '#64748b', // slate-500
                        'border-light': '#cbd5e1', // slate-300

                        // Dark mode
                        'primary-dark': '#6366f1', // indigo-500
                        'secondary-dark': '#334155', // slate-700
                        'background-dark': '#0f172a', // slate-900
                        'card-dark': '#1e293b', // slate-800
                        'text-dark': '#e2e8f0', // slate-200
                        'muted-dark': '#94a3b8', // slate-400
                        'border-dark': '#334155', // slate-700
                    },
                    height: {
                        'kanban-col': 'calc(100vh - 10rem)', // Example for dynamic height
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark transition-colors duration-300 font-sans antialiased">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-card-light dark:bg-card-dark shadow-md p-4 sticky top-0 z-50">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold text-primary-light dark:text-primary-dark">My To-Do App</h1>
                <div class="flex items-center space-x-4">
                    <!-- View Switcher -->
                    <div class="flex items-center space-x-1 p-1 bg-secondary-light dark:bg-secondary-dark rounded-lg">
                        <button id="view-list-btn" class="px-3 py-1.5 rounded-md text-sm font-medium" aria-label="List View">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
                        </button>
                        <button id="view-kanban-btn" class="px-3 py-1.5 rounded-md text-sm font-medium" aria-label="Kanban View">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z" /></svg>
                        </button>
                        <button id="view-calendar-btn" class="px-3 py-1.5 rounded-md text-sm font-medium" aria-label="Calendar View">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-3.75h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" /></svg>
                        </button>
                    </div>
                    <!-- Add Task Button -->
                    <button id="add-task-btn" class="bg-primary-light dark:bg-primary-dark hover:bg-indigo-700 dark:hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg flex items-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                        <span>Add Task</span>
                    </button>
                    <!-- Theme Toggle -->
                    <button id="theme-toggle-btn" class="p-2 rounded-full hover:bg-secondary-light dark:hover:bg-secondary-dark" aria-label="Toggle theme">
                        <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 hidden"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-6.364-.386 1.591-1.591M3 12h2.25m.386-6.364 1.591 1.591M12 12a2.25 2.25 0 0 0-2.25 2.25c0 1.31.376 2.508 1.004 3.434C11.385 18.404 11 19.613 11 20.875c0 .414.336.75.75.75h.5c.414 0 .75-.336.75-.75c0-1.262-.385-2.471-1.004-3.434C13.874 16.758 14.25 15.56 14.25 14.25A2.25 2.25 0 0 0 12 12Z" /></svg>
                        <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 hidden"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" /></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="container mx-auto p-4 flex-grow">
            <div id="list-view" class="hidden"></div>
            <div id="kanban-view" class="hidden"></div>
            <div id="calendar-view" class="hidden">
                <div id="calendar" class="bg-card-light dark:bg-card-dark p-4 rounded-lg shadow"></div>
            </div>
        </main>

        <!-- Task Modal -->
        <div id="task-modal" class="fixed inset-0 bg-black bg-opacity-50 dark:bg-opacity-70 flex items-center justify-center p-4 hidden z-[100]">
            <div class="bg-card-light dark:bg-card-dark p-6 rounded-lg shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
                <h2 id="modal-title" class="text-xl font-semibold mb-4 text-text-light dark:text-text-dark">Add New Task</h2>
                <form id="task-form">
                    <input type="hidden" id="task-id">
                    <div class="mb-4">
                        <label for="task-title" class="block text-sm font-medium text-muted-light dark:text-muted-dark mb-1">Title</label>
                        <input type="text" id="task-title" class="w-full p-2 border border-border-light dark:border-border-dark rounded-md bg-card-light dark:bg-slate-700 focus:ring-primary-light dark:focus:ring-primary-dark focus:border-primary-light dark:focus:border-primary-dark" required>
                    </div>
                    <div class="mb-4">
                        <label for="task-description" class="block text-sm font-medium text-muted-light dark:text-muted-dark mb-1">Description</label>
                        <textarea id="task-description" rows="3" class="w-full p-2 border border-border-light dark:border-border-dark rounded-md bg-card-light dark:bg-slate-700 focus:ring-primary-light dark:focus:ring-primary-dark focus:border-primary-light dark:focus:border-primary-dark"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="task-start-date" class="block text-sm font-medium text-muted-light dark:text-muted-dark mb-1">Start Date</label>
                            <input type="date" id="task-start-date" class="w-full p-2 border border-border-light dark:border-border-dark rounded-md bg-card-light dark:bg-slate-700 focus:ring-primary-light dark:focus:ring-primary-dark focus:border-primary-light dark:focus:border-primary-dark">
                        </div>
                        <div>
                            <label for="task-deadline" class="block text-sm font-medium text-muted-light dark:text-muted-dark mb-1">Deadline</label>
                            <input type="date" id="task-deadline" class="w-full p-2 border border-border-light dark:border-border-dark rounded-md bg-card-light dark:bg-slate-700 focus:ring-primary-light dark:focus:ring-primary-dark focus:border-primary-light dark:focus:border-primary-dark">
                        </div>
                    </div>
                     <div class="mb-4">
                        <label for="task-priority" class="block text-sm font-medium text-muted-light dark:text-muted-dark mb-1">Priority</label>
                        <select id="task-priority" class="w-full p-2 border border-border-light dark:border-border-dark rounded-md bg-card-light dark:bg-slate-700 focus:ring-primary-light dark:focus:ring-primary-dark focus:border-primary-light dark:focus:border-primary-dark">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-muted-light dark:text-muted-dark mb-1">Subtasks</label>
                        <div id="subtasks-container" class="space-y-2">
                            <!-- Subtasks will be added here -->
                        </div>
                        <button type="button" id="add-subtask-btn" class="mt-2 text-sm text-primary-light dark:text-primary-dark hover:underline">Add Subtask</button>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" id="cancel-task-btn" class="px-4 py-2 rounded-md text-sm font-medium bg-secondary-light dark:bg-secondary-dark text-text-light dark:text-text-dark hover:bg-slate-300 dark:hover:bg-slate-600">Cancel</button>
                        <button type="submit" class="px-4 py-2 rounded-md text-sm font-medium bg-primary-light dark:bg-primary-dark text-white hover:bg-indigo-700 dark:hover:bg-indigo-600">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // --- Constants and State ---
        const KANBAN_COLUMNS = {
            todo: 'To Do',
            inprogress: 'In Progress',
            done: 'Done'
        };

        let tasks = [];
        let currentView = 'list'; // 'list', 'kanban', 'calendar'
        let editingTaskId = null;
        let calendarInstance = null;

        // --- DOM Elements ---
        const appElement = document.getElementById('app');
        const listViewEl = document.getElementById('list-view');
        const kanbanViewEl = document.getElementById('kanban-view');
        const calendarViewEl = document.getElementById('calendar-view');
        const calendarEl = document.getElementById('calendar');
        
        const viewListBtn = document.getElementById('view-list-btn');
        const viewKanbanBtn = document.getElementById('view-kanban-btn');
        const viewCalendarBtn = document.getElementById('view-calendar-btn');
        const viewButtons = [viewListBtn, viewKanbanBtn, viewCalendarBtn];

        const addTaskBtn = document.getElementById('add-task-btn');
        const taskModal = document.getElementById('task-modal');
        const taskForm = document.getElementById('task-form');
        const modalTitle = document.getElementById('modal-title');
        const cancelTaskBtn = document.getElementById('cancel-task-btn');
        const subtasksContainer = document.getElementById('subtasks-container');
        const addSubtaskModalBtn = document.getElementById('add-subtask-btn');

        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIconLight = document.getElementById('theme-icon-light');
        const themeIconDark = document.getElementById('theme-icon-dark');

        // --- Utility Functions ---
        const generateId = () => crypto.randomUUID();

        const formatDate = (dateString) => {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            // Add time zone offset to display correctly as local date
            const userTimezoneOffset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() + userTimezoneOffset).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        };

        const getPriorityClass = (priority) => {
            switch (priority) {
                case 'high': return 'border-l-4 border-red-500';
                case 'medium': return 'border-l-4 border-orange-400';
                case 'low': return 'border-l-4 border-blue-500';
                default: return 'border-l-4 border-slate-300 dark:border-slate-600';
            }
        };
        
        // --- Theme Management ---
        const applyTheme = (theme) => {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                themeIconLight.classList.remove('hidden');
                themeIconDark.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                themeIconLight.classList.add('hidden');
                themeIconDark.classList.remove('hidden');
            }
            localStorage.setItem('todoAppTheme', theme);
            // If calendar is initialized, re-render to apply theme changes (FullCalendar might need this)
            if (calendarInstance) {
                // calendarInstance.render(); // Might not be enough, options might need to be re-set for some theming aspects
            }
        };

        themeToggleBtn.addEventListener('click', () => {
            const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(newTheme);
        });

        // --- Data Persistence (LocalStorage) ---
        const loadTasks = () => {
            const storedTasks = localStorage.getItem('todoAppTasks');
            if (storedTasks) {
                tasks = JSON.parse(storedTasks);
            } else {
                 // Default tasks if nothing in localStorage
                tasks = [
                    { id: generateId(), title: 'Initial Setup', description: 'Configure the app.', subtasks: [{id: generateId(), text: 'Learn Tailwind', completed: true}, {id: generateId(), text: 'Learn FullCalendar', completed: false}], startDate: '2024-07-28', deadline: '2024-07-29', status: 'inprogress', priority: 'high', createdAt: Date.now() },
                    { id: generateId(), title: 'Grocery Shopping', description: 'Buy weekly groceries.', subtasks: [], startDate: '2024-07-30', deadline: '2024-07-30', status: 'todo', priority: 'medium', createdAt: Date.now() }
                ];
            }
        };

        const saveTasks = () => {
            localStorage.setItem('todoAppTasks', JSON.stringify(tasks));
        };

        // --- Task Modal Management ---
        const openTaskModal = (task = null) => {
            editingTaskId = task ? task.id : null;
            modalTitle.textContent = task ? 'Edit Task' : 'Add New Task';
            taskForm.reset();
            subtasksContainer.innerHTML = ''; // Clear previous subtasks

            if (task) {
                document.getElementById('task-id').value = task.id;
                document.getElementById('task-title').value = task.title;
                document.getElementById('task-description').value = task.description || '';
                document.getElementById('task-start-date').value = task.startDate || '';
                document.getElementById('task-deadline').value = task.deadline || '';
                document.getElementById('task-priority').value = task.priority || 'medium';
                (task.subtasks || []).forEach(subtask => renderSubtaskInput(subtask));
            } else {
                document.getElementById('task-priority').value = 'medium'; // Default priority
            }
            taskModal.classList.remove('hidden');
        };

        const closeTaskModal = () => {
            taskModal.classList.add('hidden');
            editingTaskId = null;
        };

        const renderSubtaskInput = (subtask = { id: generateId(), text: '', completed: false }) => {
            const subtaskDiv = document.createElement('div');
            subtaskDiv.className = 'flex items-center space-x-2';
            subtaskDiv.innerHTML = `
                <input type="checkbox" data-subtask-id="${subtask.id}" class="form-checkbox h-5 w-5 text-primary-light dark:text-primary-dark rounded border-border-light dark:border-border-dark focus:ring-primary-light dark:focus:ring-primary-dark bg-card-light dark:bg-slate-700" ${subtask.completed ? 'checked' : ''}>
                <input type="text" value="${subtask.text}" class="flex-grow p-1.5 border border-border-light dark:border-border-dark rounded-md bg-card-light dark:bg-slate-700 text-sm" placeholder="Subtask description">
                <button type="button" class="text-red-500 hover:text-red-700 dark:hover:text-red-400 remove-subtask-btn" aria-label="Remove subtask">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12.56 0c.342.052.682.107 1.022.166m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg>
                </button>
            `;
            subtaskDiv.querySelector('.remove-subtask-btn').addEventListener('click', () => subtaskDiv.remove());
            subtasksContainer.appendChild(subtaskDiv);
        };

        addSubtaskModalBtn.addEventListener('click', () => renderSubtaskInput());
        addTaskBtn.addEventListener('click', () => openTaskModal());
        cancelTaskBtn.addEventListener('click', closeTaskModal);

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('task-title').value.trim();
            if (!title) {
                alert('Task title is required.');
                return;
            }

            const subtaskElements = subtasksContainer.querySelectorAll('.flex.items-center.space-x-2');
            const subtasks = Array.from(subtaskElements).map(div => {
                const input = div.querySelector('input[type="text"]');
                const checkbox = div.querySelector('input[type="checkbox"]');
                return {
                    id: checkbox.dataset.subtaskId || generateId(), // Keep existing ID or generate new
                    text: input.value.trim(),
                    completed: checkbox.checked
                };
            }).filter(st => st.text); // Filter out empty subtasks

            const taskData = {
                id: editingTaskId || generateId(),
                title: title,
                description: document.getElementById('task-description').value.trim(),
                startDate: document.getElementById('task-start-date').value,
                deadline: document.getElementById('task-deadline').value,
                priority: document.getElementById('task-priority').value,
                subtasks: subtasks,
                status: editingTaskId ? tasks.find(t => t.id === editingTaskId).status : 'todo', // Keep status if editing
                createdAt: editingTaskId ? tasks.find(t => t.id === editingTaskId).createdAt : Date.now()
            };

            if (editingTaskId) {
                tasks = tasks.map(task => task.id === editingTaskId ? { ...task, ...taskData } : task);
            } else {
                tasks.push(taskData);
            }
            
            saveTasks();
            renderApp();
            closeTaskModal();
        });

        // --- Task Actions (Delete, Toggle Subtask) ---
        const deleteTask = (taskId) => {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(task => task.id !== taskId);
                saveTasks();
                renderApp();
            }
        };

        const toggleSubtask = (taskId, subtaskId) => {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                const subtask = task.subtasks.find(st => st.id === subtaskId);
                if (subtask) {
                    subtask.completed = !subtask.completed;
                    saveTasks();
                    renderApp(); // Re-render the current view to reflect change
                }
            }
        };

        // --- Render Functions ---
        const renderListView = () => {
            listViewEl.innerHTML = '';
            if (tasks.length === 0) {
                listViewEl.innerHTML = `<p class="text-muted-light dark:text-muted-dark text-center py-8">No tasks yet. Add one!</p>`;
                return;
            }

            const taskList = document.createElement('div');
            taskList.className = 'space-y-4';

            tasks.sort((a,b) => (a.createdAt > b.createdAt) ? 1 : -1) // Sort by creation date
                 .forEach(task => {
                const taskCard = document.createElement('div');
                taskCard.className = `bg-card-light dark:bg-card-dark p-4 rounded-lg shadow-md ${getPriorityClass(task.priority)}`;
                
                const subtasksHtml = task.subtasks.length > 0 ? `
                    <div class="mt-3 pt-3 border-t border-border-light dark:border-border-dark">
                        <h4 class="text-xs font-semibold text-muted-light dark:text-muted-dark mb-1">SUBTASKS (${task.subtasks.filter(st => st.completed).length}/${task.subtasks.length})</h4>
                        <ul class="space-y-1 text-sm">
                            ${task.subtasks.map(st => `
                                <li class="flex items-center">
                                    <input type="checkbox" data-task-id="${task.id}" data-subtask-id="${st.id}" class="subtask-checkbox form-checkbox h-4 w-4 text-primary-light dark:text-primary-dark rounded border-border-light dark:border-border-dark focus:ring-primary-light dark:focus:ring-primary-dark bg-card-light dark:bg-slate-700 mr-2" ${st.completed ? 'checked' : ''}>
                                    <span class="${st.completed ? 'line-through text-muted-light dark:text-muted-dark' : ''}">${st.text}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                ` : '';

                taskCard.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-semibold text-text-light dark:text-text-dark">${task.title}</h3>
                            ${task.description ? `<p class="text-sm text-muted-light dark:text-muted-dark mt-1">${task.description}</p>` : ''}
                        </div>
                        <div class="flex space-x-2 flex-shrink-0 ml-2">
                            <button class="edit-task-btn p-1.5 text-muted-light dark:text-muted-dark hover:text-primary-light dark:hover:text-primary-dark" data-task-id="${task.id}" aria-label="Edit Task">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" /></svg>
                            </button>
                            <button class="delete-task-btn p-1.5 text-muted-light dark:text-muted-dark hover:text-red-500 dark:hover:text-red-400" data-task-id="${task.id}" aria-label="Delete Task">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12.56 0c.342.052.682.107 1.022.166m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg>
                            </button>
                        </div>
                    </div>
                    <div class="mt-2 text-xs text-muted-light dark:text-muted-dark">
                        <span>Start: ${formatDate(task.startDate)}</span> | <span>Deadline: ${formatDate(task.deadline)}</span>
                    </div>
                    ${subtasksHtml}
                `;
                taskList.appendChild(taskCard);
            });
            listViewEl.appendChild(taskList);

            // Add event listeners for task actions
            listViewEl.querySelectorAll('.edit-task-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const taskId = e.currentTarget.dataset.taskId;
                    const taskToEdit = tasks.find(t => t.id === taskId);
                    openTaskModal(taskToEdit);
                });
            });
            listViewEl.querySelectorAll('.delete-task-btn').forEach(btn => {
                btn.addEventListener('click', (e) => deleteTask(e.currentTarget.dataset.taskId));
            });
            listViewEl.querySelectorAll('.subtask-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    toggleSubtask(e.target.dataset.taskId, e.target.dataset.subtaskId);
                });
            });
        };

        const renderKanbanView = () => {
            kanbanViewEl.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'grid grid-cols-1 md:grid-cols-3 gap-4 h-full'; // Use h-full for parent height constraint

            Object.keys(KANBAN_COLUMNS).forEach(statusKey => {
                const column = document.createElement('div');
                column.className = 'bg-secondary-light dark:bg-secondary-dark p-3 rounded-lg flex flex-col'; // Use flex-col
                column.dataset.statusKey = statusKey;

                column.innerHTML = `<h3 class="font-semibold text-lg mb-3 px-1 text-text-light dark:text-text-dark">${KANBAN_COLUMNS[statusKey]}</h3>`;
                
                const tasksContainer = document.createElement('div');
                tasksContainer.className = 'space-y-3 overflow-y-auto flex-grow min-h-[20rem]'; // Added min-h for empty states, flex-grow
                tasksContainer.dataset.statusKey = statusKey; // For drop target identification
                
                tasksContainer.addEventListener('dragover', (e) => e.preventDefault()); // Allow drop
                tasksContainer.addEventListener('drop', handleKanbanDrop);

                const columnTasks = tasks.filter(task => task.status === statusKey);
                if (columnTasks.length === 0) {
                    tasksContainer.innerHTML = `<div class="text-center text-muted-light dark:text-muted-dark p-4 border-2 border-dashed border-border-light dark:border-border-dark rounded-md">No tasks here</div>`;
                } else {
                    columnTasks.forEach(task => {
                        const taskCard = document.createElement('div');
                        taskCard.className = `bg-card-light dark:bg-card-dark p-3 rounded-md shadow cursor-grab ${getPriorityClass(task.priority)}`;
                        taskCard.draggable = true;
                        taskCard.dataset.taskId = task.id;
                        taskCard.addEventListener('dragstart', handleKanbanDragStart);

                        const subtasksProgress = task.subtasks.length > 0 ? 
                            `(${task.subtasks.filter(st => st.completed).length}/${task.subtasks.length})` : '';

                        taskCard.innerHTML = `
                            <div class="flex justify-between items-start">
                                <h4 class="font-medium text-sm text-text-light dark:text-text-dark">${task.title}</h4>
                                <div class="flex space-x-1 flex-shrink-0 ml-1">
                                     <button class="edit-task-btn p-1 text-xs text-muted-light dark:text-muted-dark hover:text-primary-light dark:hover:text-primary-dark" data-task-id="${task.id}" aria-label="Edit Task">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" /></svg>
                                    </button>
                                    <button class="delete-task-btn p-1 text-xs text-muted-light dark:text-muted-dark hover:text-red-500 dark:hover:text-red-400" data-task-id="${task.id}" aria-label="Delete Task">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12.56 0c.342.052.682.107 1.022.166m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg>
                                    </button>
                                </div>
                            </div>
                            ${task.description ? `<p class="text-xs text-muted-light dark:text-muted-dark mt-0.5 truncate">${task.description}</p>` : ''}
                            ${task.subtasks.length > 0 ? `<p class="text-xs text-muted-light dark:text-muted-dark mt-1">Subtasks: ${subtasksProgress}</p>` : ''}
                            <div class="text-xs text-muted-light dark:text-muted-dark mt-1.5">
                                Deadline: ${formatDate(task.deadline)}
                            </div>
                        `;
                        tasksContainer.appendChild(taskCard);
                    });
                }
                column.appendChild(tasksContainer);
                container.appendChild(column);
            });
            kanbanViewEl.appendChild(container);
            
            kanbanViewEl.querySelectorAll('.edit-task-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent drag start on button click
                    const taskId = e.currentTarget.dataset.taskId;
                    const taskToEdit = tasks.find(t => t.id === taskId);
                    openTaskModal(taskToEdit);
                });
            });
            kanbanViewEl.querySelectorAll('.delete-task-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteTask(e.currentTarget.dataset.taskId)
                });
            });
        };

        const handleKanbanDragStart = (e) => {
            e.dataTransfer.setData('text/plain', e.target.dataset.taskId);
            e.dataTransfer.effectAllowed = 'move';
            e.target.classList.add('opacity-50');
        };

        const handleKanbanDrop = (e) => {
            e.preventDefault();
            const taskId = e.dataTransfer.getData('text/plain');
            const targetColumnStatus = e.currentTarget.dataset.statusKey;
            
            const task = tasks.find(t => t.id === taskId);
            if (task && task.status !== targetColumnStatus) {
                task.status = targetColumnStatus;
                saveTasks();
                renderApp(); // Re-render Kanban or all views
            }
            // Remove opacity from original dragged element (if it's still in DOM, though re-render handles this)
            const draggedEl = kanbanViewEl.querySelector(`[data-task-id="${taskId}"]`);
            if (draggedEl) draggedEl.classList.remove('opacity-50');
        };

        const initializeCalendar = () => {
            if (calendarInstance) {
                calendarInstance.destroy();
            }
            const calendarEvents = tasks.map(task => ({
                id: task.id,
                title: task.title,
                start: task.startDate, // Assumes YYYY-MM-DD
                end: task.deadline ? new Date(new Date(task.deadline).setDate(new Date(task.deadline).getDate() + 1)).toISOString().split('T')[0] : null, // FullCalendar 'end' is exclusive
                allDay: true, // Assuming all-day events for simplicity
                extendedProps: { taskId: task.id, priority: task.priority },
                className: getPriorityClass(task.priority).replace('border-l-4', 'fc-event-priority').split(' ')[0] // for custom class
            }));
            
            calendarInstance = new FullCalendar.Calendar(calendarEl, {
                plugins: [FullCalendar.dayGridPlugin, FullCalendar.interactionPlugin, FullCalendar.listPlugin],
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,dayGridWeek,listWeek'
                },
                events: calendarEvents,
                editable: true, // Allow event dragging/resizing
                eventDrop: (info) => {
                    const task = tasks.find(t => t.id === info.event.id);
                    if (task) {
                        task.startDate = info.event.start.toISOString().split('T')[0];
                        if (info.event.end) {
                             // Adjust for FullCalendar's exclusive end date
                            const endDate = new Date(info.event.end);
                            endDate.setDate(endDate.getDate() -1);
                            task.deadline = endDate.toISOString().split('T')[0];
                        } else { // If it becomes an event without an end (e.g. dropped on a single day from multi-day)
                            task.deadline = task.startDate;
                        }
                        saveTasks();
                        renderApp(); // May not be needed if calendar updates itself, but good for consistency
                    }
                },
                eventResize: (info) => {
                     const task = tasks.find(t => t.id === info.event.id);
                     if (task) {
                        task.startDate = info.event.start.toISOString().split('T')[0];
                        // Adjust for FullCalendar's exclusive end date
                        const endDate = new Date(info.event.end);
                        endDate.setDate(endDate.getDate() -1);
                        task.deadline = endDate.toISOString().split('T')[0];
                        saveTasks();
                        renderApp();
                     }
                },
                eventClick: (info) => {
                    const taskId = info.event.extendedProps.taskId;
                    const taskToEdit = tasks.find(t => t.id === taskId);
                    if (taskToEdit) {
                        openTaskModal(taskToEdit);
                    }
                },
                // Theming for dark mode (basic, more specific styles in <style> block)
                eventColor: document.documentElement.classList.contains('dark') ? '#6366f1' : '#4f46e5', // indigo-500 / indigo-600
            });
            calendarInstance.render();
        };
        
        const renderCalendarView = () => {
            initializeCalendar();
        };


        // --- View Switching and Main Render ---
        const switchView = (view) => {
            currentView = view;
            [listViewEl, kanbanViewEl, calendarViewEl].forEach(el => el.classList.add('hidden'));
            viewButtons.forEach(btn => btn.classList.remove('bg-primary-light', 'dark:bg-primary-dark', 'text-white', 'dark:text-slate-100'));
            viewButtons.forEach(btn => btn.classList.add('text-text-light', 'dark:text-text-dark', 'hover:bg-slate-200', 'dark:hover:bg-slate-700'));


            const activeBtnClasses = ['bg-primary-light', 'dark:bg-primary-dark', 'text-white', 'dark:text-slate-100'];
            const inactiveBtnClasses = ['text-text-light', 'dark:text-text-dark', 'hover:bg-slate-300', 'dark:hover:bg-slate-600'];

            if (view === 'list') {
                listViewEl.classList.remove('hidden');
                viewListBtn.classList.add(...activeBtnClasses);
                viewListBtn.classList.remove(...inactiveBtnClasses);
            } else if (view === 'kanban') {
                kanbanViewEl.classList.remove('hidden');
                viewKanbanBtn.classList.add(...activeBtnClasses);
                viewKanbanBtn.classList.remove(...inactiveBtnClasses);
            } else if (view === 'calendar') {
                calendarViewEl.classList.remove('hidden');
                viewCalendarBtn.classList.add(...activeBtnClasses);
                viewCalendarBtn.classList.remove(...inactiveBtnClasses);
            }
            renderApp();
            localStorage.setItem('todoAppLastView', view);
        };

        const renderApp = () => {
            if (currentView === 'list') {
                renderListView();
            } else if (currentView === 'kanban') {
                renderKanbanView();
            } else if (currentView === 'calendar') {
                // Calendar re-renders its own content; we mainly need to ensure its events are up-to-date
                if (calendarInstance) { // Check if calendar has been initialized
                    const calendarEvents = tasks.map(task => ({
                        id: task.id,
                        title: task.title,
                        start: task.startDate,
                        end: task.deadline ? new Date(new Date(task.deadline).setDate(new Date(task.deadline).getDate() + 1)).toISOString().split('T')[0] : null,
                        allDay: true,
                        extendedProps: { taskId: task.id, priority: task.priority },
                        className: getPriorityClass(task.priority).replace('border-l-4', 'fc-event-priority').split(' ')[0]
                    }));
                    calendarInstance.removeAllEvents();
                    calendarInstance.addEventSource(calendarEvents);
                } else if(calendarViewEl.classList.contains('hidden') === false) { // Only initialize if calendar view is active
                    renderCalendarView();
                }
            }
        };

        // --- Event Listeners for View Switching ---
        viewListBtn.addEventListener('click', () => switchView('list'));
        viewKanbanBtn.addEventListener('click', () => switchView('kanban'));
        viewCalendarBtn.addEventListener('click', () => switchView('calendar'));
        
        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            // Load theme
            const savedTheme = localStorage.getItem('todoAppTheme') || 'light';
            applyTheme(savedTheme);

            // Load tasks
            loadTasks();

            // Load last view or default to list
            const lastView = localStorage.getItem('todoAppLastView') || 'list';
            switchView(lastView); // This will call renderApp
        });

    </script>
</body>
</html>
